<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An open book with a DNA double helix rising from its spine, representing the Term 1 revision guide">
  <rect width="400" height="300" fill="#0b1320"/>
  <circle cx="200" cy="140" r="150" fill="#22c55e" opacity="0.14"/>
  <circle cx="200" cy="140" r="95" fill="#22c55e" opacity="0.14"/>

  <!-- open book -->
  <g transform="translate(200,178)">
    <path d="M0,-8 C-70,-34 -130,-22 -150,-6 L-150,30 C-130,14 -70,4 0,26 Z" fill="#162237"/>
    <path d="M0,-8 C70,-34 130,-22 150,-6 L150,30 C130,14 70,4 0,26 Z" fill="#1c2a44"/>
    <path d="M0,-8 L0,26" stroke="#334155" stroke-width="1.5"/>
    <g stroke="#334155" stroke-width="1.2" opacity="0.8">
      <path d="M-130,-8 C-90,-20 -50,-16 -14,-3"/>
      <path d="M-128,4 C-88,-8 -48,-4 -12,8"/>
      <path d="M-126,16 C-86,4 -46,8 -10,19"/>
