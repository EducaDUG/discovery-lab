    <path d="M14,0 C-6,-14 6,-26 -14,-40 C6,-54 -6,-66 14,-80" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="-11" y1="-8" x2="11" y2="-8"/>
      <line x1="9" y1="-28" x2="-9" y2="-28"/>
      <line x1="-11" y1="-48" x2="11" y2="-48"/>
      <line x1="9" y1="-68" x2="-9" y2="-68"/>
    </g>
