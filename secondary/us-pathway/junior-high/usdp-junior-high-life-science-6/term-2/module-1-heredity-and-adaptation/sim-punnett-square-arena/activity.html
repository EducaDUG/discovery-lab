  const shake = el => { if (!el || reduced()) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); };

  const TAB = [["learn",L("1 · Decode","1 · Descifra"),"#ffd34d"],["build",L("2 · Build a Square","2 · Construye"),"#2bf0a0"],["practice",L("3 · Practice","3 · Practica"),"#ff6fae"],["breed",L("4 · Nursery","4 · Guardería"),"#4aa8ff"],["birth",L("5 · Birth Day","5 · Día del parto"),"#ffb347"]];

  /* ---------- shared bits ---------- */
  const tr = () => T(st.trait);
  const traitPick = (act = "trait") => `<div class="ar-chips">${TRAITS.map(t => `<button class="ar-chip" data-act="${act}" data-v="${t.id}" aria-pressed="${st.trait === t.id}"><span class="dot" style="background:${t.domC}"></span><span>${t.name()}<small>${t.organism()}</small></span></button>`).join("")}</div>`;
  const genoPick = (who, cur) => `<div class="ar-seg" role="group" aria-label="${who === "mom" ? L("Mom's genotype","Genotipo de mamá") : L("Dad's genotype","Genotipo de papá")}">${gList(tr()).map(g => `<button data-act="${who}" data-v="${g}" aria-pressed="${cur === g}"><span class="bigG">${gH(g)}</span><small style="display:block;font-size:.62rem;font-weight:800">${phenoOf(tr(), g)}</small></button>`).join("")}</div>`;
  const sqHTML = (o) => { /* o: top[2]|null, side[2]|null, cells[4] (genotype|null), cellAct, sel, hl[], bad[], showPheno */
    const t = tr(); const hd = (v, k, who) => v ? `<div class="pq-h ${who} full" ${o.hdAct ? `` : ""}>${gH(v)}</div>` : `<div class="pq-h ${who}" ${o.slotAct ? `` : ""}>${who === "mom" ? "♀" : "♂"}</div>`;
    const slot = (v, id, who) => o.slotAct ? `<button class="pq-h ${who} ${v ? "full" : ""}" data-act="bslot" data-v="${id}" aria-label="${who === "mom" ? L("Mom's gamete slot","Casilla de gameto de mamá") : L("Dad's gamete slot","Casilla de gameto de papá")}">${v ? gH(v) : (who === "mom" ? "♀ ?" : "♂ ?")}</button>` : hd(v, id, who);
    let h = `<div class="pq-sq"><div class="pq-corner">♀ ${L("Mom","Mamá")} →<br>↓ ♂ ${L("Dad","Papá")}</div>${slot(o.top?.[0], "top0", "mom")}${slot(o.top?.[1], "top1", "mom")}`;
    for (let r = 0; r < 2; r++) { h += slot(o.side?.[r], "side" + r, "dad");
      for (let c = 0; c < 2; c++) { const k = r * 2 + c, g = o.cells[k]; const cls = ["pq-c", g ? "fill" : "", o.sel === k ? "sel" : "", (o.hl || []).includes(k) ? "hl" : "", (o.bad || []).includes(k) ? "bad" : ""].join(" ");
        const inner = g ? `<span>${gH(g)}</span>${o.showPheno ? `<small>${phenoOf(t, g)}</small>` : ""}` : "?";
        h += o.cellAct ? `<button class="${cls}" data-act="${o.cellAct}" data-v="${k}" aria-label="${L("Box","Casilla")} ${k + 1}${g ? ": " + g : ""}">${inner}</button>` : `<div class="${cls}">${inner}</div>`; } }
    return h + "</div>"; };
  const tally = (m, d) => { const t = tr(), cs = cellsOf(m, d), geno = {}, ph = { d: 0, r: 0 }; cs.forEach(g => { geno[g] = (geno[g] || 0) + 1; isDom(g) ? ph.d++ : ph.r++; }); return { cs, geno, ph, t }; };
  const resultsHTML = (m, d) => { const { geno, ph, t } = tally(m, d);
    const gRows = gList(t).filter(g => geno[g]).map(g => `<tr><td>${gH(g)}</td><td>${zyg(g)}</td><td>${geno[g]} / 4</td><td><b>${geno[g] * 25}%</b></td></tr>`).join("");
    const ratio = ph.r === 0 ? L("all show the dominant trait","todos muestran el rasgo dominante") : ph.d === 0 ? L("all show the recessive trait","todos muestran el rasgo recesivo") : `${ph.d} : ${ph.r}`;
    return `<table class="pq-res"><tr><th>${L("Genotype","Genotipo")}</th><th></th><th>${L("Boxes","Casillas")}</th><th>%</th></tr>${gRows}</table>
    <table class="pq-res"><tr><th>${L("Phenotype","Fenotipo")}</th><th>${L("Boxes","Casillas")}</th><th>%</th></tr>
    ${ph.d ? `<tr><td>${t.dom()}</td><td>${ph.d} / 4</td><td><b>${ph.d * 25}%</b></td></tr>` : ""}${ph.r ? `<tr><td>${t.rec()}</td><td>${ph.r} / 4</td><td><b>${ph.r * 25}%</b></td></tr>` : ""}
    <tr><td colspan="3">${L("Phenotype ratio","Proporción de fenotipos")}: <b>${ratio}</b></td></tr></table>`; };
  function setCross(trait, mom, dad) { st.trait = trait; st.mom = mom; st.dad = dad; }

  /* ================= STATION RENDERERS ================= */
  const TERMS = [
    ["gene", L("Gene","Gen")], ["allele", L("Allele","Alelo")], ["genotype", L("Genotype","Genotipo")], ["phenotype", L("Phenotype","Fenotipo")],
    ["dominant", L("Dominant & recessive","Dominante y recesivo")], ["homo", L("Homozygous & heterozygous","Homocigoto y heterocigoto")], ["gametes", L("Gametes","Gametos")],
  ];
  const chromo = (g) => `<svg viewBox="0 0 160 96" class="pq-chr" role="img" aria-label="${L("A pair of chromosomes carrying the alleles","Un par de cromosomas con los alelos")} ${g}"><rect x="30" y="6" width="26" height="84" rx="13" fill="#4aa8ff"/><rect x="104" y="6" width="26" height="84" rx="13" fill="#ff6fae"/><rect x="28" y="40" width="30" height="14" rx="3" fill="#fff"/><rect x="102" y="40" width="30" height="14" rx="3" fill="#fff"/><text x="43" y="52" text-anchor="middle" font-weight="900" font-size="15" fill="${g[0] === g[0].toUpperCase() ? "#b07a00" : "#1f6fb0"}">${g[0]}</text><text x="117" y="52" text-anchor="middle" font-weight="900" font-size="15" fill="${g[1] === g[1].toUpperCase() ? "#b07a00" : "#1f6fb0"}">${g[1]}</text><text x="43" y="92" text-anchor="middle" font-size="9" font-weight="800" fill="#cfe6f6">♂ ${L("Dad","Papá")}</text><text x="117" y="92" text-anchor="middle" font-size="9" font-weight="800" fill="#cfe6f6">♀ ${L("Mom","Mamá")}</text></svg>`;
  const explain = (k) => { const t = tr(), g = st.mom, D = t.L, r = t.L.toLowerCase(); switch (k) {
    case "gene": return `<p>${L(`A <b>gene</b> is an instruction for ONE trait. This gene is the instruction for <b>${t.name().toLowerCase()}</b>.`,`Un <b>gen</b> es una instrucción para UN rasgo. Este gen es la instrucción para <b>${t.name().toLowerCase()}</b>.`)}</p>`;
    case "allele": return `<p>${L(`An <b>allele</b> is one version of a gene. This gene has two: <b>${D}</b> (${t.dom()}) and <b>${r}</b> (${t.rec()}). Every body cell carries TWO alleles, one from each parent:`,`Un <b>alelo</b> es una versión de un gen. Este gen tiene dos: <b>${D}</b> (${t.dom()}) y <b>${r}</b> (${t.rec()}). Cada célula del cuerpo lleva DOS alelos, uno de cada progenitor:`)}</p>${chromo(g)}`;
    case "genotype": return `<p>${L(`The <b>genotype</b> is the pair of alleles an organism carries, written as letters. The specimen's genotype is`,`El <b>genotipo</b> es el par de alelos que lleva un organismo, escrito con letras. El genotipo del espécimen es`)} <span class="bigG">${gH(g)}</span>. ${L("You cannot SEE a genotype.","No se puede VER un genotipo.")}</p>`;
    case "phenotype": return `<p>${L(`The <b>phenotype</b> is the trait you can actually SEE. For genotype`,`El <b>fenotipo</b> es el rasgo que realmente puedes VER. Para el genotipo`)} ${gH(g)} ${L("the phenotype is","el fenotipo es")} <b>${phenoOf(t, g)}</b>. ${L("Look at the 3D specimen!","¡Mira el espécimen en 3D!")}</p>`;
    case "dominant": return `<p>${L(`<b>Dominant</b> alleles are written as a CAPITAL letter (<b>${D}</b>) and show up whenever at least one copy is present. <b>Recessive</b> alleles are lowercase (<b>${r}</b>) and only show up when there are TWO copies (<b>${r}${r}</b>).`,`Los alelos <b>dominantes</b> se escriben con MAYÚSCULA (<b>${D}</b>) y se ven siempre que haya al menos una copia. Los <b>recesivos</b> van en minúscula (<b>${r}</b>) y solo se ven cuando hay DOS copias (<b>${r}${r}</b>).`)}</p><p>${L("Try each genotype on the left and watch the 3D specimen!","¡Prueba cada genotipo a la izquierda y mira el espécimen en 3D!")}</p>`;
    case "homo": return `<p>${L(`<b>Homozygous</b> = two SAME alleles (${D}${D} or ${r}${r}). <b>Heterozygous</b> = two DIFFERENT alleles (${D}${r}).`,`<b>Homocigoto</b> = dos alelos IGUALES (${D}${D} o ${r}${r}). <b>Heterocigoto</b> = dos alelos DISTINTOS (${D}${r}).`)}</p><p>${L("The specimen is","El espécimen es")} <span class="bigG">${gH(g)}</span> = <b>${zyg(g)}</b>.</p>`;
    case "gametes": { const gm = [g[0], g[1]]; return `<p>${L(`<b>Gametes</b> are egg and sperm cells. Each gamete gets only ONE allele from the pair, so the pair splits in two.`,`Los <b>gametos</b> son los óvulos y espermatozoides. Cada gameto recibe solo UN alelo del par, así que el par se separa en dos.`)}</p>

      ${st.split ? `<p>${L(`${g} makes gametes <b>${gm[0]}</b> and <b>${gm[1]}</b>.`,`${g} produce los gametos <b>${gm[0]}</b> y <b>${gm[1]}</b>.`)}</p>` : ""}`; } } return ""; };
  const R = {};

      <p><span class="tag m">${L("Genotype","Genotipo")}</span> ${gH(st.mom)} &nbsp; <span class="tag d">${L("Phenotype","Fenotipo")}</span> <b>${phenoOf(tr(), st.mom)}</b></p></div>

  const STEPS = [L("1 Parents","1 Padres"), L("2 Gametes","2 Gametos"), L("3 Place","3 Colocar"), L("4 Fill","4 Rellenar"), L("5 Read","5 Leer")];

        <button class="ar-go" data-act="bnext">${L("Lock in these parents","Fijar estos padres")} →</button><button class="ar-go ar-go--ghost" data-act="rand">${L("Surprise me","Sorpréndeme")}</button></div>
        <div class="ar-card" style="--c:#2bf0a0"><h3>${L("What you will build","Lo que vas a construir")}</h3><p>${L("A <b>Punnett square</b> predicts the genotypes and phenotypes of the offspring. Remember the two words:","Un <b>cuadro de Punnett</b> predice los genotipos y fenotipos de la descendencia. Recuerda las dos palabras:")}</p><p><b>${L("Genotype","Genotipo")}</b> = ${L("the letters (the alleles)","las letras (los alelos)")}<br><b>${L("Phenotype","Fenotipo")}</b> = ${L("what you can see","lo que se ve")}</p>${sq({ cells: [null,null,null,null] })}<p style="text-align:center">${L("An empty square waiting for gametes!","¡Un cuadro vacío esperando gametos!")}</p></div>`; }
    else if (b.step === 2) { const half = (who, g, done) => `<div style="margin:6px 0"><span class="tag ${who}">${who === "m" ? "♀ " + L("MOM","MAMÁ") : "♂ " + L("DAD","PAPÁ")}</span> ${L("genotype","genotipo")} <span class="bigG">${gH(g)}</span> <b>(${phenoOf(t, g)})</b>
        ${done ? `<div class="pq-gam">${g.split("").map(a => `<div class="g" style="border-color:${who === "m" ? "var(--mom)" : "var(--dad)"}">${gH(a)}</div>`).join("")}</div><p>${L(`${who === "m" ? "Her" : "His"} gametes: <b>${g[0]}</b> and <b>${g[1]}</b>`,`Gametos ${who === "m" ? "de ella" : "de él"}: <b>${g[0]}</b> y <b>${g[1]}</b>`)}</p>` : `<button class="ar-go ar-go--ghost ar-go--sm" data-act="bsplit" data-v="${who}">${L("Split into gametes","Separar en gametos")}</button>`}</div>`;
      left = `<div class="ar-card" style="--c:#2bf0a0"><h3>${L("Step 2 · Make the gametes","Paso 2 · Haz los gametos")}</h3><p>${L("A <b>gamete</b> (egg or sperm) carries just ONE allele from each parent's pair. Split both parents.","Un <b>gameto</b> (óvulo o espermatozoide) lleva solo UN alelo del par de cada progenitor. Separa a los dos padres.")}</p>${half("m", st.mom, b.split.m)}${half("d", st.dad, b.split.d)}</div><div class="ar-card" style="--c:#2bf0a0"><h3>${L("Your square","Tu cuadro")}</h3>${sq({})}</div>`; }

      left = `<div class="ar-card" style="--c:#2bf0a0"><h3>${L("Step 3 · Place the gametes","Paso 3 · Coloca los gametos")}</h3><p>${L("Rule of the game: <span class=\"tag m\">♀ MOM's</span> gametes go along the <b>TOP</b>. <span class=\"tag d\">♂ DAD's</span> gametes go down the <b>SIDE</b>.","Regla del juego: los gametos de <span class=\"tag m\">♀ MAMÁ</span> van en la parte de <b>ARRIBA</b>. Los de <span class=\"tag d\">♂ PAPÁ</span> van por el <b>LADO</b>.")}</p><p style="color:#9ec4d8;font-size:.82rem">${L("(Scientists agree on one layout so every square looks the same. The answer is the same if you swap them.)","(Los científicos acordaron un diseño para que todos los cuadros se vean igual. La respuesta es la misma si los cambias.)")}</p>

    else if (b.step === 4) { const k = b.sel; const col = k == null ? null : pm[k & 1] ;
      left = `<div class="ar-card" style="--c:#2bf0a0"><h3>${L("Step 4 · Fill every box","Paso 4 · Rellena cada casilla")}</h3><p>${L("Each box = the <b>column</b> letter (from Mom) + the <b>row</b> letter (from Dad). Write the capital letter first.","Cada casilla = la letra de la <b>columna</b> (de mamá) + la letra de la <b>fila</b> (de papá). Escribe primero la mayúscula.")}</p>

        ${b.ans === "ok" ? `<div class="ar-fb good">${L("Perfect! You built, filled and read a whole Punnett square.","¡Perfecto! Construiste, rellenaste y leíste un cuadro de Punnett completo.")}</div><button class="ar-go" data-act="bnew">${L("Build another square","Construir otro cuadro")} →</button>` :

          const nx = b.cells.findIndex(x => !x); if (nx >= 0) b.sel = nx; else { b.step = 5; b.sel = null; b.fb = ""; say(L("Square complete! Now read the results.","¡Cuadro completo! Ahora lee los resultados."), "good"); } }
        else { b.fb = L(`Not ${v}. The column gives ${pm[k & 1]} and the row gives ${pd[k >> 1]}. Put them together, capital letter first.`, `No es ${v}. La columna da ${pm[k & 1]} y la fila da ${pd[k >> 1]}. Júntalas, mayúscula primero.`); b.fbk = "bad"; shake(panel.querySelector(`[data-v="${v}"]`)); say(b.fb, "bad"); } break; }
      case "bans": { const right = tally(st.mom, st.dad).ph.r * 25;
        if (+v === right) { b.ans = "ok"; gain(10); mark("build"); st.sqDone = (st.sqDone || 0) + 1; vm.fx = [["k0", 0x2bf0a0, 25], ["k1", 0x2bf0a0, 25], ["k2", 0x2bf0a0, 25], ["k3", 0x2bf0a0, 25]]; say(L("Brilliant!","¡Genial!"), "good"); }
        else { b.ans = +v; b.fb = L(`Not quite. Count the boxes that show ${tr().rec()} and multiply by 25%.`, `Casi. Cuenta las casillas con ${tr().rec()} y multiplica por 25%.`); b.fbk = "bad"; shake(panel.querySelector(`[data-v="${v}"]`)); } break; }
      case "bnew": { const t = pickR(TRAITS.filter(x => x.id !== st.trait)); setCross(t.id, pickR(gList(t)), pickR(gList(t))); resetBuild(); say(L("New parents, new square!","¡Padres nuevos, cuadro nuevo!"), "good"); break; }
      case "pcyc": { const c = st.p.cur; if (c.done) break; c.fill[+v] = ((c.fill[+v] ?? -1) + 1) % 3; c.bad = c.bad.filter(x => x !== +v); break; }
      case "pcheck": { const c = st.p.cur, t = T(c.trait), gl = gList(t); c.tries++; c.bad = c.fill.map((x, k) => gl[x] === c.cells[k] ? -1 : k).filter(x => x >= 0);
        if (!c.bad.length) finish(c, true); else if (c.tries >= 2) { c.fill = c.cells.map(g => gl.indexOf(g)); c.bad = []; finish(c, false); } else { say(L("Some boxes are wrong. Try again!","Algunas casillas están mal. ¡Inténtalo otra vez!"), "bad"); shake(panel.querySelector(".pq-sq")); } break; }
      case "pshow": st.p.cur.hint = true; break;
      case "pans": { const c = st.p.cur; if (c.done) break; c.pick = v; finish(c, String(v) === String(c.answer)); break; }
      case "pnext": newChallenge(); st.trait = st.p.cur.trait; break;
      case "baby": { const n = +v, cs = cellsOf(st.mom, st.dad), b2 = st.br; let lastK = 0; for (let i = 0; i < n; i++) { lastK = Math.floor(Math.random() * 4); b2.counts[lastK]++; b2.total++; }
        vm.hot = lastK; scene3d?.bounce(lastK); vm.fx = [["k" + lastK, 0x4aa8ff, 35]]; gain(n === 1 ? 1 : n === 4 ? 2 : 4); say(L(`Newest baby: ${cs[lastK]} (${phenoOf(tr(), cs[lastK])}).`, `Última cría: ${cs[lastK]} (${phenoOf(tr(), cs[lastK])}).`), "good"); if (b2.total >= 100) mark("breed"); break; }
      case "pgstart": { const pg = st.pg; if (pg.phase === "running") break; const gs = gestOf(st.trait); Object.assign(pg, { phase: "running", week: 0, k: Math.floor(Math.random() * 4), t0: performance.now() }); vm.preg = 0; setCam("parents");
        say(L("The pregnancy begins. The genotype is already decided, but nobody can see it yet.", "Empieza el embarazo. El genotipo ya está decidido, pero nadie puede verlo todavía."), "good"); clearInterval(pgTimer); const step = 9000 / gs.w;
        pgTimer = setInterval(() => { if (st.pg.phase !== "running") { clearInterval(pgTimer); return; } const wk = Math.min(gs.w, Math.floor((performance.now() - st.pg.t0) / step)); if (wk !== st.pg.week) { st.pg.week = wk; vm.preg = wk / gs.w; if (st.tab === "birth") pgUpdate(); } if (wk >= gs.w) finishBirth(); }, 120); break; }
      case "pgskip": finishBirth(); return;
      case "breset": st.br = { counts: [0,0,0,0], total: 0, last: null }; vm.hot = null; break;
    }
    api.save(); paint();
  }

  /* a little age-appropriate humour on birth day */
  const NAMES = id => id === "eyes" ? ["Waffles","Pickle","Nugget","Biscuit","Bubbles","Peanut","Muffin"] : id === "dog" ? ["Sir Fluffington","Biscuit","Mochi","Captain Zoomies","Waffles","Sausage"] : [L("Sprout Sprinkles","Brote Chispitas"),L("Leafy McLeaf","Hojita Verdi"),L("Pea-ter Pan","Guisanti Pan"),L("Sir Sprouts-a-lot","Sir Brotes-mucho"),L("Pod Stewart","Vaina Marley")];
  const JOKES = id => id === "eyes" ? [L("The doctor says: 10 fingers, 10 toes and 0 patience.","La doctora dice: 10 dedos de las manos, 10 de los pies y 0 paciencia."),L("The baby arrives and instantly demands snacks.","El bebé llega y exige snacks al instante."),L("A tiny, very serious face looks around like a little boss.","Una carita muy seria mira alrededor como una jefecita."),L("Mom to Baby: 'You were worth the 40 weeks.' Baby: 'I did not agree to a schedule.'","Mamá al bebé: 'Valió la pena esperar 40 semanas.' Bebé: 'Yo no acepté ningún horario.'")]
    : id === "dog" ? [L("The puppy trips over its own ears and falls asleep. Perfect landing.","El cachorro se tropieza con sus propias orejas y se duerme. Aterrizaje perfecto."),L("The puppy has already chewed Dad's shoe. It is 4 minutes old.","El cachorro ya mordió el zapato de papá. Tiene 4 minutos de vida."),L("Zero tricks learned so far, but 100% cuteness.","Cero trucos aprendidos, pero 100% de ternura.")]
    : [L("A tiny sprout stretches and asks: 'Is this the sunshine I ordered?'","Un brote diminuto se estira y pregunta: '¿Es este el sol que pedí?'"),L("The seedling waves a leaf and shows off already.","La plántula saluda con una hoja y ya presume."),L("Pop! A new little plant. It is already thirsty.","¡Pop! Una plantita nueva. Ya tiene sed.")];
  const WORDS = id => id === "eyes" ? [L("Waaah! Where is the Wi-Fi?","¡Buaaa! ¿Dónde está el wifi?"),L("Is it snack time yet?","¿Ya es hora del snack?"),L("Hello world! Please be gentle.","¡Hola mundo! Sean amables.")]
    : id === "dog" ? [L("Woof! Is that a ball?!","¡Guau! ¿Eso es una pelota?!"),L("Woof! I love everyone already!","¡Guau! ¡Ya los quiero a todos!")]
    : [L("Sunshine, please!","¡Sol, por favor!"),L("Leaf me alone, I'm growing!","¡Déjenme crecer, soy una hoja en proceso!")];
  const twist = ch => ch >= 100 ? L("Totally predictable, like a pizza with cheese.","Totalmente predecible, como una pizza con queso.") : ch <= 25 ? L("Plot twist! Even the Punnett square raised an eyebrow.","¡Giro de la trama! Hasta el cuadro de Punnett levantó una ceja.") : L("Not shocking, but still exciting!","No es sorprendente, ¡pero igual emociona!");
  const bubble = txt => { const b = $(`<div class="ar-bubble" role="status">${esc(txt)}</div>`); view.append(b); setTimeout(() => b.remove(), 5600); };
  let pgTimer = null;
  function finishBirth() { clearInterval(pgTimer); const pg = st.pg; if (pg.phase !== "running") return; const cs = cellsOf(st.mom, st.dad), g = cs[pg.k], t = tr();
    pg.phase = "born"; pg.week = gestOf(t.id).w; vm.preg = 0; pg.kids = [null, null, null, null]; pg.kids[pg.k] = g;
    pg.album.push({ cross: st.mom + "×" + st.dad, pheno: phenoOf(t, g), chance: cs.filter(x => isDom(x) === isDom(g)).length * 25 });
    pg.name = pickR(NAMES(t.id)); pg.joke = pickR(JOKES(t.id)); pg.twist = twist(pg.album[pg.album.length - 1].chance); bubble(pickR(WORDS(t.id)));
    vm.fx = [["k" + pg.k, 0xffd34d, 70], ["k" + pg.k, 0xff6fae, 40], ["k" + pg.k, 0x2bf0a0, 40]]; scene3d?.bounce(pg.k); setCam("kids"); gain(6); say(L(`It's here! ${phenoOf(t, g)}.`, `¡Ya llegó! ${phenoOf(t, g)}.`), "good"); if (pg.album.length >= 3) mark("birth"); api.save(); if (st.tab === "birth") paint(); }
  function finish(c, good) { c.done = true; c.ok = good; const p = st.p; p.n++; if (good) { p.ok++; p.streak++; p.best = Math.max(p.best, p.streak); gain(c.hint ? 6 : 10 + Math.min(6, Math.max(0, p.streak - 2) * 2)); vm.fx = [["k0", 0x2bf0a0, 25], ["k1", 0x2bf0a0, 25], ["k2", 0x2bf0a0, 25], ["k3", 0x2bf0a0, 25]]; say(L("Correct!","¡Correcto!"), "good"); if (p.ok >= 8) mark("practice"); } else { p.streak = 0; vm.fx = [["mom", 0xff5468, 20]]; say(L("Not this time. Read why and try the next one.","Esta vez no. Lee por qué y prueba el siguiente.", "bad"), "bad"); } api.save(); }

  /* ================= PAINT + 3D SYNC ================= */
  function syncVm() {
    const c = st.p.cur; vm.trait = st.trait; vm.hot = st.tab === "breed" ? vm.hot : null; vm.momLabel = vm.dadLabel = null; vm.pregOn = st.tab === "birth"; if (st.tab !== "birth") vm.preg = 0;
    if (st.tab === "learn") { Object.assign(vm, { mom: st.mom, dad: st.dad, kids: null, solo: true }); scene3d?.goto("solo"); }
    else if (st.tab === "build") { const b = st.b; Object.assign(vm, { mom: st.mom, dad: st.dad, solo: false, kids: b.cells.map(x => x) }); scene3d?.goto(camName === "all" ? "all" : camName); }
    else if (st.tab === "practice") { if (!c) return; vm.trait = c.trait; vm.solo = false; vm.mom = c.mom; vm.dad = c.dad; if (c.type === "mystery" && !c.done) { vm.momLabel = L("MOM  ??","MAMÁ  ??"); vm.dadLabel = c.v === "A" ? L("DAD  ??","PAPÁ  ??") : L("DAD  ","PAPÁ  ") + c.dad; if (c.v === "A") { vm.mom = c.mom; } }
      vm.kids = c.done ? c.cells : null; scene3d?.goto(camName); }
    else if (st.tab === "birth") { Object.assign(vm, { mom: st.mom, dad: st.dad, solo: false, kids: st.pg.phase === "born" ? st.pg.kids : null }); if (st.pg.phase === "running") vm.preg = st.pg.week / gestOf(st.trait).w; else vm.preg = 0; scene3d?.goto(camName); }
    else { Object.assign(vm, { mom: st.mom, dad: st.dad, solo: false, kids: cellsOf(st.mom, st.dad) }); scene3d?.goto(camName === "all" ? "all" : camName); }
  }
  function paint() {
    const a = document.activeElement, key = a && panel.contains(a) && a.dataset.act ? [a.dataset.act, a.dataset.v] : null;
    panel.innerHTML = R[st.tab]();
    if (key) { const n = panel.querySelector(`[data-act="${key[0]}"]` + (key[1] != null ? `[data-v="${key[1]}"]` : "")); if (n && !n.disabled) n.focus({ preventScroll: true }); }
    syncVm(); renderTop(); }
  function select(id) { st.tab = id; api.save(); stationsEl.querySelectorAll(".ar-st").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === id))); paint();
    say({ learn: L("Decode the words of genetics, one tap at a time.","Descifra las palabras de la genética, un toque a la vez."), build: L("Let's build a Punnett square step by step.","Construyamos un cuadro de Punnett paso a paso."), practice: L("Practice crosses: new traits and parents every time.","Cruces de práctica: rasgos y padres nuevos cada vez."), breed: L("Have babies and compare real results with the prediction.","Ten crías y compara los resultados reales con la predicción."), birth: L("Follow one pregnancy from the first week to birth day.","Sigue un embarazo desde la primera semana hasta el parto.") }[id]); }
  panel.addEventListener("click", e => { const x = e.target.closest("[data-act]"); if (!x || x.disabled) return; act(x.dataset.act, x.dataset.v); });
  rt.onKid = k => { if (st.tab === "breed" || st.tab === "build") { vm.hot = k; scene3d?.bounce(k); const g = cellsOf(st.mom, st.dad)[k]; say(L(`Offspring ${k + 1}: ${g} → ${phenoOf(tr(), g)}`, `Cría ${k + 1}: ${g} → ${phenoOf(tr(), g)}`), "good"); } };

  host.append(root); select(st.tab);
  initScene(view, vm, rt).then(s => { scene3d = s; if (s) { s.goto(st.tab === "learn" ? "solo" : "all"); syncVm(); } else view.prepend($(`<div class="ar-nogl">${L("3D view is not available on this device, but every control below still works.","La vista 3D no está disponible en este dispositivo, pero todos los controles de abajo funcionan.")}</div>`)); })
    .catch(e => console.error("3D scene failed", e));
}

mountExternalActivity({ simulation: mkSim }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
