<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A stylised low-poly wetland at golden hour: open water ringed by reeds and trees, with a bird in flight">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ee"/><stop offset="0.55" stop-color="#e7f0df"/><stop offset="1" stop-color="#dfe7c8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4bb0a6"/><stop offset="1" stop-color="#2f7d76"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6a0"/><stop offset="1" stop-color="#ffd873" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="200" fill="url(#sky)"/>
  <circle cx="250" cy="46" r="46" fill="url(#sun)"/>
  <circle cx="250" cy="46" r="17" fill="#ffdd7a"/>

  <!-- distant hills -->
  <path d="M0 120 L60 96 L120 116 L190 92 L260 114 L320 98 L320 150 L0 150 Z" fill="#a9c07a" opacity="0.7"/>
  <path d="M0 132 L70 118 L150 134 L230 116 L320 130 L320 160 L0 160 Z" fill="#8faa5f"/>

  <!-- ground -->
  <rect y="150" width="320" height="50" fill="#cdd9a0"/>
  <!-- ochre shore ring -->
  <ellipse cx="160" cy="176" rx="150" ry="34" fill="#c3a15a"/>
  <!-- open water -->
  <ellipse cx="160" cy="178" rx="128" ry="26" fill="url(#water)"/>
  <ellipse cx="128" cy="172" rx="46" ry="8" fill="#ffffff" opacity="0.12"/>

  <!-- low-poly trees -->
  <g>
    <polygon points="28,150 40,124 52,150" fill="#4e7a3a"/><rect x="37" y="150" width="6" height="10" fill="#6b4f34"/>
    <polygon points="292,150 302,128 312,150" fill="#3d6330"/><rect x="299" y="150" width="6" height="9" fill="#6b4f34"/>
  </g>

  <!-- reeds around the water -->
  <g stroke="#7c9a3e" stroke-width="2.4" stroke-linecap="round">
    <line x1="46" y1="182" x2="44" y2="164"/><line x1="58" y1="188" x2="57" y2="168"/>
    <line x1="262" y1="184" x2="264" y2="164"/><line x1="276" y1="180" x2="278" y2="162"/>
    <line x1="150" y1="200" x2="149" y2="182"/><line x1="166" y1="200" x2="168" y2="180"/>
  </g>
  <g fill="#8a6d2f"><circle cx="44" cy="164" r="2"/><circle cx="57" cy="168" r="2"/><circle cx="264" cy="164" r="2"/><circle cx="278" cy="162" r="2"/></g>

  <!-- bird in flight -->
  <path d="M120 66 q10 -8 20 0 q10 -8 20 0" fill="none" stroke="#3a4a55" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M186 84 q7 -6 14 0 q7 -6 14 0" fill="none" stroke="#3a4a55" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
