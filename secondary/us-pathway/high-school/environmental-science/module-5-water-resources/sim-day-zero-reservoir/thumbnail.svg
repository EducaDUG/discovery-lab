<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A stylised canyon reservoir at low water, with a pale bathtub-ring band exposed above the current water line, a dam wall and a stranded dock">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0f2"/><stop offset="0.6" stop-color="#e8dcc4"/><stop offset="1" stop-color="#e3c9a0"/>
    </linearGradient>
    <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f95ac"/><stop offset="1" stop-color="#1d5b72"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#sky2)"/>
  <circle cx="256" cy="42" r="20" fill="#fff0cf"/>

  <!-- canyon walls -->
  <path d="M0 130 L44 60 L86 100 L120 52 L162 96 L320 40 L320 200 L0 200 Z" fill="#8a5d3c"/>
  <path d="M0 150 L60 96 L110 128 L150 84 L200 122 L260 78 L320 108 L320 200 L0 200 Z" fill="#a5724a"/>

  <!-- exposed bathtub-ring band (pale mineral stain) -->
  <path d="M0 152 L60 100 L110 130 L150 88 L200 124 L260 82 L320 110 L320 138 L260 108 L200 148 L150 116 L110 154 L60 128 L0 176 Z" fill="#dcccA0"/>

  <!-- current water line -->
  <path d="M0 176 L60 128 L110 154 L150 116 L200 148 L260 108 L320 138 L320 200 L0 200 Z" fill="url(#water2)"/>
  <ellipse cx="120" cy="170" rx="46" ry="6" fill="#ffffff" opacity="0.14"/>

  <!-- dam wall -->
  <rect x="270" y="70" width="16" height="120" fill="#cfcabb"/>
  <rect x="270" y="70" width="16" height="12" fill="#a9a48f"/>

  <!-- stranded dock -->
  <g stroke="#6b4a2c" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="150" x2="70" y2="150"/>
    <line x1="46" y1="150" x2="46" y2="164"/>
    <line x1="64" y1="150" x2="64" y2="164"/>
  </g>
  <ellipse cx="52" cy="176" rx="10" ry="4" fill="#c0453a"/>

  <!-- reeds -->
  <g stroke="#5a7a3e" stroke-width="2.2" stroke-linecap="round">
    <line x1="230" y1="126" x2="228" y2="108"/><line x1="240" y1="130" x2="239" y2="112"/>
  </g>
</svg>
