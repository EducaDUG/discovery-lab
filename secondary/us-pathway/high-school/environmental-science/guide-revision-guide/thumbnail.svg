<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An open book with a small sprout growing from its spine, representing the course revision guide">
  <rect width="400" height="300" fill="#1B2B1F"/>
  <circle cx="200" cy="140" r="150" fill="#40634C" opacity="0.22"/>
  <circle cx="200" cy="140" r="95" fill="#40634C" opacity="0.18"/>

  <!-- open book -->
  <g transform="translate(200,178)">
    <path d="M0,-8 C-70,-34 -130,-22 -150,-6 L-150,30 C-130,14 -70,4 0,26 Z" fill="#F2EFE6"/>
    <path d="M0,-8 C70,-34 130,-22 150,-6 L150,30 C130,14 70,4 0,26 Z" fill="#EAE6D9"/>
    <path d="M0,-8 L0,26" stroke="#C9C2AC" stroke-width="1.5"/>
    <g stroke="#C9C2AC" stroke-width="1.2" opacity="0.8">
