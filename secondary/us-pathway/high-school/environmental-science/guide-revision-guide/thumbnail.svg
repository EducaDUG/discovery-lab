    <path d="M0,-30 C-18,-34 -26,-48 -22,-60 C-8,-58 -2,-44 0,-30 Z" fill="#B5551F"/>
    <path d="M0,-38 C18,-42 26,-54 23,-64 C10,-62 2,-50 0,-38 Z" fill="#7FB08D"/>
