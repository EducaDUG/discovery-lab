<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mission: Blue Planet thumbnail">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe9f5"/>
      <stop offset="100%" stop-color="#eaf6fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa6c9"/>
      <stop offset="55%" stop-color="#1c6f8f"/>
      <stop offset="100%" stop-color="#0c3a4f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="100%" stop-color="#fff6c9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="320" cy="60" r="70" fill="url(#sun)"/>
  <circle cx="320" cy="60" r="26" fill="#ffe37a"/>
  <rect y="120" width="400" height="180" fill="url(#sea)"/>
  <path d="M0 120 Q40 108 80 120 T160 120 T240 120 T320 120 T400 120 V300 H0 Z" fill="#ffffff" opacity=".25"/>
  <!-- hydrometer -->
  <g transform="translate(150,150)">
    <rect x="-3" y="0" width="6" height="60" rx="3" fill="#eaf6fb" stroke="#134e6f" stroke-width="1.5"/>
    <circle cx="0" cy="70" r="14" fill="#eaf6fb" stroke="#134e6f" stroke-width="1.5"/>
    <circle cx="0" cy="82" r="7" fill="#c94b3f"/>
    <line x1="-3" y1="10" x2="3" y2="10" stroke="#134e6f" stroke-width="1"/>
    <line x1="-3" y1="22" x2="3" y2="22" stroke="#134e6f" stroke-width="1"/>
    <line x1="-3" y1="34" x2="3" y2="34" stroke="#134e6f" stroke-width="1"/>
  </g>
  <!-- egg -->
  <g transform="translate(235,175)">
    <ellipse cx="0" cy="0" rx="17" ry="22" fill="#fbf3dd" stroke="#c9a765" stroke-width="1.5"/>
    <ellipse cx="-5" cy="-9" rx="5" ry="7" fill="#ffffff" opacity=".55"/>
  </g>
  <!-- bubbles -->
  <circle cx="190" cy="230" r="4" fill="#ffffff" opacity=".7"/>
  <circle cx="205" cy="255" r="3" fill="#ffffff" opacity=".6"/>
  <circle cx="180" cy="270" r="5" fill="#ffffff" opacity=".5"/>
  <circle cx="270" cy="240" r="4" fill="#ffffff" opacity=".6"/>
  <!-- title chip -->
  <rect x="16" y="16" width="185" height="30" rx="15" fill="#0c3a4f" opacity=".82"/>
  <text x="30" y="36" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#eaf6fb">Mission: Blue Planet</text>
</svg>
