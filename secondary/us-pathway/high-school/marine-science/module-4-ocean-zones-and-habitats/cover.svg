<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Cuvier's Deep Dive cover art: a beaked whale gliding down through the ocean's layers">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa3d6"/>
      <stop offset="0.26" stop-color="#0e6f9e"/>
      <stop offset="0.60" stop-color="#063a63"/>
      <stop offset="1" stop-color="#01040c"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6e9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c6e9ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.4" r="0.78">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#sea)"/>

  <!-- god rays from the surface -->
  <g opacity="0.75">
    <polygon points="58,-10 88,-10 150,310 12,310" fill="url(#ray)"/>
    <polygon points="182,-10 206,-10 252,310 150,310" fill="url(#ray)" opacity="0.7"/>
    <polygon points="300,-10 326,-10 366,310 282,310" fill="url(#ray)" opacity="0.6"/>
  </g>

  <!-- suspended particulate / bioluminescence -->
  <g fill="#d8ecff">
    <circle cx="64" cy="118" r="1.5" opacity="0.55"/>
    <circle cx="120" cy="70" r="1.1" opacity="0.5"/>
    <circle cx="330" cy="96" r="1.3" opacity="0.5"/>
    <circle cx="288" cy="176" r="1.6" opacity="0.45"/>
    <circle cx="96" cy="210" r="1.2" opacity="0.4"/>
    <circle cx="352" cy="232" r="1.4" opacity="0.4"/>
    <circle cx="150" cy="250" r="1.1" opacity="0.35"/>
    <circle cx="230" cy="60" r="1" opacity="0.45"/>
  </g>
  <g fill="#7affe0">
    <circle cx="262" cy="212" r="2" opacity="0.8"/>
    <circle cx="110" cy="176" r="1.7" opacity="0.7"/>
    <circle cx="316" cy="150" r="1.6" opacity="0.7"/>
  </g>

  <!-- Cuvier's beaked whale, gliding down into the deep -->
  <g transform="translate(212,146) rotate(17)">
    <!-- body + two-lobed flukes -->
    <path d="M -58 0
             C -49 -7, -30 -13, -6 -14
             C 18 -15, 39 -11, 51 -3
             L 64 -10 L 55 0 L 64 10 L 51 3
             C 39 12, 17 15, -8 14
             C -30 13, -49 7, -58 0 Z"
          fill="#0a1622"/>
    <!-- dorsal fin -->
    <path d="M 24 -12 Q 33 -23, 41 -11 Z" fill="#0a1622"/>
    <!-- pectoral flipper -->
    <path d="M -14 9 Q -6 22, 6 16 Q -2 11, -14 9 Z" fill="#0a1622" opacity="0.85"/>
    <!-- cool rim light along the back -->
    <path d="M -58 0 C -49 -7, -30 -13, -6 -14 C 18 -15, 39 -11, 51 -3"
          fill="none" stroke="#79c8ff" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <!-- eye -->
    <circle cx="-40" cy="-2" r="1.3" fill="#bfe6ff" opacity="0.7"/>
  </g>

  <rect width="400" height="300" fill="url(#vig)"/>
</svg>
