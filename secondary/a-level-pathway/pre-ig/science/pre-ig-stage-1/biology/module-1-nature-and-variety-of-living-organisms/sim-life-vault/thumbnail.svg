<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A glowing specimen inside a glass bell jar, ringed by six kingdom vaults">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#16424a"/><stop offset="65%" stop-color="#08171c"/><stop offset="100%" stop-color="#050d10"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ee6c8" stop-opacity=".75"/><stop offset="100%" stop-color="#5ee6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cff6ff" stop-opacity=".28"/><stop offset="45%" stop-color="#cff6ff" stop-opacity=".06"/><stop offset="100%" stop-color="#cff6ff" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="bell" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e9f4ff" stop-opacity=".9"/><stop offset="100%" stop-color="#9fd0ff" stop-opacity=".35"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <g fill="#9fefff" opacity=".7">
    <circle cx="30" cy="40" r="1.4"/><circle cx="62" cy="22" r="1"/><circle cx="270" cy="30" r="1.6"/><circle cx="292" cy="70" r="1"/>
    <circle cx="44" cy="96" r="1.1"/><circle cx="250" cy="110" r="1.3"/><circle cx="120" cy="20" r="1"/><circle cx="210" cy="16" r="1.2"/>
  </g>
  <ellipse cx="160" cy="176" rx="150" ry="18" fill="#0d3a40"/>
  <ellipse cx="160" cy="176" rx="118" ry="13" fill="none" stroke="#5ee6c8" stroke-opacity=".35"/>
  <!-- six kingdom vaults -->
  <g>
    <circle cx="38" cy="160" r="13" fill="#3FAE5A"/><circle cx="78" cy="170" r="13" fill="#E0644B"/><circle cx="118" cy="178" r="11" fill="#C9932E"/>
    <circle cx="202" cy="178" r="11" fill="#2BA6B8"/><circle cx="242" cy="170" r="13" fill="#8A63D2"/><circle cx="282" cy="160" r="13" fill="#D9475E"/>
  </g>
  <!-- pedestal and bell jar -->
  <ellipse cx="160" cy="160" rx="44" ry="9" fill="#9fb3bd"/>
  <rect x="116" y="150" width="88" height="10" fill="#7d939c"/>
  <ellipse cx="160" cy="150" rx="44" ry="8" fill="#b9ccd4"/>
  <ellipse cx="160" cy="150" rx="40" ry="6" fill="none" stroke="#5ee6c8" stroke-width="2"/>
  <circle cx="160" cy="96" r="58" fill="url(#halo)"/>
  <path d="M118,150 L118,78 A42,52 0 0 1 202,78 L202,150 Z" fill="url(#glass)" stroke="#cff6ff" stroke-opacity=".5"/>
  <!-- moon jellyfish specimen -->
  <path d="M132,96 Q160,52 188,96 Q174,104 160,102 Q146,104 132,96 Z" fill="url(#bell)"/>
  <g fill="none" stroke="#d79bff" stroke-width="2.4" opacity=".9">
    <circle cx="152" cy="86" r="5"/><circle cx="168" cy="86" r="5"/><circle cx="152" cy="76" r="4"/><circle cx="168" cy="76" r="4"/>
  </g>
  <g fill="none" stroke="#e9f4ff" stroke-opacity=".7" stroke-width="1.2">
    <path d="M140,100 q-3,14 2,26"/><path d="M152,102 q-4,16 1,30"/><path d="M168,102 q4,16 -1,30"/><path d="M180,100 q3,14 -2,26"/>
  </g>
  <!-- MRS C GREN pods -->
  <g font-family="system-ui,sans-serif" font-weight="800" font-size="9" fill="#7dffd9" text-anchor="middle">
    <circle cx="96" cy="128" r="8" fill="#0f3a40" stroke="#5ee6c8"/><text x="96" y="131">M</text>
    <circle cx="224" cy="128" r="8" fill="#0f3a40" stroke="#5ee6c8"/><text x="224" y="131">N</text>
    <circle cx="84" cy="100" r="8" fill="#0f3a40" stroke="#5ee6c8"/><text x="84" y="103">R</text>
    <circle cx="236" cy="100" r="8" fill="#0f3a40" stroke="#5ee6c8"/><text x="236" y="103">E</text>
  </g>
  <text x="160" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="15" fill="#e6fffa" letter-spacing="2">LIFE VAULT</text>
</svg>
