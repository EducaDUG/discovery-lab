    const A1 = ["ver un espectáculo de flamenco","visitar la catedral","caminar por el barrio"], F1 = ["tapas en un bar antiguo","paella","churros con chocolate"], CL1 = ["camisetas ligeras y gafas de sol","un sombrero y sandalias"];
    const A2 = ["ver un partido de fútbol en La Bombonera","visitar el Caminito","escuchar música en la calle"], F2 = ["un asado increíble","empanadas","alfajores"], TR2 = ["el colectivo","el metro","el bus"];
    const lines = () => [`Me llamo ${I.name || "…"}.`, `En Sevilla, voy a ${I.a1 || "…"}. Voy a comer ${I.f1 || "…"}. En mi maleta, llevo ${I.cl1 || "…"}.`, `En Buenos Aires, voy a ${I.a2 || "…"}. Voy a comer ${I.f2 || "…"}. Voy a tomar ${I.tr2 || "…"} para ir al centro.`];
    slot.innerHTML = `<p>${L("You won a lottery ticket for TWO stops: Seville (Spain) and Buenos Aires (Argentina)! Plan them with the near future, then type it.","¡Ganaste un billete de lotería para DOS paradas: Sevilla (España) y Buenos Aires (Argentina)! Plánealas con el futuro cercano y luego escríbelo.")}</p>
      <p class="row-label">1 · ${L("Your name","Tu nombre")}</p><input type="text" class="tin es" id="nm" maxlength="14" value="${I.name}" aria-label="${L("Your name","Tu nombre")}">
      <p class="row-label">2 · ${L("Seville: activity","Sevilla: actividad")}</p><div class="pz-chips" id="a1"></div>
      <p class="row-label">3 · ${L("Seville: food","Sevilla: comida")}</p><div class="pz-chips" id="f1"></div>
      <p class="row-label">4 · ${L("Seville: in your suitcase","Sevilla: en tu maleta")}</p><div class="pz-chips" id="c1"></div>
      <p class="row-label">5 · ${L("Buenos Aires: activity","Buenos Aires: actividad")}</p><div class="pz-chips" id="a2"></div>
      <p class="row-label">6 · ${L("Buenos Aires: food","Buenos Aires: comida")}</p><div class="pz-chips" id="f2"></div>
      <p class="row-label">7 · ${L("Buenos Aires: SAFE transport verb is tomar","Buenos Aires: el verbo SEGURO es tomar")}</p><div class="pz-chips" id="t2"></div>
      <div class="preview" id="pv"></div><div id="act"></div><div class="fb" role="status"></div>`;
    const pv = slot.querySelector("#pv"), act = slot.querySelector("#act"), fb = slot.querySelector(".fb");
    const set = (sel, arr, key) => arr.forEach(v => { const b = $(`<button type="button" class="chip es ${I[key] === v ? "is-on" : ""}">${v}</button>`); b.addEventListener("click", () => { I[key] = v; slot.querySelectorAll(sel + " .chip").forEach(x => x.classList.remove("is-on")); b.classList.add("is-on"); sim.saveState(); render(); speak(v); }); slot.querySelector(sel).append(b); });
    set("#a1", A1, "a1"); set("#f1", F1, "f1"); set("#c1", CL1, "cl1"); set("#a2", A2, "a2"); set("#f2", F2, "f2"); set("#t2", TR2, "tr2");
    slot.querySelector("#nm").addEventListener("input", e => { I.name = e.target.value.trim(); sim.saveState(); render(); });
    function render() {
      const ls = lines(); pv.innerHTML = ls.join(" ");
      const ready = I.name && I.a1 && I.f1 && I.cl1 && I.a2 && I.f2 && I.tr2;
      act.innerHTML = "";
      if (ready) {
        const script = ls.join(" ");
        const w = $(`<div><p><b>${L("Now type your Grand Tour yourself (copy it from above).","Ahora escribe tu Gran Tour tú mismo (cópialo de arriba).")}</b></p><div class="chiprow"><input type="text" class="tin es" id="cp" style="min-width:min(100%,420px)" autocomplete="off" spellcheck="false" aria-label="${L("Type your script","Escribe tu guion")}"> <button type="button" class="btn btn--signal go">${L("Check","Comprobar")}</button></div></div>`);
        w.querySelector(".go").addEventListener("click", () => {
          if (strip(w.querySelector("#cp").value) === strip(script)) {
            fb.className = "fb good"; fb.textContent = L("¡Genial! Your Grand Tour is ready.","¡Genial! Tu Gran Tour está listo."); speak(script);
            award("8 Gran Tour", "Grand Tour script", script, 1, true, w.querySelector(".go")); act.innerHTML = ""; act.append(listenBtn(script));
            nextBtn(act, L("Finish Unit 8 →","Terminar la Unidad 8 →"), next);
          } else { fb.className = "fb bad"; fb.textContent = L("Not an exact match yet — check spelling, accents and full stops.","Aún no es idéntico — revisa ortografía, acentos y puntos."); }
        });
        act.append(w);
      }
    }
    render();
  };

  /* ===== STAGES ===== */
  const STAGE_DEFS = [
    { t:"1 · Repaso", how:L("Level 1: A quick restart of Units 1–7 — ser, estar, ir, verbs, clothes — from zero. Never did them? Start here!","Nivel 1: repaso de las Unidades 1–7 — ser, estar, ir, verbos, ropa — desde cero. ¿No las hiciste? ¡Empieza aquí!"), parts:[Cards(recapCards), Deck("rc","1 Repaso",recapQs), Typer("rcT","1 Repaso",recapT)] },
    { t:"2 · El Viaje", how:L("Level 2: Travel vocab with real photos — billete vs boleto, maleta vs valija.","Nivel 2: vocabulario de viaje con fotos reales — billete vs boleto, maleta vs valija."), parts:[Cards(trvCards), Deck("tq","2 Viaje",trvQs), Sorter("ts","2 Viaje",trvSort), Typer("tT","2 Viaje",trvT)] },
    { t:"3 · Voy a…", how:L("Level 3: The near future — IR + a + infinitive.","Nivel 3: el futuro cercano — IR + a + infinitivo."), parts:[Cards(futCards), Deck("ft","3 Futuro",futQs), Typer("fT","3 Futuro",futT)] },
    { t:"4 · El Tiempo", how:L("Level 4: Weather with HACER and the December flip between hemispheres.","Nivel 4: el tiempo con HACER y el cambio de diciembre entre hemisferios."), parts:[Cards(wxCards), Deck("wx","4 Tiempo",wxQs), Typer("wT","4 Tiempo",wxT)] },
    { t:"5 · Fiestas", how:L("Level 5: Reyes Magos, Nochebuena, San Fermín and Carnaval — with a real photo to label.","Nivel 5: Reyes Magos, Nochebuena, San Fermín y Carnaval — con una foto real para etiquetar."), parts:[Cards(festCards), FieLabel, Deck("fs","5 Fiestas",festQs)] },
    { t:"6 · Pasado", how:L("Level 6: The past tense “Big 3” — fui, comí, visité.","Nivel 6: los “3 grandes” del pasado — fui, comí, visité."), parts:[Cards(pastCards), Deck("ps","6 Pasado",pastQs), Typer("pT","6 Pasado",pastT)] },
    { t:"7 · Entrevista", how:L("Level 7: Dos Mundos vocab and your oral interview, practised in writing.","Nivel 7: vocabulario de los Dos Mundos y tu entrevista oral, practicada por escrito."), parts:[Cards(worldCards), Deck("wd","7 Dos Mundos",worldQs), InterviewPart] },
    { t:"8 · Gran Tour", how:L("Final project: plan a transatlantic trip to Seville and Buenos Aires.","Proyecto final: planea un viaje transatlántico a Sevilla y Buenos Aires."), parts:[TourBuilder] }
  ];

  /* ---- bonus: Haz la Maleta (pack the suitcase for the weather; 2 min wall-clock) ---- */
  const HOT = ["camiseta","falda","vestido"], COLD = ["abrigo","bufanda","guantes","botas","gorro"], ALWAYS = ["pasaporte","camara"];
  const PACKN = { camiseta:"la camiseta", falda:"la falda", gafas:"las gafas de sol", vestido:"el vestido", abrigo:"el abrigo", bufanda:"la bufanda", guantes:"los guantes", botas:"las botas", gorro:"el gorro", pasaporte:"el pasaporte", camara:"la cámara" };
  const TRIPS = [["Voy a Madrid en diciembre. Hace mucho frío.","cold"],["Voy a Buenos Aires en diciembre. Hace mucho calor.","hot"],["Voy a Sevilla en agosto. Hace mucho calor.","hot"],["Voy a Pamplona en enero. Hace frío y nieva.","cold"],["Voy a Barranquilla para el Carnaval. Hace calor.","hot"],["Voy a la montaña. Nieva.","cold"]];
  function bonusSection() {
    const box = host.querySelector("#bonus"); if (!box || box.dataset.on) return; box.dataset.on = "1";
    box.innerHTML = `<div class="duelc"><div class="row-label">${L("Bonus round","Ronda extra")}</div><h3 class="pz-title">${L("Haz la Maleta","Haz la Maleta")}</h3><p>${L("Read the trip, then pack THREE things that fit the weather (or travel essentials). Wrong items bounce out of the suitcase. 2 minutes, no lives.","Lee el viaje y mete TRES cosas que van con el tiempo (o esenciales de viaje). Las cosas equivocadas rebotan. 2 minutos, sin vidas.")}</p><button type="button" class="btn btn--signal" id="dgo">🎮 ${L("Play (2 min)","Jugar (2 min)")}</button> <button type="button" class="btn" id="dsk">${L("Skip →","Saltar →")}</button></div>`;
    box.querySelector("#dsk").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
    box.querySelector("#dgo").onclick = () => play();
    function play() {
      const DUR = 120000, t0 = Date.now(); let score = 0, streak = 0, best = 0, hits = 0, total = 0, bags = 0, packed = [], trip = null, timer = null; const order = shuffle(TRIPS); let idx = 0;
      box.innerHTML = `<div class="duelc"><div class="duel-hud"><span>${L("Time","Tiempo")} <b id="dt">2:00</b></span><span>${L("Suitcases","Maletas")} <b id="ds">0</b></span><span>🔥 <b id="dk">0</b></span><button type="button" class="chip" id="dm" style="min-height:30px;padding:.1em .6em">${muted ? "🔇" : "🔊"}</button></div><p class="duel-q es" id="dq"></p><div class="dressrow"><div class="suit" id="su"><b>🧳</b><div id="sl"></div></div><div class="tray" id="tr"></div></div><div class="fb" id="df" role="status"></div></div>`;
      const q = (s) => box.querySelector(s);
      q("#dm").onclick = (e) => { muted = !muted; if (muted) { try { speechSynthesis.cancel(); } catch (x) {} setTTS(false); } e.currentTarget.textContent = muted ? "🔇" : "🔊"; };
      const hudT = () => { const left = Math.max(0, DUR - (Date.now() - t0)); q("#dt").textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0"); q("#ds").textContent = bags; q("#dk").textContent = streak; };
      function nextTrip() {
        trip = order[idx % order.length]; idx++; packed = []; q("#sl").innerHTML = ""; q("#dq").textContent = trip[0]; q("#df").textContent = ""; speak(trip[0]);
        const good = shuffle((trip[1] === "hot" ? HOT : COLD).concat(ALWAYS)).slice(0, 4), bad = shuffle(trip[1] === "hot" ? COLD : HOT).slice(0, 4);
        q("#tr").innerHTML = shuffle(good.concat(bad)).map(k => `<button type="button" class="tbtn" data-k="${k}" data-g="${good.includes(k) ? 1 : 0}"><img src="photos/viaje/${k}.jpg" alt="${PACKN[k]}" width="64" height="64"></button>`).join("");
        q("#tr").querySelectorAll(".tbtn").forEach(b => b.onclick = () => pick(b));
      }
      function pick(b) {
        if (b.disabled) return; total++;
        if (b.dataset.g === "1") { hits++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; b.disabled = true; b.classList.add("is-ok"); packed.push(b.dataset.k); q("#sl").append($(`<img class="worn2" src="photos/viaje/${b.dataset.k}.jpg" alt="" width="44" height="44">`)); q("#df").className = "fb good"; q("#df").textContent = "¡Sí! " + PACKN[b.dataset.k]; sim.recordTrial({ nivel:"Bonus", tarea:trip[0], respuesta:PACKN[b.dataset.k], correcto:"Yes", intentos:1 }); burst(b);
          if (packed.length >= 3) { bags++; q("#df").textContent = L("¡Maleta lista! ","¡Maleta lista! ") + L("Suitcase packed.","Maleta preparada."); hudT(); setTimeout(() => { if (Date.now() - t0 < DUR) nextTrip(); }, 1100); } else hudT(); }
        else { streak = 0; b.classList.add("is-bad"); setTimeout(() => b.classList.remove("is-bad"), 500); q("#df").className = "fb bad"; q("#df").textContent = trip[1] === "hot" ? L("It is hot — you don’t need ","Hace calor: no necesitas ") + PACKN[b.dataset.k] : L("It is cold — you don’t need ","Hace frío: no necesitas ") + PACKN[b.dataset.k]; hudT(); }
      }
      timer = setInterval(() => { hudT(); if (Date.now() - t0 >= DUR) { clearInterval(timer); end(); } }, 250);
      function end() {
        box.innerHTML = `<div class="duelc"><h3 class="pz-title">${L("¡Buen viaje!","¡Buen viaje!")}</h3><p>${L("Suitcases","Maletas")} <b>${bags}</b> · ${L("Accuracy","Precisión")} <b>${total ? Math.round(hits / total * 100) : 0}%</b> · ${L("Best streak","Mejor racha")} <b>${best}</b></p><button type="button" class="btn btn--signal" id="dag">${L("Play again","Jugar otra vez")}</button> <button type="button" class="btn" id="dcl">${L("Close","Cerrar")}</button></div>`;
        box.querySelector("#dag").onclick = () => play(); box.querySelector("#dcl").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
        sim.toast(L(`Haz la Maleta: ${bags} suitcases.`, `Haz la Maleta: ${bags} maletas.`), "info");
      }
      nextTrip(); hudT();
    }
  }

  function paint() {
    body.innerHTML = ""; hud();
    if (S.stage >= STAGE_DEFS.length) { finale(); return; }
    const def = STAGE_DEFS[S.stage];
    globe.flyTo(STAGE_STOP[S.stage]);
    const slot = panel(def.t, def.how);
    parts(slot, "st" + S.stage, def.parts, () => {
      slot.innerHTML = `<p class="fb good">${L("¡Nivel completo!","¡Nivel completado!")}</p>`;
      nextBtn(slot, S.stage < STAGE_DEFS.length - 1 ? L("Next level →","Siguiente nivel →") : L("Finish Unit 8 →","Terminar la Unidad 8 →"), () => { S.stage++; sim.saveState(); paint(); window.scrollTo({ top: host.offsetTop - 20, behavior: reduced() ? "auto" : "smooth" }); });
    });
  }
  function finale() {
    body.innerHTML = `<div class="done-card"><h3>¡Unidad 8 completa!</h3><div class="big">${rankFor(S.xp)}</div><p>${S.xp} XP · ${L("best streak","mejor racha")} ${S.best} · ${S.firstTry} ${L("first-try answers","respuestas a la primera")}</p><p>${L("Scroll down to check your Record, answer Explain and Apply, and generate your evidence PDF.","Baja para revisar tu Registro, responder Explica y Aplica, y generar tu PDF de evidencias.")}</p></div>`;
    bonusSection();
  }









  paint();
  fetch("photos/viaje/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown"} (${v.license})</div>`).join("");
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
