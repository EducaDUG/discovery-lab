      tries++;
      if (b.dataset.a === it.a) { slot.querySelectorAll(".sb").forEach(x => x.disabled = true); b.classList.add("is-ok"); fb.className = "fb good"; fb.textContent = "¡Correcto! " + it.why; award("3 Estados", it.n + ": SER or ESTAR?", it.a, tries, true, b); speak(it.n); setTimeout(() => { S.p[k] = i + 1; sim.saveState(); serEstarSort(slot, done); }, 1400); }
      else { b.classList.add("is-bad"); b.disabled = true; fb.className = "fb bad"; fb.textContent = L("Not that one. ","Esa no. ") + it.why; if (tries >= 2) { award("3 Estados", it.n + ": SER or ESTAR?", b.dataset.a, tries, false); slot.querySelectorAll(".sb").forEach(x => { x.disabled = true; if (x.dataset.a === it.a) x.classList.add("is-ok"); }); setTimeout(() => { S.p[k] = i + 1; sim.saveState(); serEstarSort(slot, done); }, 2600); } }
    }));
  }

  function paint() {
    body.innerHTML = ""; hud();
    if (S.stage >= STAGE_DEFS.length) { finale(); return; }
    const def = STAGE_DEFS[S.stage];
    globe.flyTo(STAGE_STOP[S.stage]);
    const slot = panel(def.t, def.how);
    parts(slot, "st" + S.stage, def.parts, () => {
      slot.innerHTML = `<p class="fb good">${L("¡Nivel completo!","¡Nivel completado!")}</p>`;
      nextBtn(slot, S.stage < STAGE_DEFS.length - 1 ? L("Next level →","Siguiente nivel →") : L("Finish Unit 2 →","Terminar la Unidad 2 →"), () => { S.stage++; sim.saveState(); paint(); window.scrollTo({ top: host.offsetTop - 20, behavior: reduced() ? "auto" : "smooth" }); });
    });
  }
  function finale() {
    body.innerHTML = `<div class="done-card"><h3>¡Unidad 2 completa!</h3><div class="big">${rankFor(S.xp)}</div><p>${S.xp} XP · ${L("best streak","mejor racha")} ${S.best} · ${S.firstTry} ${L("first-try answers","respuestas a la primera")}</p><p>${L("Scroll down to check your Record, answer Explain and Apply, and generate your evidence PDF.","Baja para revisar tu Registro, responder Explica y Aplica, y generar tu PDF de evidencias.")}</p></div>`;
    bonusSection();
  }



  /* ---- bonus: El Duelo — SER vs ESTAR tug-of-war (auto-battler tug, 2 min wall-clock, no fail state) ---- */
  const DUEL = [
    ["La pizarra ___ en el aula.","estar",L("Location → ESTAR","Ubicación → ESTAR"),"pizarra"],["Yo ___ de Nueva Zelanda.","ser",L("Origin → SER","Origen → SER")],["Mi mochila ___ en casa.","estar",L("Location → ESTAR","Ubicación → ESTAR"),"mochila"],
    ["___ las cuatro y media.","ser",L("Time → SER","Hora → SER")],["Ella ___ cansada hoy.","estar",L("Feeling now → ESTAR","Sentimiento ahora → ESTAR")],["Tú ___ inteligente.","ser",L("Trait → SER","Rasgo → SER")],
    ["Mi ordenador ___ nuevo.","ser",L("Description → SER","Descripción → SER"),"ordenador"],["Nosotros ___ en la escuela.","estar",L("Location → ESTAR","Ubicación → ESTAR")],["El bolígrafo ___ azul.","ser",L("Colour/description → SER","Color/descripción → SER"),"boligrafo"],
    ["Ellos ___ tristes.","estar",L("Emotion → ESTAR","Emoción → ESTAR")],["Madrid ___ en España.","estar",L("Location → ESTAR","Ubicación → ESTAR")],["Ustedes ___ estudiantes.","ser",L("Identity → SER","Identidad → SER")],
    ["El cuaderno ___ en la mesa.","estar",L("Location → ESTAR","Ubicación → ESTAR"),"cuaderno"],["Vosotros ___ de España.","ser",L("Origin → SER","Origen → SER")],["La sopa ___ fría.","estar",L("Condition now → ESTAR","Condición ahora → ESTAR")],
    ["El lápiz ___ amarillo.","ser",L("Description → SER","Descripción → SER"),"lapiz"],["Hoy ___ lunes.","ser",L("Day → SER","Día → SER")],["Yo ___ enfermo.","estar",L("Condition → ESTAR","Condición → ESTAR")]
  ];
  function bonusSection() {
    const box = host.querySelector("#bonus"); if (!box || box.dataset.on) return; box.dataset.on = "1";
    box.innerHTML = `<div class="duelc"><div class="row-label">${L("Bonus round","Ronda extra")}</div><h3 class="pz-title">${L("El Duelo: SER vs ESTAR","El Duelo: SER vs ESTAR")}</h3><p>${L("Tug of war! Pick SER or ESTAR for each sentence. Right answers pull the flag to your side. 2 minutes, no lives — a wrong pick just resets your streak.","¡Tira y afloja! Elige SER o ESTAR en cada frase. Los aciertos tiran de la bandera. 2 minutos, sin vidas: un fallo solo reinicia tu racha.")}</p><button type="button" class="btn btn--signal" id="dgo">🎮 ${L("Play (2 min)","Jugar (2 min)")}</button> <button type="button" class="btn" id="dsk">${L("Skip →","Saltar →")}</button></div>`;
    box.querySelector("#dsk").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
    box.querySelector("#dgo").onclick = () => play();
    function play() {
      const DUR = 120000, t0 = Date.now(); let score = 0, streak = 0, best = 0, hits = 0, total = 0, pos = 50, idx = 0, locked = false, timer = null, qTimer = null;
      const order = shuffle(DUEL);
      box.innerHTML = `<div class="duelc"><div class="duel-hud"><span>${L("Time","Tiempo")} <b id="dt">2:00</b></span><span>${L("Score","Puntos")} <b id="ds">0</b></span><span>🔥 <b id="dk">0</b></span><button type="button" class="chip" id="dm" style="min-height:30px;padding:.1em .6em" aria-pressed="false">${muted ? "🔇" : "🔊"}</button></div>
        <div class="rope"><span class="rope__l">SER</span><div class="rope__track"><i class="rope__flag" id="fl" style="left:50%"></i></div><span class="rope__r">ESTAR</span></div>
        <div class="vis" id="dv"></div><p class="duel-q es" id="dq"></p><div class="sortbtns"><button type="button" class="chip sb sb--m" data-a="ser"><b>SER</b><small>1</small></button><button type="button" class="chip sb sb--f" data-a="estar"><b>ESTAR</b><small>2</small></button></div><div class="fb" id="df" role="status"></div></div>`;
      const q = (s) => box.querySelector(s);
      q("#dm").onclick = (e) => { muted = !muted; if (muted) { try { speechSynthesis.cancel(); } catch (x) {} setTTS(false); } e.currentTarget.textContent = muted ? "🔇" : "🔊"; };
      const flag = (p) => { pos = Math.max(0, Math.min(100, p)); q("#fl").style.left = pos + "%"; };
      const hudT = () => { const left = Math.max(0, DUR - (Date.now() - t0)); q("#dt").textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0"); q("#ds").textContent = score; q("#dk").textContent = streak; };
      function next() {
        locked = false; clearTimeout(qTimer); const it = order[idx % order.length]; idx++;
        q("#dq").textContent = it[0]; q("#df").textContent = ""; q("#dv").innerHTML = it[3] ? IMG(it[3], 110) : "";
        box.querySelectorAll(".sb").forEach(b => { b.disabled = false; b.classList.remove("is-ok", "is-bad"); b.onclick = () => answer(b, it); });
        qTimer = setTimeout(() => { if (locked) return; locked = true; total++; streak = 0; flag(pos - 5); q("#df").className = "fb bad"; q("#df").textContent = L("Time! ","¡Tiempo! ") + it[2]; setTimeout(() => { if (Date.now() - t0 < DUR) next(); }, 1600); }, 9000);
      }
      function answer(b, it) {
        if (locked) return; locked = true; clearTimeout(qTimer); total++;
        const ok = b.dataset.a === it[1];
        if (ok) { hits++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; flag(pos + 6 + Math.min(streak, 4)); b.classList.add("is-ok"); q("#df").className = "fb good"; q("#df").textContent = "¡Sí! " + it[2]; sim.recordTrial({ nivel:"Bonus", tarea:it[0], respuesta:it[1], correcto:"Yes", intentos:1 }); burst(b); }
        else { streak = 0; flag(pos - 8); b.classList.add("is-bad"); q("#df").className = "fb bad"; q("#df").textContent = L("Answer: ","Respuesta: ") + it[1].toUpperCase() + ". " + it[2]; }
        hudT(); setTimeout(() => { if (Date.now() - t0 < DUR) next(); }, ok ? 1000 : 2000);
      }
      const keyH = (e) => { if (!document.body.contains(box.querySelector(".duelc"))) { document.removeEventListener("keydown", keyH); return; } if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; if (e.key === "1") box.querySelector('.sb[data-a="ser"]').click(); if (e.key === "2") box.querySelector('.sb[data-a="estar"]').click(); };
      document.addEventListener("keydown", keyH);
      timer = setInterval(() => { hudT(); if (Date.now() - t0 >= DUR) { clearInterval(timer); clearTimeout(qTimer); document.removeEventListener("keydown", keyH); end(); } }, 250);
      function end() {
        box.innerHTML = `<div class="duelc"><h3 class="pz-title">${L("¡Duelo terminado!","¡Duelo terminado!")}</h3><p>${L("Score","Puntos")} <b>${score}</b> · ${L("Accuracy","Precisión")} <b>${total ? Math.round(hits / total * 100) : 0}%</b> · ${L("Best streak","Mejor racha")} <b>${best}</b></p><p class="row-label">${L("Remember: SER = who/what/when it is; ESTAR = where and how you are.","Recuerda: SER = quién/qué/cuándo es; ESTAR = dónde y cómo estás.")}</p><button type="button" class="btn btn--signal" id="dag">${L("Play again","Jugar otra vez")}</button> <button type="button" class="btn" id="dcl">${L("Close","Cerrar")}</button></div>`;
        box.querySelector("#dag").onclick = () => play(); box.querySelector("#dcl").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
        sim.toast(L(`El Duelo: score ${score}, ${total ? Math.round(hits / total * 100) : 0}% accuracy.`, `El Duelo: ${score} puntos, ${total ? Math.round(hits / total * 100) : 0}% de precisión.`), "info");
      }
      next(); hudT();
    }
  }

  paint();
  fetch("photos/aula/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown"} (${v.license})</div>`).join("");
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
