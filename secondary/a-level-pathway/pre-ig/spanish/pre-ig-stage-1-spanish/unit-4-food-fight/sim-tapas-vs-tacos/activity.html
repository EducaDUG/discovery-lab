  function hud() {

    host.querySelector("#tabs").innerHTML = STAGES.map((n, i) => `<span class="pz-tab ${i < S.stage ? "is-done" : i === S.stage ? "is-now" : ""}">${i + 1}. ${n}${i < S.stage ? " ✓" : ""}</span>`).join("");
  }
  function burst(el) {
    if (reduced()) return;
    const r = el.getBoundingClientRect(), root = el.closest(".pz-panel") || el, rr = root.getBoundingClientRect(); root.style.position = "relative";
    for (let i = 0; i < 12; i++) {

      s.style.left = (r.left - rr.left + r.width / 2) + "px"; s.style.top = (r.top - rr.top + r.height / 2) + "px";
      s.style.background = ["#f0a030", "#1a7f8e", "#0e3a5f", "#2e8b57"][i % 4];
      const a = Math.random() * 6.28, d = 30 + Math.random() * 50; s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
      root.append(s); setTimeout(() => s.remove(), 850);
    }
  }
  function award(nivel, tarea, respuesta, tries, ok, anchor) {
    if (ok) { S.xp += tries === 1 ? 10 + Math.min(S.streak, 5) * 2 : 5; S.streak = tries === 1 ? S.streak + 1 : 0; if (tries === 1) S.firstTry++; }

  /* run a list of parts one after another; progress persists */
  function parts(slot, key, fns, done) {

  function deck(slot, k, nivel, qs, done) {

    const q = qs[i]; let tries = 0;
    slot.innerHTML = `<div class="pz-count">${i + 1} / ${qs.length}</div><div class="vis">${q.visual || ""}</div><p><b>${q.q}</b></p><div class="pz-chips"></div><div class="fb" role="status"></div>`;

      function hit() {
        if (locked || !it) return; locked = true; total++;
        const n = Math.min(it[2].length - 1, Math.floor(pos * it[2].length)); const ok = n === it[3];
        const seg = q(`.beatseg[data-n="${n}"]`), right = q(`.beatseg[data-n="${it[3]}"]`);
        if (ok) { hits++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; seg.classList.add("is-ok"); q("#df").className = "fb good"; q("#df").textContent = "¡Sí! " + it[4]; sim.recordTrial({ nivel:"Bonus", tarea:it[1], respuesta:it[2][it[3]], correcto:"Yes", intentos:1 }); burst(seg); speak(it[1].replace("___", it[2][it[3]])); }
        else { streak = 0; seg.classList.add("is-bad"); right.classList.add("is-ok"); q("#df").className = "fb bad"; q("#df").textContent = L("Answer: ","Respuesta: ") + it[2][it[3]] + ". " + it[4]; }
        hudT(); setTimeout(() => { if (Date.now() - t0 < DUR) next(); }, ok ? 1100 : 2100);
      }
      q("#hit").onclick = hit;
      const keyH = (e) => { if (!document.body.contains(box.querySelector(".duelc"))) { document.removeEventListener("keydown", keyH); return; } if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; if (e.key === " ") { e.preventDefault(); hit(); } };
      document.addEventListener("keydown", keyH);
      timer = setInterval(() => { hudT(); if (Date.now() - t0 >= DUR) { clearInterval(timer); clearInterval(tick); document.removeEventListener("keydown", keyH); end(); } }, 250);
      function end() {
        box.innerHTML = `<div class="duelc"><h3 class="pz-title">${L("¡Cocina cerrada!","¡Cocina cerrada!")}</h3><p>${L("Score","Puntos")} <b>${score}</b> · ${L("Accuracy","Precisión")} <b>${total ? Math.round(hits / total * 100) : 0}%</b> · ${L("Best streak","Mejor racha")} <b>${best}</b></p><button type="button" class="btn btn--signal" id="dag">${L("Play again","Jugar otra vez")}</button> <button type="button" class="btn" id="dcl">${L("Close","Cerrar")}</button></div>`;
        box.querySelector("#dag").onclick = () => play(); box.querySelector("#dcl").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
        sim.toast(L(`Ritmo de Cocina: score ${score}, ${total ? Math.round(hits / total * 100) : 0}% accuracy.`, `Ritmo de Cocina: ${score} puntos, ${total ? Math.round(hits / total * 100) : 0}% de precisión.`), "info");
      }
      next(); hudT();
    }
  }


  function paint() {
    body.innerHTML = ""; hud();
    if (S.stage >= STAGE_DEFS.length) { finale(); return; }
    const def = STAGE_DEFS[S.stage];
    globe.flyTo(STAGE_STOP[S.stage]);
    const slot = panel(def.t, def.how);
    parts(slot, "st" + S.stage, def.parts, () => {
      slot.innerHTML = `<p class="fb good">${L("¡Nivel completo!","¡Nivel completado!")}</p>`;
      nextBtn(slot, S.stage < STAGE_DEFS.length - 1 ? L("Next level →","Siguiente nivel →") : L("Finish Unit 4 →","Terminar la Unidad 4 →"), () => { S.stage++; sim.saveState(); paint(); window.scrollTo({ top: host.offsetTop - 20, behavior: reduced() ? "auto" : "smooth" }); });
    });
  }
  function finale() {
    body.innerHTML = `<div class="done-card"><h3>¡Unidad 4 completa!</h3><div class="big">${rankFor(S.xp)}</div><p>${S.xp} XP · ${L("best streak","mejor racha")} ${S.best} · ${S.firstTry} ${L("first-try answers","respuestas a la primera")}</p><p>${L("Scroll down to check your Record, answer Explain and Apply, and generate your evidence PDF.","Baja para revisar tu Registro, responder Explica y Aplica, y generar tu PDF de evidencias.")}</p></div>`;
    bonusSection();
  }





  paint();
  fetch("photos/comida/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown"} (${v.license})</div>`).join("");
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
