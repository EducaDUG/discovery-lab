    function play() {
      const DUR = 120000, t0 = Date.now(); let score = 0, streak = 0, best = 0, hits = 0, total = 0, idx = 0, locked = false, timer = null, qTimer = null; const order = shuffle(REL);
      box.innerHTML = `<div class="duelc"><div class="duel-hud"><span>${L("Time","Tiempo")} <b id="dt">2:00</b></span><span>${L("Score","Puntos")} <b id="ds">0</b></span><span>🔥 <b id="dk">0</b></span><button type="button" class="chip" id="dm" style="min-height:30px;padding:.1em .6em">${muted ? "🔇" : "🔊"}</button></div><p class="duel-q es" id="dq"></p><div class="roomgrid" id="rg"></div><div class="fb" id="df" role="status"></div></div>`;
      const q = (s) => box.querySelector(s);
      q("#dm").onclick = (e) => { muted = !muted; if (muted) { try { speechSynthesis.cancel(); } catch (x) {} setTTS(false); } e.currentTarget.textContent = muted ? "🔇" : "🔊"; };
      LAYOUT.forEach(([k, lab], n) => { const b = $(`<button type="button" class="roomtile" data-k="${k}"><img src="photos/casa/${k}.jpg" alt="" width="110" height="110"><b class="es">${lab}</b><small>${n + 1}</small></button>`); q("#rg").append(b); });
      const hudT = () => { const left = Math.max(0, DUR - (Date.now() - t0)); q("#dt").textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0"); q("#ds").textContent = score; q("#dk").textContent = streak; };
      function next() {
        locked = false; clearTimeout(qTimer); const it = order[idx % order.length]; idx++;
        q("#dq").textContent = it[0]; q("#df").textContent = ""; speak(it[0]);
        box.querySelectorAll(".roomtile").forEach(b => { b.disabled = false; b.classList.remove("is-ok", "is-bad"); b.onclick = () => answer(b, it); });
        qTimer = setTimeout(() => { if (locked) return; locked = true; total++; streak = 0; q("#df").className = "fb bad"; q("#df").textContent = L("Time! Answer: ","¡Tiempo! Respuesta: ") + LAYOUT.find(x => x[0] === it[1])[1] + ". " + it[2]; setTimeout(() => { if (Date.now() - t0 < DUR) next(); }, 1800); }, 14000);
      }
      function answer(b, it) {
        if (locked) return; locked = true; clearTimeout(qTimer); total++; const ok = b.dataset.k === it[1];
        if (ok) { hits++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; b.classList.add("is-ok"); q("#df").className = "fb good"; q("#df").textContent = "¡Sí! " + it[2]; sim.recordTrial({ nivel:"Bonus", tarea:it[0], respuesta:it[1], correcto:"Yes", intentos:1 }); burst(b); }
        else { streak = 0; b.classList.add("is-bad"); q("#df").className = "fb bad"; q("#df").textContent = L("Answer: ","Respuesta: ") + LAYOUT.find(x => x[0] === it[1])[1] + ". " + it[2]; box.querySelector(`.roomtile[data-k="${it[1]}"]`).classList.add("is-ok"); }
        hudT(); setTimeout(() => { if (Date.now() - t0 < DUR) next(); }, ok ? 1100 : 2200);
      }
      const keyH = (e) => { if (!document.body.contains(box.querySelector(".duelc"))) { document.removeEventListener("keydown", keyH); return; } if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; const n = +e.key; if (n >= 1 && n <= 6) box.querySelectorAll(".roomtile")[n - 1].click(); };
      document.addEventListener("keydown", keyH);
      timer = setInterval(() => { hudT(); if (Date.now() - t0 >= DUR) { clearInterval(timer); clearTimeout(qTimer); document.removeEventListener("keydown", keyH); end(); } }, 250);
      function end() {
        box.innerHTML = `<div class="duelc"><h3 class="pz-title">${L("¡Caso cerrado!","¡Caso cerrado!")}</h3><p>${L("Score","Puntos")} <b>${score}</b> · ${L("Accuracy","Precisión")} <b>${total ? Math.round(hits / total * 100) : 0}%</b> · ${L("Best streak","Mejor racha")} <b>${best}</b></p><button type="button" class="btn btn--signal" id="dag">${L("Play again","Jugar otra vez")}</button> <button type="button" class="btn" id="dcl">${L("Close","Cerrar")}</button></div>`;
        box.querySelector("#dag").onclick = () => play(); box.querySelector("#dcl").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
        sim.toast(L(`Casa Detective: score ${score}, ${total ? Math.round(hits / total * 100) : 0}% accuracy.`, `Casa Detective: ${score} puntos, ${total ? Math.round(hits / total * 100) : 0}% de precisión.`), "info");
      }
      next(); hudT();
    }
  }



  function paint() {
    body.innerHTML = ""; hud();
    if (S.stage >= STAGE_DEFS.length) { finale(); return; }
    const def = STAGE_DEFS[S.stage];
    globe.flyTo(STAGE_STOP[S.stage]);
    const slot = panel(def.t, def.how);
    parts(slot, "st" + S.stage, def.parts, () => {
      slot.innerHTML = `<p class="fb good">${L("¡Nivel completo!","¡Nivel completado!")}</p>`;
      nextBtn(slot, S.stage < STAGE_DEFS.length - 1 ? L("Next level →","Siguiente nivel →") : L("Finish Unit 3 →","Terminar la Unidad 3 →"), () => { S.stage++; sim.saveState(); paint(); window.scrollTo({ top: host.offsetTop - 20, behavior: reduced() ? "auto" : "smooth" }); });
    });
  }
  function finale() {
    body.innerHTML = `<div class="done-card"><h3>¡Unidad 3 completa!</h3><div class="big">${rankFor(S.xp)}</div><p>${S.xp} XP · ${L("best streak","mejor racha")} ${S.best} · ${S.firstTry} ${L("first-try answers","respuestas a la primera")}</p><p>${L("Scroll down to check your Record, answer Explain and Apply, and generate your evidence PDF.","Baja para revisar tu Registro, responder Explica y Aplica, y generar tu PDF de evidencias.")}</p></div>`;
    bonusSection();
  }




  paint();
  fetch("photos/casa/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown"} (${v.license})</div>`).join("");
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
