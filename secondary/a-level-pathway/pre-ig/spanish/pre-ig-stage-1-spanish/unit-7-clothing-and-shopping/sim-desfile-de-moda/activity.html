      <p class="row-label">2 · ${L("Item 1","Prenda 1")}</p><div class="pz-chips" id="i1"></div><div class="pz-chips" id="k1"></div><div class="pz-chips" id="m1"></div>
      <p class="row-label">3 · ${L("Item 2","Prenda 2")}</p><div class="pz-chips" id="i2"></div><div class="pz-chips" id="k2"></div>
      <p class="row-label">4 · ${L("The look","El look")}</p><div class="pz-chips" id="md"></div>
      <p class="row-label">5 · ${L("Price of the shoes","Precio de los zapatos")}</p><div class="pz-chips" id="pr"></div>
      <div class="preview" id="pv"></div><div id="act"></div><div class="fb" role="status"></div>`;
    const pv = slot.querySelector("#pv"), act = slot.querySelector("#act"), fb = slot.querySelector(".fb");
    const set = (sel, arr, key, val, lab) => arr.forEach(o => { const v = val(o), t = lab(o); const b = $(`<button type="button" class="chip es ${I[key] === v ? "is-on" : ""}">${t}</button>`); b.addEventListener("click", () => { I[key] = v; slot.querySelectorAll(sel + " .chip").forEach(x => x.classList.remove("is-on")); b.classList.add("is-on"); sim.saveState(); render(); speak(String(t)); }); slot.querySelector(sel).append(b); });
    set("#i1", ITEMS, "it1", o => o, o => `${GARM[o].a} ${GARM[o].n}`); set("#k1", COLS, "c1", o => o, o => o); set("#m1", MATS, "m1", o => o[0], o => o[0]);
    set("#i2", ITEMS2, "it2", o => o, o => `${GARM[o].a} ${GARM[o].n}`); set("#k2", COLS, "c2", o => o, o => o);
    set("#md", ["elegante","moderno","cómodo","original"], "mood", o => o, o => o); set("#pr", PRICE, "price", o => o, o => o);
    slot.querySelector("#nm").addEventListener("input", e => { I.name = e.target.value.trim(); sim.saveState(); render(); });
    function render() {
      const ls = lines(); pv.innerHTML = ls.join(" ");
      const ready = I.name && I.it1 && I.c1 && I.m1 && I.it2 && I.c2 && I.mood && I.price;
      act.innerHTML = "";
      if (ready) {
        const script = ls.join(" ");
        const w = $(`<div><p><b>${L("Now type your commentary yourself (copy it from above).","Ahora escribe tu comentario tú mismo (cópialo de arriba).")}</b></p><div class="chiprow"><input type="text" class="tin es" id="cp" style="min-width:min(100%,420px)" autocomplete="off" spellcheck="false" aria-label="${L("Type your script","Escribe tu guion")}"> <button type="button" class="btn btn--signal go">${L("Check","Comprobar")}</button></div></div>`);
        w.querySelector(".go").addEventListener("click", () => {
          if (strip(w.querySelector("#cp").value) === strip(script)) {
            fb.className = "fb good"; fb.textContent = L("¡Genial! Your fashion-show commentary is ready.","¡Genial! Tu comentario del desfile está listo."); speak(script);
            award("8 Desfile", "Fashion show script", script, 1, true, w.querySelector(".go")); act.innerHTML = ""; act.append(listenBtn(script));
            nextBtn(act, L("Finish Unit 7 →","Terminar la Unidad 7 →"), next);
          } else { fb.className = "fb bad"; fb.textContent = L("Not an exact match yet — check spelling, accents and full stops.","Aún no es idéntico — revisa ortografía, acentos y puntos."); }
        });
        act.append(w);
      }
    }
    render();
  };

  /* ===== STAGES ===== */
  const STAGE_DEFS = [
    { t:"1 · Repaso", how:L("Level 1: A quick restart of Units 1–6 — ser, estar, ir, verbs, prices — from zero. Never did them? Start here!","Nivel 1: repaso de las Unidades 1–6 — ser, estar, ir, verbos, precios — desde cero. ¿No las hiciste? ¡Empieza aquí!"), parts:[Cards(recapCards), Deck("rc","1 Repaso",recapQs), Typer("rcT","1 Repaso",recapT)] },
    { t:"2 · La Ropa", how:L("Level 2: Clothes with real photos — jersey vs suéter, gafas vs lentes, bolso vs cartera.","Nivel 2: ropa con fotos reales — jersey vs suéter, gafas vs lentes, bolso vs cartera."), parts:[Cards(clothCards), Deck("cq","2 Ropa",clothQs), Sorter("cs","2 Ropa",clothSort), Typer("cT","2 Ropa",clothT)] },
    { t:"3 · Este, ese, aquel", how:L("Level 3: Three distances — este (here), ese (near you), aquel (far). Match the noun!","Nivel 3: tres distancias — este (aquí), ese (cerca de ti), aquel (lejos). ¡Concuerda con el sustantivo!"), parts:[Cards(demCards), Deck("dm","3 Demostrativos",demQs), Typer("dT","3 Demostrativos",demT)] },
    { t:"4 · Colores", how:L("Level 4: Colours, patterns and materials — the adjective goes AFTER the noun and agrees.","Nivel 4: colores, patrones y materiales — el adjetivo va DESPUÉS del sustantivo y concuerda."), parts:[Cards(colCards), Deck("cl","4 Colores",colQs), Typer("lT","4 Colores",colT)] },
    { t:"5 · Me pongo", how:L("Level 5: Reflexive verbs — ponerse (me pongo, te pones, se pone…).","Nivel 5: verbos reflexivos — ponerse (me pongo, te pones, se pone…)."), parts:[Cards(refCards), Deck("rf","5 Reflexivos",refQs), Typer("rT","5 Reflexivos",refT)] },
    { t:"6 · La Tienda", how:L("Level 6: At the shop — prices, sizes and llevar.","Nivel 6: en la tienda — precios, tallas y llevar."), parts:[Cards(shopCards), Deck("sh","6 Tienda",shopQs), Typer("hT","6 Tienda",shopT)] },
    { t:"7 · Cultura", how:L("Level 7: Zara vs Indigenous weaving, a real photo to label, and a fashion blog to read.","Nivel 7: Zara vs tejido indígena, una foto real para etiquetar y un blog de moda para leer."), parts:[Cards(cultCards), OutLabel, Deck("cu","7 Cultura",cultQs), Deck("bl","7 Cultura",blogQs)] },
    { t:"8 · Desfile", how:L("Final project: narrate your own fashion show.","Proyecto final: narra tu propio desfile de moda."), parts:[ShowBuilder] }
  ];

  /* ---- bonus: Vístete (build-and-assemble: dress the model with reflexive sentences; 2 min wall-clock) ---- */
  const SLOTPOS = { head:[50,6], neck:[50,19], top:[50,36], hands:[18,48], legs:[50,64], feet:[50,87] };
  const BYSLOT = {}; Object.keys(GARM).forEach(k => { (BYSLOT[GARM[k].slot] = BYSLOT[GARM[k].slot] || []).push(k); });
  const REFS = [["Yo","me pongo"],["Tú","te pones"],["Ella","se pone"],["Nosotros","nos ponemos"],["Ellos","se ponen"]];
  function bonusSection() {
    const box = host.querySelector("#bonus"); if (!box || box.dataset.on) return; box.dataset.on = "1";
    box.innerHTML = `<div class="duelc"><div class="row-label">${L("Bonus round","Ronda extra")}</div><h3 class="pz-title">${L("Vístete: Desfile Rápido","Vístete: Desfile Rápido")}</h3><p>${L("Read the sentence (me pongo, se pone…) and tap the right garment photo to dress the model. Complete outfits for the runway! 2 minutes, no lives — a wrong tap just shakes.","Lee la frase (me pongo, se pone…) y toca la foto de la prenda correcta para vestir al modelo. ¡Completa conjuntos para la pasarela! 2 minutos, sin vidas: un fallo solo tiembla.")}</p><button type="button" class="btn btn--signal" id="dgo">🎮 ${L("Play (2 min)","Jugar (2 min)")}</button> <button type="button" class="btn" id="dsk">${L("Skip →","Saltar →")}</button></div>`;
    box.querySelector("#dsk").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
    box.querySelector("#dgo").onclick = () => play();
    function play() {
      const DUR = 120000, t0 = Date.now(); let score = 0, streak = 0, best = 0, hits = 0, total = 0, outfits = 0, queue = [], cur = null, locked = false, timer = null;
      box.innerHTML = `<div class="duelc"><div class="duel-hud"><span>${L("Time","Tiempo")} <b id="dt">2:00</b></span><span>${L("Outfits","Conjuntos")} <b id="ds">0</b></span><span>🔥 <b id="dk">0</b></span><button type="button" class="chip" id="dm" style="min-height:30px;padding:.1em .6em">${muted ? "🔇" : "🔊"}</button></div><p class="duel-q es" id="dq"></p><div class="dressrow"><div class="mannequin" id="mq"><svg viewBox="0 0 120 220" aria-hidden="true"><circle cx="60" cy="20" r="14" fill="#c9a98a"/><rect x="48" y="34" width="24" height="14" fill="#c9a98a"/><rect x="38" y="48" width="44" height="70" rx="10" fill="#8a8f98"/><rect x="22" y="50" width="14" height="62" rx="7" fill="#8a8f98"/><rect x="84" y="50" width="14" height="62" rx="7" fill="#8a8f98"/><rect x="42" y="118" width="16" height="80" rx="6" fill="#6f747c"/><rect x="62" y="118" width="16" height="80" rx="6" fill="#6f747c"/></svg></div><div class="tray" id="tr"></div></div><div class="fb" id="df" role="status"></div></div>`;
      const q = (s) => box.querySelector(s);
      q("#dm").onclick = (e) => { muted = !muted; if (muted) { try { speechSynthesis.cancel(); } catch (x) {} setTTS(false); } e.currentTarget.textContent = muted ? "🔇" : "🔊"; };
      const hudT = () => { const left = Math.max(0, DUR - (Date.now() - t0)); q("#dt").textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0"); q("#ds").textContent = outfits; q("#dk").textContent = streak; };
      function newOutfit() {
        q("#mq").querySelectorAll(".worn").forEach(x => x.remove());
        const slots = shuffle(["head","neck","top","hands","legs","feet"]).slice(0, 4);
        queue = slots.map(s => { const k = BYSLOT[s][Math.floor(Math.random() * BYSLOT[s].length)], r = REFS[Math.floor(Math.random() * REFS.length)]; return { k, slot:s, r }; });
        nextItem();
      }
      function nextItem() {
        if (!queue.length) { outfits++; q("#df").className = "fb good"; q("#df").textContent = L("¡Desfile! Outfit complete.","¡Desfile! Conjunto completo."); hudT(); setTimeout(() => { if (Date.now() - t0 < DUR) newOutfit(); }, 1200); return; }
        cur = queue.shift(); locked = false;
        q("#dq").textContent = `${cur.r[0]} ${cur.r[1]} ${GARM[cur.k].a} ${GARM[cur.k].n}.`; speak(q("#dq").textContent);
        const others = shuffle(Object.keys(GARM).filter(x => x !== cur.k)).slice(0, 5).concat([cur.k]);
        q("#tr").innerHTML = shuffle(others).map(k => `<button type="button" class="tbtn" data-k="${k}"><img src="photos/moda/${k}.jpg" alt="" width="64" height="64"></button>`).join("");
        q("#tr").querySelectorAll(".tbtn").forEach(b => b.onclick = () => pick(b));
      }
      function pick(b) {
        if (locked) return; total++; const ok = b.dataset.k === cur.k;
        if (ok) { locked = true; hits++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; const pos = SLOTPOS[cur.slot]; const im = $(`<img class="worn" src="photos/moda/${cur.k}.jpg" alt="" style="left:${pos[0]}%;top:${pos[1]}%">`); q("#mq").append(im); b.classList.add("is-ok"); q("#df").className = "fb good"; q("#df").textContent = "¡Sí! " + cur.r[0] + " " + cur.r[1] + " " + GARM[cur.k].a + " " + GARM[cur.k].n; sim.recordTrial({ nivel:"Bonus", tarea:`${cur.r[0]} ${cur.r[1]} ${GARM[cur.k].a} ${GARM[cur.k].n}`, respuesta:GARM[cur.k].n, correcto:"Yes", intentos:1 }); burst(b); hudT(); setTimeout(() => { if (Date.now() - t0 < DUR) nextItem(); }, 700); }
        else { streak = 0; b.classList.add("is-bad"); setTimeout(() => b.classList.remove("is-bad"), 500); q("#df").className = "fb bad"; q("#df").textContent = L("Not that garment — read the sentence again: ","Esa no — lee otra vez: ") + GARM[b.dataset.k].a + " " + GARM[b.dataset.k].n + " ≠ " + GARM[cur.k].a + " " + GARM[cur.k].n; hudT(); }
      }
      timer = setInterval(() => { hudT(); if (Date.now() - t0 >= DUR) { clearInterval(timer); end(); } }, 250);
      function end() {
        box.innerHTML = `<div class="duelc"><h3 class="pz-title">${L("¡Fin del desfile!","¡Fin del desfile!")}</h3><p>${L("Outfits","Conjuntos")} <b>${outfits}</b> · ${L("Accuracy","Precisión")} <b>${total ? Math.round(hits / total * 100) : 0}%</b> · ${L("Best streak","Mejor racha")} <b>${best}</b></p><button type="button" class="btn btn--signal" id="dag">${L("Play again","Jugar otra vez")}</button> <button type="button" class="btn" id="dcl">${L("Close","Cerrar")}</button></div>`;
        box.querySelector("#dag").onclick = () => play(); box.querySelector("#dcl").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
        sim.toast(L(`Vístete: ${outfits} outfits, ${total ? Math.round(hits / total * 100) : 0}% accuracy.`, `Vístete: ${outfits} conjuntos, ${total ? Math.round(hits / total * 100) : 0}% de precisión.`), "info");
      }
      newOutfit(); hudT();
    }
  }

  function paint() {
    body.innerHTML = ""; hud();
    if (S.stage >= STAGE_DEFS.length) { finale(); return; }
    const def = STAGE_DEFS[S.stage];
    globe.flyTo(STAGE_STOP[S.stage]);
    const slot = panel(def.t, def.how);
    parts(slot, "st" + S.stage, def.parts, () => {
      slot.innerHTML = `<p class="fb good">${L("¡Nivel completo!","¡Nivel completado!")}</p>`;
      nextBtn(slot, S.stage < STAGE_DEFS.length - 1 ? L("Next level →","Siguiente nivel →") : L("Finish Unit 7 →","Terminar la Unidad 7 →"), () => { S.stage++; sim.saveState(); paint(); window.scrollTo({ top: host.offsetTop - 20, behavior: reduced() ? "auto" : "smooth" }); });
    });
  }
  function finale() {
    body.innerHTML = `<div class="done-card"><h3>¡Unidad 7 completa!</h3><div class="big">${rankFor(S.xp)}</div><p>${S.xp} XP · ${L("best streak","mejor racha")} ${S.best} · ${S.firstTry} ${L("first-try answers","respuestas a la primera")}</p><p>${L("Scroll down to check your Record, answer Explain and Apply, and generate your evidence PDF.","Baja para revisar tu Registro, responder Explica y Aplica, y generar tu PDF de evidencias.")}</p></div>`;
    bonusSection();
  }








  paint();
  fetch("photos/moda/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown"} (${v.license})</div>`).join("");
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
