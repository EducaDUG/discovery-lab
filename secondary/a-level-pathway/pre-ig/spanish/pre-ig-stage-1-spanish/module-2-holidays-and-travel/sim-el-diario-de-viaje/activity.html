        parts = parts.filter(p => { p.t += dt; const a = p.pts.geometry.attributes.position; for (let i = 0; i < p.v.length; i++) { a.array[i * 3] += p.v[i].x * dt; a.array[i * 3 + 1] += (p.v[i].y -= 9 * dt) * dt; a.array[i * 3 + 2] += p.v[i].z * dt; } a.needsUpdate = true; if (p.t > 1) { scene.remove(p.pts); p.pts.geometry.dispose(); return false; } return true; });
        renderer.render(scene, cam);
      };
      raf = requestAnimationFrame(frame);
      const onResize = () => { const ww = stage.clientWidth, hh = stage.clientHeight; if (ww && hh) { renderer.setSize(ww, hh); cam.aspect = ww / hh; cam.updateProjectionMatrix(); } }; addEventListener("resize", onResize); gates.off = () => removeEventListener("resize", onResize);
    } else { stage.innerHTML = `<div class="ex-flat">Your device cannot show the 3D train — the game still works: pick the lane (1, 2 or 3) before the timer bar fills.</div>`; }
    function hud() { const left = Math.max(0, DUR - now()); el("#tm").textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0"); el("#sc").textContent = score; el("#sk2").textContent = streak; }
    function resolveGate(n) {
      const Q = getQ(n), good = lane === Q.ans; total++;
      if (good) { right++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; msg.textContent = "¡Sí! " + Q.opts[Q.ans].t + " ✓ " + Q.b.hook; msg.style.color = "#8be29d"; }
      else { streak = 0; msg.textContent = "Answer: " + Q.opts[Q.ans].t + " · " + Q.b.hook; msg.style.color = "#ffd27a"; }
      if (gates && gates.burst && !reduced()) gates.burst((laneVis - 1) * 3, good);
      hud();
    }
    function finish() {
      if (over) return; over = true; clearInterval(tick); cancelAnimationFrame(raf); removeEventListener("keydown", onKey);
      if (renderer) { renderer.dispose(); } if (gates && gates.off) gates.off();
      const acc = total ? Math.round(right / total * 100) : 0;
      box.innerHTML = `<div class="ex"><h3>¡Fin del viaje!</h3><p>Score <b>${score}</b> · ${right}/${total} correct (${acc}%) · best streak ${best}</p><p>${acc >= 70 ? "¡Excelente! You really know the past tense." : "Good ride! Play again to lock in the endings."}</p><button type="button" class="btn btn--signal" id="ag">Play again</button> <button type="button" class="btn" id="dn">Continue</button></div>`;
      box.querySelector("#ag").onclick = () => express(box); box.querySelector("#dn").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; bonusSection(); sim.toast(`El Expreso: score ${score}, ${acc}% accuracy.`, "info"); };
    }
    const onKey = (e) => { if (over) return; if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return; if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); setLane(lane - 1); } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); setLane(lane + 1); } else if (["1", "2", "3"].includes(e.key)) { setLane(+e.key - 1); } };
    addEventListener("keydown", onKey);
    el("#quit").onclick = finish;
    paintQ(0);
    const tick = setInterval(() => {
      if (over) return; if (!document.body.contains(box.querySelector("#q") || document.body)) { }
      const t = now(); const n = Math.floor(t / GATE);
      if (t >= DUR) { finish(); return; }
      if (n !== qn) { qn = n; paintQ(qn); msg.style.color = "#ffd27a"; }
      if (t - n * GATE >= FLY && resolved < n) { resolved = n; resolveGate(n); }
      hud();
    }, 100);
  }

  paint();
  fetch("photos/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown author"}, ${v.license}</div>`).join("") + `<div>Clothing photos: see <code>photos/clothes/credits.json</code> (also Wikimedia Commons).</div><div>The globe is a stylised drawing, not a map.</div>`;
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
