    { t:"5 · Direcciones", how:L("Level 5: Directions — follow each route on the map and find where you end up.","Nivel 5: direcciones — sigue cada ruta en el mapa y encuentra dónde acabas."), parts:[Cards(dirCards), Deck("dq","5 Direcciones",dirQs), Typer("dT","5 Direcciones",dirT)] },
    { t:"6 · Dinero", how:L("Level 6: Numbers 100–1000 and euros vs pesos.","Nivel 6: números 100–1000 y euros vs pesos."), parts:[Cards(numCards), Deck("nq","6 Dinero",numQs), Typer("nT","6 Dinero",numT)] },
    { t:"7 · Arquitectura", how:L("Level 7: Gothic vs colonial architecture, a real photo to label, and future plans.","Nivel 7: arquitectura gótica vs colonial, una foto real para etiquetar y planes futuros."), parts:[Cards(archCards), OsoLabel, Deck("aq","7 Arquitectura",archQs)] },
    { t:"8 · Mi Ruta", how:L("Final project: be the tour guide — safe transport, directions, a plan and a price.","Proyecto final: sé el guía — transporte seguro, direcciones, un plan y un precio."), parts:[RouteBuilder] }
  ];

  /* ---- bonus: Taxi Navigator (race / vehicle control on the city map, 2 min wall-clock) ---- */
  const TAXI_TARGETS = Object.keys(PLACES6);
  function bonusSection() {
    const box = host.querySelector("#bonus"); if (!box || box.dataset.on) return; box.dataset.on = "1";
    box.innerHTML = `<div class="duelc"><div class="row-label">${L("Bonus round","Ronda extra")}</div><h3 class="pz-title">${L("Taxi Navigator","Taxi Navigator")}</h3><p>${L("Drive the taxi! Each tourist says where to go (“Llévame al museo”). Use Todo recto / A la derecha / A la izquierda (or the arrow keys ↑ → ←) to reach the place. 2 minutes, no lives — walls just bump you back.","¡Conduce el taxi! Cada turista dice adónde ir (“Llévame al museo”). Usa Todo recto / A la derecha / A la izquierda (o las flechas ↑ → ←) para llegar. 2 minutos, sin vidas: las paredes solo te frenan.")}</p><button type="button" class="btn btn--signal" id="dgo">🎮 ${L("Play (2 min)","Jugar (2 min)")}</button> <button type="button" class="btn" id="dsk">${L("Skip →","Saltar →")}</button></div>`;
    box.querySelector("#dsk").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
    box.querySelector("#dgo").onclick = () => play();
    function play() {
      const DUR = 120000, t0 = Date.now(); let score = 0, streak = 0, best = 0, arrived = 0, bumps = 0, steps = 0, taxi = { pos:START6.slice(), h:0 }, target = null, timer = null;
      box.innerHTML = `<div class="duelc"><div class="duel-hud"><span>${L("Time","Tiempo")} <b id="dt">2:00</b></span><span>${L("Trips","Viajes")} <b id="ds">0</b></span><span>🔥 <b id="dk">0</b></span><button type="button" class="chip" id="dm" style="min-height:30px;padding:.1em .6em">${muted ? "🔇" : "🔊"}</button></div><p class="duel-q es" id="dq"></p><div id="map"></div><div class="goalbtns"><button type="button" class="chip es" data-m="I" style="min-height:52px">← ${MOVE_ES.I}</button><button type="button" class="chip es" data-m="F" style="min-height:52px">↑ ${MOVE_ES.F}</button><button type="button" class="chip es" data-m="R" style="min-height:52px">${MOVE_ES.R} →</button></div><div class="fb" id="df" role="status"></div></div>`;
      const q = (s) => box.querySelector(s);
      q("#dm").onclick = (e) => { muted = !muted; if (muted) { try { speechSynthesis.cancel(); } catch (x) {} setTTS(false); } e.currentTarget.textContent = muted ? "🔇" : "🔊"; };
      const hudT = () => { const left = Math.max(0, DUR - (Date.now() - t0)); q("#dt").textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0"); q("#ds").textContent = arrived; q("#dk").textContent = streak; };
      const draw = () => { q("#map").innerHTML = gridHTML(null, taxi, target); };
      function pick() { const cur = placeAt(taxi.pos[0], taxi.pos[1]); const opts = TAXI_TARGETS.filter(k => k !== cur); target = opts[Math.floor(Math.random() * opts.length)]; q("#dq").textContent = `Llévame ${PLACES6[target][2].startsWith("el ") ? "al " + PLACES6[target][2].slice(3) : "a " + PLACES6[target][2]}.`; speak(q("#dq").textContent); draw(); }
      function move(mv) {
        if (Date.now() - t0 >= DUR) return; const r = stepMove(taxi.pos, taxi.h, mv); steps++;
        if (!r) { bumps++; streak = 0; q("#df").className = "fb bad"; q("#df").textContent = L("Bump! That is the edge of the city — try another direction.","¡Choque! Es el borde de la ciudad: prueba otra dirección."); hudT(); return; }
        taxi = { pos:r.pos, h:r.h }; q("#df").textContent = ""; draw();
        if (placeAt(taxi.pos[0], taxi.pos[1]) === target) { arrived++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; q("#df").className = "fb good"; q("#df").textContent = "¡Llegamos! " + PLACES6[target][2]; sim.recordTrial({ nivel:"Bonus", tarea:"Taxi to " + PLACES6[target][2], respuesta:`${steps} steps`, correcto:"Yes", intentos:1 }); steps = 0; burst(q("#map")); hudT(); setTimeout(() => { if (Date.now() - t0 < DUR) pick(); }, 900); }
      }
      box.querySelectorAll(".goalbtns button").forEach(b => b.onclick = () => move(b.dataset.m));
      const keyH = (e) => { if (!document.body.contains(box.querySelector(".duelc"))) { document.removeEventListener("keydown", keyH); return; } if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; if (e.key === "ArrowUp") { e.preventDefault(); move("F"); } if (e.key === "ArrowRight") { e.preventDefault(); move("R"); } if (e.key === "ArrowLeft") { e.preventDefault(); move("I"); } };
      document.addEventListener("keydown", keyH);
      timer = setInterval(() => { hudT(); if (Date.now() - t0 >= DUR) { clearInterval(timer); document.removeEventListener("keydown", keyH); end(); } }, 250);
      function end() {
        box.innerHTML = `<div class="duelc"><h3 class="pz-title">${L("¡Fin del turno!","¡Fin del turno!")}</h3><p>${L("Trips","Viajes")} <b>${arrived}</b> · ${L("Best streak","Mejor racha")} <b>${best}</b> · ${L("Bumps","Choques")} <b>${bumps}</b></p><button type="button" class="btn btn--signal" id="dag">${L("Play again","Jugar otra vez")}</button> <button type="button" class="btn" id="dcl">${L("Close","Cerrar")}</button></div>`;
        box.querySelector("#dag").onclick = () => play(); box.querySelector("#dcl").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
        sim.toast(L(`Taxi Navigator: ${arrived} trips.`, `Taxi Navigator: ${arrived} viajes.`), "info");
      }
      pick(); hudT();
    }
  }

  function paint() {
    body.innerHTML = ""; hud();
    if (S.stage >= STAGE_DEFS.length) { finale(); return; }
    const def = STAGE_DEFS[S.stage];
    globe.flyTo(STAGE_STOP[S.stage]);
    const slot = panel(def.t, def.how);
    parts(slot, "st" + S.stage, def.parts, () => {
      slot.innerHTML = `<p class="fb good">${L("¡Nivel completo!","¡Nivel completado!")}</p>`;
      nextBtn(slot, S.stage < STAGE_DEFS.length - 1 ? L("Next level →","Siguiente nivel →") : L("Finish Unit 6 →","Terminar la Unidad 6 →"), () => { S.stage++; sim.saveState(); paint(); window.scrollTo({ top: host.offsetTop - 20, behavior: reduced() ? "auto" : "smooth" }); });
    });
  }
  function finale() {
    body.innerHTML = `<div class="done-card"><h3>¡Unidad 6 completa!</h3><div class="big">${rankFor(S.xp)}</div><p>${S.xp} XP · ${L("best streak","mejor racha")} ${S.best} · ${S.firstTry} ${L("first-try answers","respuestas a la primera")}</p><p>${L("Scroll down to check your Record, answer Explain and Apply, and generate your evidence PDF.","Baja para revisar tu Registro, responder Explica y Aplica, y generar tu PDF de evidencias.")}</p></div>`;
    bonusSection();
  }







  paint();
  fetch("photos/ciudad/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown"} (${v.license})</div>`).join("");
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
