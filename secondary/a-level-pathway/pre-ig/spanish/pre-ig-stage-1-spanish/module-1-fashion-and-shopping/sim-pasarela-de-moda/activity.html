/* ================= INVESTIGATE ================= */
function drawInvestigate(host, sim) {
  sim.state.custom = sim.state.custom || {};
  const S = sim.state.custom;
  S.stage = S.stage || 0; S.xp = S.xp || 0; S.streak = S.streak || 0; S.best = S.best || 0; S.p = S.p || {}; S.firstTry = S.firstTry || 0; S.answered = S.answered || 0;
  const STAGES = ["El Armario","Señala","Vístete","Pasarela","En la Tienda","Cultura"];
  host.innerHTML = `<div class="pz-hud"><span class="pz-hud__rank" id="rk"></span><span class="pz-hud__bar"><i id="bar"></i></span><span><b id="xp"></b> XP · 🔥 <b id="st"></b></span></div><div class="pz-tabs" id="tabs"></div><div id="body"></div><div id="bonus" style="margin-top:var(--sp-5)"></div>`;
  const body = host.querySelector("#body");

  function hud() {
    host.querySelector("#rk").textContent = rankFor(S.xp);
    host.querySelector("#xp").textContent = S.xp; host.querySelector("#st").textContent = S.streak;
    host.querySelector("#bar").style.width = Math.min(100, S.xp / 6.2) + "%";
    host.querySelector("#tabs").innerHTML = STAGES.map((n, i) => `<span class="pz-tab ${i < S.stage ? "is-done" : i === S.stage ? "is-now" : ""}">${i + 1}. ${n}${i < S.stage ? " ✓" : ""}</span>`).join("");
  }
  function burst(el, color) {
    const r = el.getBoundingClientRect(), root = el.closest(".pz-panel") || el;
    const rr = root.getBoundingClientRect(); root.style.position = "relative";
    for (let i = 0; i < 12; i++) {
      const s = document.createElement("i"); s.className = "burst";
      s.style.left = (r.left - rr.left + r.width / 2) + "px"; s.style.top = (r.top - rr.top + r.height / 2) + "px";
      s.style.background = ["#f0a030", "#d2562b", "#7a1f3d", "#2e8b57"][i % 4];
      const a = Math.random() * 6.28, d = 30 + Math.random() * 50; s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
      root.append(s); setTimeout(() => s.remove(), 850);
    }
  }
  function award(nivel, tarea, respuesta, tries, ok, anchor) {
    if (ok) { S.xp += tries === 1 ? 10 + Math.min(S.streak, 5) * 2 : 5; S.streak = tries === 1 ? S.streak + 1 : 0; if (tries === 1) S.firstTry++; }
    else S.streak = 0;
    S.best = Math.max(S.best, S.streak); S.answered++;
    sim.recordTrial({ nivel, tarea, respuesta, correcto: ok ? "Yes" : "No", intentos: tries });
    if (ok && anchor) burst(anchor);
    sim.save && sim.save(); hud();
  }
  const finishStage = (container) => {
    const b = $(`<button type="button" class="btn btn--signal pz-next">${S.stage < 5 ? "Next level →" : "Finish the collection →"}</button>`);
    b.addEventListener("click", () => { S.stage++; sim.save && sim.save(); paint(); });
    container.append(b);
  };
  const panel = (title, how) => { const p = $(`<section class="pz-panel"><h3 class="pz-title">${title}</h3><div class="pz-how">${how}</div><div class="slot"></div></section>`); body.append(p); return p.querySelector(".slot"); };

  /* ---- generic one-question-at-a-time multiple choice ---- */
  function deck(slot, k, nivel, qs, done) {
    const i = S.p[k] || 0;
    if (i >= qs.length) { done(); return; }
    const q = qs[i]; let tries = 0;
    slot.innerHTML = `<div class="pz-count">${i + 1} / ${qs.length}</div><div class="vis">${q.visual || ""}</div><p><b>${q.q}</b></p><div class="pz-chips"></div><div class="fb"></div>`;
    const chips = slot.querySelector(".pz-chips"), fb = slot.querySelector(".fb");
    shuffle(q.opts).forEach(o => {
      const c = $(`<button type="button" class="chip es">${o}</button>`);
      c.addEventListener("click", () => {
        tries++;
        if (o === q.ok) {
          c.classList.add("is-ok"); chips.querySelectorAll("button").forEach(b => b.disabled = true);
          fb.className = "fb good"; fb.textContent = "¡Correcto! " + (q.why || "");
          award(nivel, q.task || q.q, o, tries, true, c);
          setTimeout(() => { S.p[k] = i + 1; deck(slot, k, nivel, qs, done); }, 1300);
        } else {
          c.classList.add("is-bad"); c.disabled = true;
          if (tries >= 2) {
            chips.querySelectorAll("button").forEach(b => { b.disabled = true; if (b.textContent === q.ok) b.classList.add("is-ok"); });
            fb.className = "fb bad"; fb.textContent = "The answer is “" + q.ok + "”. " + (q.why || "");
            award(nivel, q.task || q.q, o, tries, false);
            setTimeout(() => { S.p[k] = i + 1; deck(slot, k, nivel, qs, done); }, 2300);
          } else { fb.className = "fb bad"; fb.textContent = "Not quite — try once more. " + (q.hint || ""); }
        }
      });
      chips.append(c);
    });
  }

  /* ---- generic multi-row sentence builder ---- */
  function builder(slot, k, nivel, rounds, done) {
    const i = S.p[k] || 0;
    if (i >= rounds.length) { done(); return; }
    const R = rounds[i]; let tries = 0; const sel = {};
    slot.innerHTML = `<div class="pz-count">${i + 1} / ${rounds.length}</div><div class="vis">${R.visual}</div><div class="preview"></div><div class="rows"></div><div class="fb"></div>`;
    const prev = slot.querySelector(".preview"), rowsEl = slot.querySelector(".rows"), fb = slot.querySelector(".fb");
    const paintPrev = () => { prev.innerHTML = R.preview(sel); };
    paintPrev();
    const rowEls = {};
    R.rows.forEach(row => {
      const wrap = $(`<div><div class="row-label">${row.label}</div><div class="pz-chips"></div></div>`);
      rowEls[row.id] = wrap.querySelector(".pz-chips");
      shuffle(row.opts).forEach(o => {
        const c = $(`<button type="button" class="chip es">${o}</button>`);
        c.addEventListener("click", () => {
          if (slot.dataset.locked) return;
          rowEls[row.id].querySelectorAll("button").forEach(b => b.classList.remove("is-on", "is-bad"));
          c.classList.add("is-on"); sel[row.id] = o; paintPrev();
          if (R.rows.every(r => sel[r.id])) check();
        });
        rowEls[row.id].append(c);
      });
      rowsEl.append(wrap);
    });
    function reveal(ok) {
      slot.dataset.locked = "1";
      R.rows.forEach(r => rowEls[r.id].querySelectorAll("button").forEach(b => { b.disabled = true; if (b.textContent === r.ans) { b.classList.remove("is-on", "is-bad"); b.classList.add("is-ok"); } }));
      const full = R.rows.reduce((o, r) => (o[r.id] = r.ans, o), {});
      prev.innerHTML = R.preview(full, true);
      R.reveal && R.reveal(slot.querySelector(".vis"));
      award(nivel, R.task, R.rows.map(r => sel[r.id]).join(" "), tries, ok, prev);
      fb.className = "fb " + (ok ? "good" : "bad");
      fb.textContent = ok ? "¡Muy bien! " + (R.why || "") : "Here is the full answer. " + (R.why || "");
      setTimeout(() => { S.p[k] = i + 1; delete slot.dataset.locked; builder(slot, k, nivel, rounds, done); }, ok ? 1900 : 3000);
    }
    function check() {
      tries++;
      const wrong = R.rows.filter(r => sel[r.id] !== r.ans);
      if (!wrong.length) { reveal(true); return; }
      wrong.forEach(r => { rowEls[r.id].querySelectorAll("button.is-on").forEach(b => { b.classList.remove("is-on"); b.classList.add("is-bad"); b.disabled = true; }); delete sel[r.id]; });
      paintPrev();
      if (tries >= 2) { reveal(false); return; }
      fb.className = "fb bad"; fb.textContent = "Check: " + wrong.map(r => r.hint).join(" · ");
    }
  }

  /* ================= STAGE 1: El Armario ================= */
  function stage1() {

          else { b.classList.remove("is-wrong"); void b.offsetWidth; b.classList.add("is-wrong"); f.className = "fb bad"; f.textContent = "Not that one — look again for " + t.en + "."; }

  /* ================= STAGE 2: Señala ================= */

          <div class="thing ${d === "far" ? "is-far" : ""}" style="left:110%" data-d="${d}">${gar(id, "#e8a33a")}<b class="es" style="font-size:.8rem">${it.a} ${it.n}</b></div><div class="tag"></div></div>`,

  /* ================= STAGE 3: Vístete ================= */
  const MANN = {

  /* ================= STAGE 4: Pasarela ================= */
  function stage4() {
    const slot = panel("Nivel 4 · Pasarela (Runway)", "Describe the model with <b>llevar</b> (to wear). Pick the verb, the article <b>un / una / unos / unas</b>, and the colour. The colour goes <b>after</b> the clothes and must <b>match</b> them (una falda roja, unos zapatos negros).");
    const rounds = LLEVA.map(d => {
      const it = IT[d.item], kk = key(it), col = COL[d.c];
      const forms = [...new Set([col.ms, col.fs, col.mp, col.fp])];
      while (forms.length < 4) forms.push(col.ms + (forms.length % 2 ? "a" : "o") + (forms.length > 3 ? "s" : ""));
      return {
        task: `${d.subj} ${d.v} ${ART_IND[kk]} ${it.n} ${col[kk]}`,
        visual: `<div style="text-align:center"><div class="runway"><div class="spot"></div><div class="model">${gar(d.item, col.hex)}</div></div><p><span class="es">${d.subj}</span> · ${it.en} · <span class="price">€${d.price}</span></p></div>`,
        preview: (s) => `${d.subj} <u>${s.v || "_____"}</u> <u>${s.art || "__"}</u> ${it.n} <u>${s.adj || "_____"}</u>.`,

          { id:"v", label:"1. The verb llevar", opts:LLEVAR_FORMS, ans:d.v, hint:`“${d.subj}” goes with “${d.v}”.` },

          { id:"adj", label:"3. The colour (it goes AFTER the noun and agrees)", opts:forms.slice(0, 4), ans:col[kk], hint:`the colour must agree with “${it.n}” → “${col[kk]}”.` }
        ],
        why: `${d.subj} ${d.v} ${ART_IND[kk]} ${it.n} ${col[kk]}.`
      };
    });
    builder(slot, "llev", "4 Llevar", rounds, () => { slot.innerHTML = `<p class="fb good">¡Nivel 4 completo! The audience loves your collection.</p>`; finishStage(slot); });
  }

  /* ================= STAGE 5: En la Tienda ================= */
  function stage5() {
    const slot = panel("Nivel 5 · En la Tienda", "Rebuild a real shop conversation. Tap the line that comes <b>next</b>. <b>V</b> = vendedor (shop assistant), <b>C</b> = cliente (customer). Use “Show English” if you need help.");
    S.p.shop = S.p.shop || 0; let tries = 0, mistakes = 0;
    function paint() {
      const n = S.p.shop;
      slot.innerHTML = `<label><input type="checkbox" id="en"> Show English</label><div class="chat"></div><p class="pz-count">Lines left: ${SHOP.length - n}</p><div class="pool"></div><div class="fb"></div>`;
      const chat = slot.querySelector(".chat"), pool = slot.querySelector(".pool"), fb = slot.querySelector(".fb");
      slot.querySelector("#en").addEventListener("change", e => slot.classList.toggle("show-en", e.target.checked));
      const line = (l) => `<div class="bubble ${l.who}"><small>${l.who === "v" ? "Vendedor" : "Cliente"}</small>${l.es}<div class="en">${l.en}</div></div>`;
      SHOP.slice(0, n).forEach(l => chat.append($(line(l))));
      if (n >= SHOP.length) { pool.remove(); fb.className = "fb good"; fb.textContent = "¡Conversación completa! Perfect."; finishStage(slot); return; }
      const left = shuffle(SHOP.slice(n).map((l, i) => ({ l, idx: n + i })));
      left.forEach(({ l, idx }) => {
        const b = $(`<button type="button" class="chip es">${l.who === "v" ? "V" : "C"}: ${l.es}</button>`);
        b.addEventListener("click", () => {
          if (idx === n) {
            tries++;
            award("5 Shop", "Line " + (n + 1) + " of the conversation", l.es, mistakes ? 2 : 1, true, b);
            mistakes = 0; S.p.shop++; paint();
          } else { mistakes++; b.classList.remove("is-bad"); void b.offsetWidth; b.classList.add("is-bad"); fb.className = "fb bad"; fb.textContent = "Not yet — who speaks next? Think about what was just said. " + (mistakes > 1 ? "Hint: " + (SHOP[n].who === "v" ? "the vendedor" : "the cliente") + " speaks." : ""); }
        });
        pool.append(b);
      });
    }
    paint();
  }

  /* ================= STAGE 6: Cultura ================= */
  function stage6() {
    const slot = panel("Nivel 6 · Cultura y Blog", "Spanish fashion has two faces. <b>Tap the photo</b> that shows <b>slow fashion</b> (handmade, takes months). Then tap the blog sentences to read the English, and answer 3 questions.");
    const part = $("<div></div>"); slot.append(part);
    let tries = 0;
    part.innerHTML = `<div class="culture"><button type="button" data-k="zara"><img src="photos/zara-store.jpg" alt="A Zara shop in Madrid"><span><b>Zara (Inditex)</b><br>New designs reach shops twice a week.</span></button><button type="button" data-k="weave"><img src="photos/weaving.jpg" alt="A woman weaving on a backstrap loom in Guatemala"><span><b>Telar de cintura (Guatemala)</b><br>One piece can take months.</span></button></div><p class="credit">${CREDITS.zara}<br>${CREDITS.weaving}</p><p class="fb"></p>`;
    const fb = part.querySelector(".fb");
    part.querySelectorAll(".culture button").forEach(b => b.addEventListener("click", () => {
      if (S.p.cul) return;
      tries++;
      if (b.dataset.k === "weave") { b.classList.add("is-ok"); fb.className = "fb good"; fb.textContent = "¡Correcto! Slow fashion = handmade weaving. Zara is “fast fashion”."; award("6 Culture", "Which photo is slow fashion?", "Backstrap loom", tries, true, b); S.p.cul = 1; startBlog(); }
      else { b.classList.add("is-bad"); fb.className = "fb bad"; fb.textContent = "Zara makes new designs very quickly — that is fast fashion. Try the other photo."; if (tries >= 2) { award("6 Culture", "Which photo is slow fashion?", "Zara", tries, false); S.p.cul = 1; startBlog(); } }
    }));
    function startBlog() {
      const sec = $(`<div><h4 class="pz-title">El blog de moda</h4><div class="blog">${BLOG.map((s, n) => `<span data-n="${n}">${s.es}</span>`).join(" ")}</div><div class="blog-en">Tap a sentence to read the English.</div><div class="qs"></div></div>`);
      slot.append(sec);
      sec.querySelectorAll(".blog span").forEach(s => s.addEventListener("click", () => { sec.querySelector(".blog-en").textContent = BLOG[+s.dataset.n].en; }));
      deck(sec.querySelector(".qs"), "blog", "6 Reading", BLOGQ.map(q => ({ task: q.q, q: q.q, ok: q.ok, opts: q.opts, why: q.why })), () => { sec.querySelector(".qs").innerHTML = `<p class="fb good">¡Nivel 6 completo!</p>`; finishStage(sec.querySelector(".qs")); });
    }
    if (S.p.cul) { startBlog(); }
  }

  function finale() {
    body.innerHTML = `<div class="done-card"><h3>¡Colección completa!</h3><div class="big">${rankFor(S.xp)}</div><p>${S.xp} XP · best streak ${S.best} · ${S.firstTry}/${S.answered} correct first time</p><p>Next: try the bonus round below, then check your Record and keep going to <b>Explain</b>.</p></div>`;
    bonusSection();
  }

  function paint() {
    body.innerHTML = ""; hud();
    [stage1, stage2, stage3, stage4, stage5, stage6][S.stage] ? [stage1, stage2, stage3, stage4, stage5, stage6][S.stage]() : finale();
    if (S.stage > 5) finale();
  }

  /* ================= BONUS: Wordle de la Moda ================= */
  function bonusSection() {
    const box = host.querySelector("#bonus");
    if (box.dataset.on) return; box.dataset.on = 1;
    box.innerHTML = `<div class="pz-panel"><h3 class="pz-title">Bonus · Wordle de la Moda</h3><p>Guess the Spanish clothing word in 6 tries — like Wordle! A picture and the English word are your clues. Accents are not needed. No marks, just fun.</p><button type="button" class="btn btn--signal" id="pl">Play</button> <button type="button" class="btn" id="sk">Skip</button></div>`;
    box.querySelector("#sk").onclick = () => { box.innerHTML = ""; };
    box.querySelector("#pl").onclick = () => wordle(box);
  }
  function wordle(box) {
    const WORDS = shuffle(["falda","botas","gorro","camisa","jersey","bufanda","zapatos","abrigo","guantes","vestido","gafas","chaqueta"]).slice(0, 6);
    let wi = 0, score = 0, streak = 0, best = 0;
    const strip = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
    function round() {
      if (wi >= WORDS.length) {
        box.innerHTML = `<div class="wd"><h3>¡Ronda terminada!</h3><p>${score}/${WORDS.length} words solved · best streak ${best}</p><button type="button" class="btn btn--signal" id="ag">Play again</button> <button type="button" class="btn" id="dn">Continue</button></div>`;
        box.querySelector("#ag").onclick = () => { wi = 0; score = 0; streak = 0; round(); }; box.querySelector("#dn").onclick = () => { box.innerHTML = ""; };
        return;
      }
      const id = WORDS[wi], it = IT[id], target = it.n; let row = 0, cur = ""; const L = target.length;
      box.innerHTML = `<div class="wd"><h3>Word ${wi + 1} / ${WORDS.length}</h3><div class="wd-hint">${gar(id, "#f0a030")}<div><b>${it.en}</b><br><small>${L} letters</small></div></div><div class="wd-grid" id="g"></div><div class="wd-msg" id="m" role="status"></div><div class="wd-kb" id="kb"></div></div>`;
      const g = box.querySelector("#g"), msg = box.querySelector("#m"), kb = box.querySelector("#kb");
      const cells = []; for (let r = 0; r < 6; r++) { const rw = $('<div class="wd-row"></div>'); cells[r] = []; for (let c = 0; c < L; c++) { const x = $('<div class="wd-cell"></div>'); cells[r].push(x); rw.append(x); } g.append(rw); }
      const keys = {}; "qwertyuiopasdfghjklñzxcvbnm".split("").forEach(ch => { const b = $(`<button type="button">${ch}</button>`); b.onclick = () => press(ch); kb.append(b); keys[ch] = b; });
      const en = $('<button type="button" class="wide">Enter</button>'); en.onclick = () => press("Enter"); const bk = $('<button type="button" class="wide">⌫</button>'); bk.onclick = () => press("Backspace"); kb.append(en, bk);
      function press(k) {
        if (!document.body.contains(g)) return;
        if (k === "Enter") { if (cur.length === L) submit(); else msg.textContent = `Need ${L} letters.`; }
        else if (k === "Backspace") { cur = cur.slice(0, -1); draw(); }
        else if (/^[a-zñ]$/i.test(k) && cur.length < L && row < 6) { cur += k.toLowerCase(); draw(); }
      }
      function draw() { cells[row].forEach((c, i) => c.textContent = cur[i] || ""); }
      function submit() {
        const t = strip(target), gs = strip(cur), res = Array(L).fill("no"), pool = {};
        for (let i = 0; i < L; i++) { if (gs[i] === t[i]) res[i] = "ok"; else pool[t[i]] = (pool[t[i]] || 0) + 1; }
        for (let i = 0; i < L; i++) if (res[i] === "no" && pool[gs[i]] > 0) { res[i] = "mid"; pool[gs[i]]--; }
        res.forEach((r, i) => { cells[row][i].classList.add(r); const kk = keys[cur[i]]; if (kk && !kk.classList.contains("ok")) { kk.classList.remove("mid", "no"); kk.classList.add(r); } });
        if (gs === t) { score++; streak++; best = Math.max(best, streak); msg.textContent = `¡Sí! ${it.a} ${it.n}`; document.removeEventListener("keydown", onKey); wi++; setTimeout(round, 1600); return; }
        row++; cur = "";
        if (row >= 6) { streak = 0; msg.textContent = `It was: ${it.a} ${it.n}`; document.removeEventListener("keydown", onKey); wi++; setTimeout(round, 2200); }
        else msg.textContent = "✓ = right place · ~ = wrong place";
      }
      const onKey = (e) => { if (!document.body.contains(g)) { document.removeEventListener("keydown", onKey); return; } if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return; if (e.key === "Enter" || e.key === "Backspace" || /^[a-zA-ZñÑ]$/.test(e.key)) { e.preventDefault(); press(e.key); } };
      document.addEventListener("keydown", onKey);
    }
    round();
  }

  paint();
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
