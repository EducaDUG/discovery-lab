    const items = NOUNS_PHOTO.map(([n,a,en]) => ({ id:n, label:`${n} (${en})`, binId:a === "el" ? "m" : "f", img:`photos/clothes/${n}.jpg` }));
    const bins = [{ id:"m", label:"EL / UN", color:"#2d62c8" }, { id:"f", label:"LA / UNA", color:"#d2562b" }];
    renderConveyorLaunch(box, { strings:{ title:L("Bonus round — La Cinta: EL or LA?","Ronda extra — La Cinta: ¿EL o LA?"), instructions:L("Real photos ride the belt. Sort each into EL (masculine) or LA (feminine) before it reaches the end. No lives, just fun.","Fotos reales viajan por la cinta. Clasifica cada una en EL (masculino) o LA (femenino) antes del final. Sin vidas, solo diversión."), play:L("Play bonus round (2 min)","Jugar ronda extra (2 min)"), skip:L("Skip","Saltar") },
      onSkip() { box.innerHTML = ""; },
      onPlay() {
        box.innerHTML = ""; const gh = document.createElement("div"); box.append(gh);
        mountConveyorSort(gh, { rounds:24, bins, items, strings:{ title:L("La Cinta: EL or LA?","La Cinta: ¿EL o LA?"), instructions:L("Tap the bin, or press 1 / 2, before the photo reaches the end.","Toca el cubo, o pulsa 1 / 2, antes de que la foto llegue al final."), score:L("Score","Puntos"), streak:L("Streak","Racha"), best:L("Best streak","Mejor racha"), progress:L("Item","Objeto"), correct:L("¡Sí!","¡Sí!"), wrong:L("Wrong bin.","Cubo equivocado."), missed:L("Missed it.","Se te escapó."), finishTitle:L("¡Cinta vacía!","¡Cinta vacía!"), accuracy:L("Accuracy","Precisión"), playAgain:L("Play again","Jugar de nuevo"), continueLabel:L("Continue","Continuar"), soundOn:L("Sound on","Sonido activado"), soundOff:L("Sound off","Sonido desactivado") },
          onExit(st) { gh.remove(); box.dataset.on = ""; sim.toast(L(`La Cinta: score ${st.score}, ${st.accuracy}% accuracy.`,`La Cinta: ${st.score} puntos, ${st.accuracy}% de precisión.`), "info"); } });
      } });
  }

  paint();
  fetch("photos/clothes/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary><div>outfit: " + CREDIT_OUTFIT + "</div>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown"} (${v.license})</div>`).join("");
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
