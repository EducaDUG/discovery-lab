    function play() {
      const DUR = 120000, t0 = Date.now(); let score = 0, streak = 0, best = 0, hits = 0, total = 0, idx = 0, locked = false, timer = null, it = null; const order = shuffle(PEN);
      box.innerHTML = `<div class="duelc"><div class="duel-hud"><span>${L("Time","Tiempo")} <b id="dt">2:00</b></span><span>${L("Goals","Goles")} <b id="ds">0</b></span><span>🔥 <b id="dk">0</b></span><button type="button" class="chip" id="dm" style="min-height:30px;padding:.1em .6em">${muted ? "🔇" : "🔊"}</button></div><div class="vis" id="dv"></div><p class="duel-q es" id="dq"></p><div class="goal" id="gl"><div class="gkeeper" id="gk">🧤</div><div class="gball" id="gb">⚽</div></div><div class="goalbtns" id="gbtn"></div><div class="fb" id="df" role="status"></div></div>`;
      const q = (s) => box.querySelector(s);
      q("#dm").onclick = (e) => { muted = !muted; if (muted) { try { speechSynthesis.cancel(); } catch (x) {} setTTS(false); } e.currentTarget.textContent = muted ? "🔇" : "🔊"; };
      const hudT = () => { const left = Math.max(0, DUR - (Date.now() - t0)); q("#dt").textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0"); q("#ds").textContent = hits; q("#dk").textContent = streak; };
      const POS = [12, 50, 88];
      function next() {
        locked = false; it = order[idx % order.length]; idx++;
        q("#dv").innerHTML = IMG(it[0], 100); q("#dq").textContent = it[1]; q("#df").textContent = "";
        q("#gb").style.left = "50%"; q("#gb").style.bottom = "-30px"; q("#gk").style.left = "50%";
        q("#gbtn").innerHTML = it[2].map((o, n) => `<button type="button" class="chip es" data-n="${n}" style="min-height:48px">${n + 1} · ${o}</button>`).join("");
        q("#gbtn").querySelectorAll("button").forEach(b => b.onclick = () => shoot(+b.dataset.n));
      }
      function shoot(n) {
        if (locked) return; locked = true; total++; const ok = n === it[3];
        const target = POS[n]; q("#gb").style.left = target + "%"; q("#gb").style.bottom = "55px";
        const dive = ok ? POS[(n + 1 + Math.floor(Math.random() * 2)) % 3] : target; q("#gk").style.left = dive + "%";
        if (ok) { hits++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; q("#df").className = "fb good"; q("#df").textContent = "¡GOL! " + it[4]; sim.recordTrial({ nivel:"Bonus", tarea:it[1], respuesta:it[2][it[3]], correcto:"Yes", intentos:1 }); burst(q("#gb")); speak(it[1].replace("___", it[2][it[3]])); }
        else { streak = 0; q("#df").className = "fb bad"; q("#df").textContent = L("Saved! Right answer: ","¡Parada! Respuesta correcta: ") + it[2][it[3]] + ". " + it[4]; }
        q("#gbtn").querySelectorAll("button").forEach((b, i) => { b.disabled = true; if (i === it[3]) b.classList.add("is-ok"); });
        hudT(); setTimeout(() => { if (Date.now() - t0 < DUR) next(); }, ok ? 1300 : 2300);
      }
      const keyH = (e) => { if (!document.body.contains(box.querySelector(".duelc"))) { document.removeEventListener("keydown", keyH); return; } if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; const n = +e.key; if (n >= 1 && n <= 3) { const b = box.querySelectorAll("#gbtn button")[n - 1]; if (b && !b.disabled) b.click(); } };
      document.addEventListener("keydown", keyH);
      timer = setInterval(() => { hudT(); if (Date.now() - t0 >= DUR) { clearInterval(timer); document.removeEventListener("keydown", keyH); end(); } }, 250);
      function end() {
        box.innerHTML = `<div class="duelc"><h3 class="pz-title">${L("¡Final del partido!","¡Final del partido!")}</h3><p>${L("Goals","Goles")} <b>${hits}</b> · ${L("Accuracy","Precisión")} <b>${total ? Math.round(hits / total * 100) : 0}%</b> · ${L("Best streak","Mejor racha")} <b>${best}</b></p><button type="button" class="btn btn--signal" id="dag">${L("Play again","Jugar otra vez")}</button> <button type="button" class="btn" id="dcl">${L("Close","Cerrar")}</button></div>`;
        box.querySelector("#dag").onclick = () => play(); box.querySelector("#dcl").onclick = () => { box.innerHTML = ""; box.dataset.on = ""; };
        sim.toast(L(`Tanda de Penaltis: ${hits} goals, ${total ? Math.round(hits / total * 100) : 0}% accuracy.`, `Tanda de Penaltis: ${hits} goles, ${total ? Math.round(hits / total * 100) : 0}% de precisión.`), "info");
      }
      next(); hudT();
    }
  }

  function paint() {
    body.innerHTML = ""; hud();
    if (S.stage >= STAGE_DEFS.length) { finale(); return; }
    const def = STAGE_DEFS[S.stage];
    globe.flyTo(STAGE_STOP[S.stage]);
    const slot = panel(def.t, def.how);
    parts(slot, "st" + S.stage, def.parts, () => {
      slot.innerHTML = `<p class="fb good">${L("¡Nivel completo!","¡Nivel completado!")}</p>`;
      nextBtn(slot, S.stage < STAGE_DEFS.length - 1 ? L("Next level →","Siguiente nivel →") : L("Finish Unit 5 →","Terminar la Unidad 5 →"), () => { S.stage++; sim.saveState(); paint(); window.scrollTo({ top: host.offsetTop - 20, behavior: reduced() ? "auto" : "smooth" }); });
    });
  }
  function finale() {
    body.innerHTML = `<div class="done-card"><h3>¡Unidad 5 completa!</h3><div class="big">${rankFor(S.xp)}</div><p>${S.xp} XP · ${L("best streak","mejor racha")} ${S.best} · ${S.firstTry} ${L("first-try answers","respuestas a la primera")}</p><p>${L("Scroll down to check your Record, answer Explain and Apply, and generate your evidence PDF.","Baja para revisar tu Registro, responder Explica y Aplica, y generar tu PDF de evidencias.")}</p></div>`;
    bonusSection();
  }






  paint();
  fetch("photos/deporte/credits.json").then(r => r.json()).then(c => {
    const d = document.createElement("details"); d.className = "credit"; d.style.marginTop = "var(--sp-4)";
    d.innerHTML = "<summary>Photo credits (Wikimedia Commons)</summary>" + Object.entries(c).map(([k, v]) => `<div>${k}: <a href="${v.page}" target="_blank" rel="noopener noreferrer">${v.file.replace("File:", "")}</a> — ${v.author || "unknown"} (${v.license})</div>`).join("");
    host.append(d);
  }).catch(() => {});
}

const simulation = { orient: drawOrient, investigate: drawInvestigate };
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
