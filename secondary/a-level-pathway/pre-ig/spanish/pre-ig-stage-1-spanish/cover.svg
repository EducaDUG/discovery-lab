<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Kiwi and Cóndor cover art: a route from Aotearoa to Spain to Argentina">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7C2"/>
      <stop offset="0.55" stop-color="#F7C79A"/>
      <stop offset="1" stop-color="#E9A277"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E63A8"/>
      <stop offset="1" stop-color="#2E4C86"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4B8F"/>
      <stop offset="1" stop-color="#173A72"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="400" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="400" height="300" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="312" cy="74" r="40" fill="#FFF3DE" opacity="0.9"/>
    <circle cx="312" cy="74" r="27" fill="#FFD79A"/>

    <!-- drifting clouds -->
    <g fill="#FFFBF3" opacity="0.7">
      <ellipse cx="70" cy="60" rx="34" ry="12"/>
      <ellipse cx="96" cy="52" rx="22" ry="10"/>
      <ellipse cx="196" cy="98" rx="26" ry="9"/>
    </g>

    <!-- flight route: dotted arc Aotearoa -> España -> Argentina -->
    <path d="M64 214 Q170 60 336 150" fill="none" stroke="#B8420E" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="1 12" opacity="0.85"/>
    <!-- route waypoints -->
    <g>
      <circle cx="64" cy="214" r="6" fill="#FFFBF3" stroke="#B8420E" stroke-width="3"/>
      <circle cx="196" cy="104" r="6" fill="#FFFBF3" stroke="#B8420E" stroke-width="3"/>
      <circle cx="336" cy="150" r="6" fill="#FFFBF3" stroke="#B8420E" stroke-width="3"/>
    </g>

    <!-- game sparkles / stars -->
    <g fill="#FFF3DE">
      <path d="M150 46 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
      <path d="M258 132 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 z"/>
    </g>
    <!-- coin -->
    <g transform="translate(112,128)">
      <circle r="12" fill="#F4B740" stroke="#C98A18" stroke-width="2"/>
      <circle r="7" fill="none" stroke="#C98A18" stroke-width="2"/>
    </g>

    <!-- hills -->
    <path d="M0 300 V235 Q90 195 190 226 T400 214 V300 Z" fill="url(#hillFar)"/>
    <path d="M0 300 V262 Q120 232 240 258 T400 250 V300 Z" fill="url(#hillNear)"/>

    <!-- kiwi (Aotearoa), lower-left on the hill -->
    <g transform="translate(58,214)">
      <ellipse cx="6" cy="14" rx="26" ry="20" fill="#7A4A2B"/>
      <ellipse cx="0" cy="12" rx="22" ry="17" fill="#8A5533"/>
      <!-- feather strokes -->
      <g stroke="#6B3F24" stroke-width="1.4" opacity="0.6" fill="none">
        <path d="M-8 4 q10 6 18 2"/>
        <path d="M-10 12 q12 6 22 2"/>
        <path d="M-8 20 q12 5 20 1"/>
      </g>
      <!-- long beak -->
      <path d="M18 6 q26 3 40 12 q-15 4 -40 0 z" fill="#4A2C18"/>
      <!-- eye -->
      <circle cx="6" cy="4" r="3.2" fill="#2A1A12"/>
      <circle cx="7" cy="3" r="1" fill="#FFFBF3"/>
      <!-- legs -->
      <g stroke="#4A2C18" stroke-width="3" stroke-linecap="round">
        <path d="M-4 30 v8"/><path d="M8 30 v8"/>
      </g>
    </g>

    <!-- cóndor (soaring, upper-right) -->
    <g transform="translate(300,120)">
      <!-- wings -->
      <path d="M0 6 C-30 -12 -60 -10 -78 6 C-58 6 -40 12 0 12 Z" fill="#241C1A"/>
      <path d="M0 6 C30 -12 60 -10 78 6 C58 6 40 12 0 12 Z" fill="#241C1A"/>
      <!-- primary feather tips -->
      <g stroke="#3A2E2A" stroke-width="1.6">
        <path d="M-78 6 l-8 -3"/><path d="M-70 9 l-8 -1"/>
        <path d="M78 6 l8 -3"/><path d="M70 9 l8 -1"/>
      </g>
      <!-- body -->
      <ellipse cx="0" cy="12" rx="10" ry="14" fill="#2E2521"/>
      <!-- white neck ruff -->
      <ellipse cx="0" cy="2" rx="8" ry="4" fill="#F2ECE2"/>
      <!-- head -->
      <circle cx="0" cy="-6" r="6" fill="#C77A4A"/>
      <!-- beak -->
      <path d="M4 -7 l8 2 -7 3 z" fill="#3A2A1E"/>
      <circle cx="1.5" cy="-7" r="1.4" fill="#1A120E"/>
    </g>
  </g>
</svg>
