<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chemistry bench with a beaker, a filtration funnel and a magnet separating iron from sand">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2224"/>
      <stop offset="1" stop-color="#123338"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7be6ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#1c6470" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- beaker (left) -->
  <path d="M60 90 h60 v10 l14 90 a10 10 0 0 1 -10 12 h-68 a10 10 0 0 1 -10 -12 Z" fill="#0a1f22" stroke="#4FB8C6" stroke-width="3"/>
  <path d="M55 150 l10 42 a10 10 0 0 0 10 8 h48 a10 10 0 0 0 10 -8 l10 -42 Z" fill="url(#water)"/>
  <circle cx="90" cy="170" r="4" fill="#fff" opacity=".8"/>
  <circle cx="105" cy="185" r="3" fill="#fff" opacity=".6"/>

  <!-- filtration funnel (middle) -->
  <g transform="translate(185,70)">
    <path d="M0 0 L60 0 L34 46 L34 70 L26 70 L26 46 Z" fill="none" stroke="#F0B34C" stroke-width="4" stroke-linejoin="round"/>
    <path d="M6 6 L54 6 L34 40 L26 40 Z" fill="#F0B34C" opacity=".35"/>
    <rect x="14" y="76" width="32" height="46" rx="4" fill="none" stroke="#eafcff" stroke-width="3"/>
    <ellipse cx="30" cy="112" rx="12" ry="6" fill="#eafcff" opacity=".5"/>
  </g>

  <!-- magnet with iron filings (right) -->
  <g transform="translate(300,95)">
    <path d="M-24 0 v-24 a24 24 0 0 1 48 0 v24" fill="none" stroke="#C0392B" stroke-width="9" stroke-linecap="round"/>
    <rect x="-32" y="-4" width="16" height="14" fill="#eafcff"/>
    <rect x="16" y="-4" width="16" height="14" fill="#eafcff"/>
    <g fill="#c8c8c8">
      <rect x="-6" y="30" width="3" height="14" transform="rotate(8 -6 30)"/>
      <rect x="0" y="34" width="3" height="12" transform="rotate(-10 0 34)"/>
      <rect x="6" y="28" width="3" height="16" transform="rotate(4 6 28)"/>
    </g>
  </g>

  <!-- separation arrows -->
  <path d="M130 175 h35" stroke="#eafcff" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity=".7"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#eafcff"/>
    </marker>
  </defs>

  <text x="200" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#e9fbff" font-weight="700">Separation Station</text>
</svg>
