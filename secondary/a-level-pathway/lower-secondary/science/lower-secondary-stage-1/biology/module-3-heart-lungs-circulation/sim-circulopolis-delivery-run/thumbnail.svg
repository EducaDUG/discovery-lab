<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1e4030"/>
      <stop offset="100%" stop-color="#0d1f16"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- road -->
  <rect x="60" y="0" width="280" height="300" fill="#173226"/>
  <g stroke="#e9f5ee" stroke-width="4" stroke-dasharray="18 16" opacity="0.35">
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
  </g>

  <!-- pump station glow -->
  <circle cx="200" cy="230" r="46" fill="#9a6e05" opacity="0.25"/>
  <circle cx="200" cy="230" r="30" fill="#b5551f"/>
  <path d="M200 216 C188 204 168 210 168 226 C168 240 188 252 200 260 C212 252 232 240 232 226 C232 210 212 204 200 216 Z" fill="#f2c07a"/>

  <!-- houses -->
  <g fill="#4cc08c">
    <rect x="80" y="60" width="34" height="30" rx="4"/>
    <polygon points="76,60 97,42 118,60"/>
    <rect x="286" y="46" width="34" height="30" rx="4"/>
    <polygon points="282,46 303,28 324,46"/>
    <rect x="88" y="140" width="30" height="26" rx="4"/>
    <polygon points="84,140 103,124 122,140"/>
  </g>

  <!-- delivery truck -->
  <g>
    <rect x="178" y="140" width="44" height="52" rx="8" fill="#e8c55c"/>
    <rect x="186" y="150" width="28" height="16" rx="3" fill="#173226"/>
    <circle cx="190" cy="196" r="7" fill="#10201a"/>
    <circle cx="210" cy="196" r="7" fill="#10201a"/>
  </g>

  <!-- speed lines -->
  <g stroke="#f8fbf7" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <line x1="150" y1="120" x2="150" y2="100"/>
    <line x1="250" y1="120" x2="250" y2="96"/>
    <line x1="200" y1="100" x2="200" y2="80"/>
  </g>
</svg>
