<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Breathing lungs animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2e24"/><stop offset="100%" stop-color="#071a14"/>
    </linearGradient>
    <linearGradient id="lung" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9db0"/><stop offset="100%" stop-color="#d4596e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e8c60" stop-opacity=".5"/><stop offset="100%" stop-color="#1e8c60" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <ellipse cx="160" cy="95" rx="120" ry="90" fill="url(#glow)"/>
  <!-- floating O2 dust -->
  <g fill="#7fe3ff" opacity=".65">
    <circle cx="48" cy="40" r="3"><animate attributeName="cy" values="40;160;40" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="278" cy="150" r="2.4"><animate attributeName="cy" values="150;30;150" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="170" r="2" opacity=".5"><animate attributeName="cy" values="170;60;170" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="30" r="2.6" opacity=".5"><animate attributeName="cy" values="30;150;30" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- trachea -->
  <path d="M160,22 L160,70" stroke="#8fb0c8" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M160,66 L132,86 M160,66 L188,86" stroke="#8fb0c8" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- lungs (breathing) -->
  <g>
    <path d="M140,80 C104,84 86,120 86,150 C86,180 106,190 128,184 C142,180 144,156 144,132 L144,84 Z" fill="url(#lung)">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.84;1.05 1.08;1 0.84" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </path>
    <path d="M180,80 C216,84 234,120 234,150 C234,180 214,190 192,184 C178,180 176,156 176,132 L176,84 Z" fill="url(#lung)">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1 0.84;1.05 1.08;1 0.84" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </path>
  </g>
  <!-- diaphragm -->
  <path d="M86,182 Q160,206 234,182" stroke="#2f9f74" stroke-width="7" fill="none" stroke-linecap="round">
    <animate attributeName="d" values="M86,182 Q160,206 234,182;M86,188 Q160,218 234,188;M86,182 Q160,206 234,182" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
  </path>
  <text x="160" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#eafaff" opacity=".9">Lung Command</text>
</svg>
