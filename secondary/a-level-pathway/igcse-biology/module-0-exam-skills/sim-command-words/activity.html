<style>
.cw{--bg:#0f172a;--panel:#020617;--line:#1e293b;--line2:#334155;--ink:#f1f5f9;--ink2:#cbd5e1;--ink3:#94a3b8;
  --em:#34d399;--em-d:#059669;--am:#fbbf24;--ind:#818cf8;--ro:#fb7185;--bl:#60a5fa;
  max-width:44rem;margin:var(--sp-4) auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:1rem;padding:clamp(1rem,3vw,2rem);box-shadow:0 20px 50px rgba(2,6,23,.45);font-size:.95rem;line-height:1.5;}
.cw *{box-sizing:border-box;}
.cw h1,.cw h2,.cw h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em;color:var(--ink);}
.cw .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.cw .muted{color:var(--ink3);}
.cw .center{text-align:center;}
.cw .stack>*+*{margin-top:1.1rem;}
.cw button{font:inherit;cursor:pointer;touch-action:manipulation;}
.cw button:focus-visible{outline:3px solid var(--am);outline-offset:2px;}
.cw-fade{animation:cwfade .35s ease both;}
@keyframes cwfade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
[data-reduced-motion=on] .cw-fade{animation:none;}

.cw-tabs{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.cw-tab{padding:.45rem .9rem;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font-weight:600;font-size:.8rem;}
.cw-tab[aria-selected=true]{background:var(--em-d);border-color:var(--em);color:#fff;}

.cw-hero{text-align:center;padding:.5rem 0 0;}
.cw-hero__icon{display:inline-grid;place-items:center;width:4rem;height:4rem;border-radius:1rem;background:var(--panel);border:1px solid var(--line);color:var(--am);}
.cw-hero h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;margin-top:.7rem;}
.cw-hero h1 span{background:linear-gradient(90deg,var(--em),var(--bl));-webkit-background-clip:text;background-clip:text;color:transparent;}
.cw-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:1.2rem 0;}
.cw-stat{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.7rem;text-align:center;}
.cw-stat small{display:block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);}
.cw-stat b{display:block;font-size:1.3rem;margin-top:.15rem;}
.cw-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.3rem;border-radius:.6rem;border:1px solid var(--line2);background:#1e293b;color:var(--ink);font-weight:600;}
.cw-btn:hover{background:#334155;}
.cw-btn--go{background:var(--em-d);border-color:var(--em);color:#fff;font-weight:700;}
.cw-btn--go:hover{background:#10b981;}
.cw-row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;}

.cw-chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;}
.cw-chip{padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font-size:.75rem;font-weight:600;}
.cw-chip[aria-pressed=true]{background:var(--ind);border-color:var(--ind);color:#0f172a;}
.cw-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.7rem;}
.cw-card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.8rem;color:var(--ink);transition:transform .15s,border-color .15s;}
.cw-card:hover{transform:translateY(-2px);border-color:var(--em);}
.cw-card[aria-expanded=true]{grid-column:1/-1;border-color:var(--em);background:#04130f;}
.cw-card__w{font-weight:800;font-size:1.05rem;}
.cw-card__lvl{font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-top:.15rem;}
.cw-card__body{margin-top:.6rem;color:var(--ink2);font-size:.88rem;}
.cw-card__body p{margin:.35rem 0 0;}
.cw-card__body .trap{color:var(--am);}
.lvl-recall{color:var(--bl);}.lvl-explain{color:var(--em);}.lvl-analyse{color:var(--ind);}.lvl-evaluate{color:var(--ro);}.lvl-practical{color:var(--am);}

.cw-hud{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap;position:relative;}
.cw-bar{flex:1;min-width:8rem;height:9px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);overflow:hidden;}
.cw-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--em),#a3e635);transition:width .4s;}
.cw-pill{font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:var(--panel);border:1px solid var(--line2);}
.cw-pill.hot{color:var(--am);border-color:var(--am);}
.cw-q__tag{display:inline-block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;padding:.2rem .6rem;border-radius:.4rem;background:var(--panel);border:1px solid var(--line2);}
.cw-q__text{font-size:1.1rem;font-weight:600;margin:.7rem 0 1rem;}
.cw-q__ctx{margin:0 0 1rem;padding:.7rem .9rem;background:var(--panel);border-left:3px solid var(--ind);border-radius:.4rem;color:var(--ink2);font-size:.88rem;}
.cw-opts{display:grid;gap:.55rem;}
.cw-opt{display:flex;gap:.7rem;text-align:left;padding:.75rem .9rem;border-radius:.65rem;border:1px solid var(--line2);background:var(--panel);color:var(--ink);transition:border-color .15s,background .15s,transform .15s;}
.cw-opt:hover:not([disabled]){border-color:var(--ind);transform:translateX(3px);}
.cw-opt__k{flex:none;width:1.5rem;height:1.5rem;border-radius:.35rem;display:grid;place-items:center;background:#1e293b;font-weight:800;font-size:.75rem;}
.cw-opt.is-right{border-color:var(--em);background:#052e22;}
.cw-opt.is-wrong{border-color:var(--ro);background:#3b0a16;animation:cwshake .35s;}
.cw-opt[disabled]{cursor:default;}
@keyframes cwshake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
[data-reduced-motion=on] .cw-opt.is-wrong{animation:none;}
.cw-fb{margin-top:1rem;padding:.9rem 1rem;border-radius:.65rem;border:1px solid var(--line2);background:var(--panel);}
.cw-fb.ok{border-color:var(--em);}.cw-fb.no{border-color:var(--ro);}
.cw-fb b.h{display:block;margin-bottom:.25rem;}
.cw-fb.ok b.h{color:var(--em);}.cw-fb.no b.h{color:var(--ro);}
.cw-fb .tip{margin-top:.4rem;color:var(--am);font-size:.85rem;}
.cw-xp{position:absolute;pointer-events:none;font-weight:800;color:var(--am);animation:cwup 1s ease forwards;}
@keyframes cwup{to{transform:translateY(-2.2rem);opacity:0;}}
[data-reduced-motion=on] .cw-xp{animation:none;opacity:0;}

.cw-trophy{display:inline-flex;padding:.75rem;border-radius:1rem;background:var(--panel);border:1px solid var(--line);color:var(--am);}
.cw-grade{display:inline-block;border:1px solid;padding:.6rem 1.3rem;border-radius:.75rem;text-align:center;}
.cw-grade small{display:block;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);}
.cw-grade b{font-size:2rem;font-weight:800;}
.g-hi{color:#34d399;border-color:#10b98166;background:#022c2266;}.g-bl{color:#60a5fa;border-color:#3b82f666;background:#17255466;}
.g-am{color:#fbbf24;border-color:#f59e0b66;background:#45260966;}.g-ro{color:#fb7185;border-color:#f43f5e66;background:#4c051966;}
.cw-check{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.9rem 1rem;font-size:.85rem;}
.cw-check h3{font-size:.85rem;color:var(--em);margin-bottom:.5rem;}
.cw-check li{display:flex;gap:.5rem;margin:.4rem 0;color:var(--ink2);list-style:none;}
.cw-check ul{margin:0;padding:0;}
.cw-review{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.9rem 1rem;font-size:.85rem;}
.cw-review summary{cursor:pointer;font-weight:700;color:var(--ind);}
.cw-review li{margin:.45rem 0;color:var(--ink2);}
.cw-name{width:100%;max-width:18rem;padding:.6rem .8rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:inherit;}
.cw-confetti{position:fixed;top:0;width:8px;height:12px;z-index:50;pointer-events:none;animation:cwfall 1.6s ease-in forwards;}
@keyframes cwfall{to{transform:translateY(70vh) rotate(540deg);opacity:.2;}}
@media(max-width:30rem){.cw-stats{gap:.4rem;}}
</style>

<script type="module">
import "../../../../../engine/i18n.js?v=9";
import "../../../../../engine/accessibility.js?v=9";

const ACTIVITY_ID = "ALEV-IGCSEBIO-M00-SIM01", VERSION = "1.0";
const $ = (s, r = document) => r.querySelector(s);
const root = $("#cw");
const reduced = () => { const a = document.documentElement.getAttribute("data-reduced-motion");
  return a === "on" || (a !== "off" && matchMedia("(prefers-reduced-motion: reduce)").matches); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const ICON = {
  trophy: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  book: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/></svg>',
  redo: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>',
  award: (c = "currentColor", s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg>`,
  bolt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 3 14h8l-1 8 10-12h-8z"/></svg>',
  dl: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>'
};

/* ---------- Command word codex (Edexcel IGCSE-style taxonomy) ---------- */
const LV = { recall: "Recall", explain: "Explain", analyse: "Analyse", evaluate: "Evaluate", practical: "Practical" };
const CODEX = [
  ["State", "recall", "Give a short, factual answer. No reasons needed.", "State one function of the stomata.  ->  gas exchange", "Writing a paragraph. One precise point earns the mark; extra explanation earns nothing more."],
  ["Name", "recall", "Give the correct word or term for something.", "Name the organelle where respiration releases energy.  ->  mitochondrion", "Describing it instead of naming it."],
  ["Identify", "recall", "Pick out or recognise something from a diagram, list, graph or data.", "Identify structure X.  ->  the xylem", "Naming a different labelled structure because the label line is ambiguous - follow the line to its end."],
  ["Define", "recall", "Give the exact scientific meaning of a term.", "Define diffusion.  ->  net movement of particles from high to low concentration, down a concentration gradient", "Missing a key idea, e.g. 'net' or 'down a gradient', or using the word in its own definition."],
  ["Label / Add", "recall", "Put the correct name on a diagram, or add the missing items.", "Label the left ventricle on the heart diagram.", "Label lines that stop short of the structure or point to the wrong part."],
  ["Complete", "recall", "Fill in the missing information in a table, sentence or diagram.", "Complete the table to show the products of respiration.", "Leaving blanks - never leave a blank, a guess costs nothing."],
  ["Describe", "explain", "Say what happens or what something is like: features, pattern, trend. NO reasons.", "Describe the trend in Fig. 1.  ->  rate rises from 0 to 40 au, then levels off", "Giving the biological reason. That is 'Explain' and earns nothing here. Quote values from the graph."],
  ["Explain", "explain", "Give reasons: a cause, a mechanism and a link to the situation. Use 'because' or 'so'.", "Explain why the rate levels off.  ->  another factor is now limiting, so more light makes no difference", "Only stating what happens without the 'because'."],
  ["Give a reason", "explain", "Give one cause for something in the question.", "Give a reason why the plant wilted.", "Restating the observation instead of a cause."],
  ["Compare", "analyse", "Identify similarities and/or differences, with both items in the same sentence.", "Compare arteries and veins.  ->  arteries have thick walls whereas veins have thin walls", "Writing two separate descriptions, one for each item, with no linking word like 'whereas'."],
  ["Calculate", "analyse", "Work out a number from data. Show your working, include the unit.", "Calculate the percentage change in mass.  ->  (23-20)/20 x 100 = 15%", "No working shown (lose method marks) or no unit."],
  ["Estimate", "analyse", "Give an approximate value using data or known information.", "Estimate the rate at 25 C from the graph.", "Giving an exact-looking answer with no sign of how it was read from the data."],
  ["Determine", "analyse", "Use given data or a graph to find a value or answer.", "Determine the temperature at which the rate is greatest.", "Not stating the unit or reading off the wrong axis."],
  ["Predict", "analyse", "Say what you think will happen, using the information or pattern given.", "Predict the rate at 50 au.", "A guess with no link to the trend shown."],
  ["Suggest", "analyse", "Apply your knowledge to an unfamiliar situation. There may be several acceptable answers.", "Suggest why fish died after fertiliser ran into a lake.", "Saying 'I do not know this' - use the biology you DO know and apply it."],
  ["Show that", "analyse", "Prove a given answer is correct using working. The answer is given, so the working earns the marks.", "Show that the magnification is x40.", "Giving just the answer. You must show the method."],
  ["Discuss", "evaluate", "Set out the key points on different sides or aspects of an issue.", "Discuss the use of pesticides on crops.", "Giving only one side."],
  ["Justify", "evaluate", "Support a conclusion or decision with evidence and reasoning.", "Justify the choice of fertiliser.", "Stating the choice with no supporting evidence."],
  ["Evaluate", "evaluate", "Weigh evidence for and against, then reach a judgement.", "Evaluate whether fertiliser X is better.", "Forgetting the final judgement."],
  ["Design / Plan", "practical", "Write a method others could follow: what you change, measure and keep the same.", "Plan an investigation into light and plant growth.", "Skipping control variables, repeats, apparatus, or what you will measure."],
  ["Plot / Draw / Sketch", "practical", "Plot: points accurately. Draw: careful and to scale. Sketch: rough shape, key features.", "Plot a graph of the results.", "Missing axis labels and units, or joining points with straight lines when a smooth curve is expected."]
];

/* ---------- Question bank ---------- */
const FIG = "Fig. 1: rate of photosynthesis is 0 at 0 au light, rises steadily to 40 au, then stays constant up to 100 au.";
const Q = (cw, q, opts, a, tip, ctx) => ({ cw, q, opts, a, tip, ctx });
const BANK = [
  Q("State", "A question says 'State one function of the stomata' (1 mark). Which answer is best?", ["Gas exchange", "Stomata open and close using guard cells, letting CO2 diffuse in for photosynthesis and water vapour out", "Stomata are found on leaves", "They are very small pores"], 0, "'State' wants one short, precise point. Extra detail earns no extra marks and can contradict yourself."),
  Q("Define", "Which is the best answer to 'Define osmosis' (2 marks)?", ["Water moving from a high to a low concentration", "The net movement of water molecules from a dilute solution to a concentrated solution through a partially permeable membrane", "The movement of particles", "Water moving into cells so they swell"], 1, "A definition needs every key idea: net movement, water, dilute to concentrated (high to low water potential), partially permeable membrane."),
  Q("Describe", "'Describe the trend in Fig. 1.' Which answer earns the marks?", ["Rate rises from 0 to 40 au, then stays constant", "Because chlorophyll absorbs light so the rate rises", "Light intensity is a limiting factor so the rate levels off", "Photosynthesis takes place in the chloroplasts"], 0, "'Describe' = what the data shows, quoting values. Options B and C are explanations: they earn nothing on a Describe question.", FIG),
  Q("Explain", "'Explain why the rate stays constant above 40 au.' Which answer earns the marks?", ["The rate stays constant from 40 to 100 au", "Another factor, such as carbon dioxide or temperature, is now limiting, so more light does not increase the rate", "Plants need light", "It is the maximum on the graph"], 1, "'Explain' = cause + mechanism. Name the limiting factor and link it to the flat line using 'so' or 'because'.", FIG),
  Q("Compare", "Which sentence correctly answers 'Compare arteries and veins' (1 mark)?", ["Arteries have thick walls and veins have valves", "Arteries have thick muscular walls whereas veins have thin walls", "Arteries carry blood away from the heart", "Veins have a large lumen"], 1, "Compare needs BOTH items in one sentence on the SAME feature, joined with 'whereas', 'but' or 'than'."),
  Q("Calculate", "A seedling's mass rises from 20 g to 23 g. Calculate the percentage increase.", ["13%", "15%", "3%", "0.15%"], 1, "Percentage change = (change / original) x 100 = (3 / 20) x 100 = 15%. Always divide by the ORIGINAL value, and show working."),
  Q("Suggest", "Fish die after fertiliser runs into a lake. The question says 'Suggest why'. Which answer earns the mark?", ["The fish died", "Eutrophication: algae grow fast then die, bacteria decompose them and use up the oxygen, so fish suffocate", "The definition of eutrophication is excess nutrients", "Fertiliser is a chemical"], 1, "'Suggest' means apply what you know to a new context. Link known biology (decomposers, oxygen) to the situation given."),
  Q("Evaluate", "'Evaluate whether organic or inorganic fertiliser is better for a farmer' (4 marks). Which answer style earns full marks?", ["A list of facts about inorganic fertiliser only", "Benefits and drawbacks of BOTH, finishing with a judgement using evidence", "A definition of each fertiliser", "'I think inorganic because it is best'"], 1, "'Evaluate' always ends with a judgement backed by the evidence you weighed. No judgement, no top marks."),
  Q("Discuss", "What must a 'Discuss' answer contain?", ["One detailed explanation", "Points from different sides of the issue", "A single-word answer", "A calculation"], 1, "'Discuss' = balanced points on different aspects or sides. You may also reach a conclusion, but breadth comes first."),
  Q("Justify", "You chose to use a greenhouse. What does 'Justify your choice' require?", ["Restating your choice", "Giving evidence or reasoning that supports the choice", "Listing other choices", "Describing the greenhouse"], 1, "'Justify' = 'because the evidence shows...'. Always attach reasoning to the decision."),
  Q("Predict", "Rate increases by 10 units every 10 C from 10 C to 40 C. 'Predict the rate at 30 C' - which answer shows the skill?", ["It will be fast", "30 units, following the pattern of 10 units per 10 C", "Enzymes work faster when warm", "I cannot predict this"], 1, "'Predict' = use the pattern in the data to give a value or outcome, not a vague guess."),
  Q("Describe", "'Describe how to test a leaf for starch' (3 marks). What makes a strong answer?", ["A reason for each step", "Ordered steps: boil the leaf, soften in hot ethanol, rinse, add iodine, blue-black means starch", "Only the final colour", "A definition of starch"], 1, "Describing a method = the ordered actions and the result. You do not need to explain why each step works unless the question says so."),
  Q("Explain", "An 'Explain' question is worth 3 marks. What should your answer usually contain?", ["Three unconnected facts", "Three linked points, each leading to the next with 'because' or 'so'", "A long introduction", "One point repeated three ways"], 1, "Explain marks are usually a chain: cause -> mechanism -> effect. Write it as a linked sentence, not a list."),
  Q("Design", "Which is the most important thing to include in a plan that investigates how light intensity affects plant growth?", ["A fact about chlorophyll", "What you will change, what you will measure, and what you will keep the same", "A conclusion you expect", "A drawing of the plant"], 1, "A plan needs the independent variable, dependent variable, control variables, equipment and repeats. Build that checklist into every plan you write."),
  Q("Design", "In a 6-mark 'Plan an investigation' answer, what should come BEFORE writing the steps?", ["The conclusion", "Identify the independent and dependent variables", "The risk assessment only", "The graph"], 1, "Decide what you change and what you measure first, then the steps flow naturally from that."),
  Q("Design", "A plan changes the light, the temperature and the amount of water all at once. What is wrong?", ["Nothing", "It is not a fair test, since more than one variable changes", "It uses too little equipment", "It has too many repeats"], 1, "Fair test = change ONE variable, control the rest. Otherwise you cannot tell which variable caused the result."),
  Q("Design", "Why should you repeat an investigation and calculate a mean?", ["To make it look longer", "To spot anomalies and make the result more reliable", "To change the independent variable", "Because the examiner expects three trials"], 1, "Repeats improve reliability; a mean reduces the effect of random error. Say WHY, not just 'for accuracy'."),

    para(`Integrity code ${sum} (tamper-evident only: it changes if the scores above are edited, but it does not prevent editing).`, { size: 8, color: [100, 116, 139] });
    const n = doc.internal.getNumberOfPages();
    for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(100, 116, 139);
      doc.text(`Discovery Lab Report - ${name} - ${dateStr}`, M, H - 24); doc.text(`Page ${p} of ${n}`, W - M, H - 24, { align: "right" }); }
    const file = `${name.replace(/[^A-Za-z0-9]+/g, "")}_IGCSEBiology_ExamSkills_CommandWords_${dateStr}.pdf`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(doc.output("blob")); a.download = file;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    msg.textContent = "Downloaded " + file + ". Upload this PDF to Learning Lab.";
  } catch (e) { console.error(e); msg.textContent = "Sorry, the PDF could not be built. Please try again."; }
}

render();
