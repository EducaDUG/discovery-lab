.cw-bot{margin-top:.7rem;padding:.6rem .8rem;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;font-size:.78rem;color:var(--ink3);font-style:italic;display:flex;justify-content:space-between;gap:.6rem;}

/* codex */
.cw-search{width:100%;padding:.6rem .9rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:inherit;font-size:.85rem;}

.cw-col.d{border-color:#34d39955;}.cw-col.e{border-color:#818cf855;}

.cw-letters{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.7rem;}
.cw-letter{padding:.4rem .8rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font-family:ui-monospace,Consolas,monospace;font-weight:800;}

.cw-badge{display:inline-grid;place-items:center;min-width:2rem;height:2rem;padding:0 .4rem;border-radius:.5rem;background:#05966944;border:1px solid #34d39988;color:var(--em);font-weight:800;font-family:ui-monospace,Consolas,monospace;}

.cw-trophy{display:inline-flex;padding:.75rem;border-radius:1rem;background:var(--panel);border:1px solid var(--line);color:var(--am);}
.cw-grade{display:inline-block;border:1px solid;padding:.6rem 1.3rem;border-radius:.75rem;text-align:center;}
.cw-grade small{display:block;font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);}

.g-hi{color:#34d399;border-color:#10b98166;background:#022c2266;}.g-bl{color:#60a5fa;border-color:#3b82f666;background:#17255466;}

.cw-check{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.9rem 1rem;font-size:.85rem;}

.cw-name{width:100%;max-width:18rem;padding:.6rem .8rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:inherit;}
.cw-confetti{position:fixed;top:25vh;width:8px;height:12px;z-index:50;pointer-events:none;animation:cwfall 1.6s ease-in forwards;}

<script type="module">

const $ = (s, r = document) => r.querySelector(s);

const reduced = () => { const a = document.documentElement.getAttribute("data-reduced-motion");

/* ================= sound (Web Audio, no files; always mutable) ================= */
const sounds = (() => {
  let ctx = null, on = store.get("dl-cw-sound", "on") !== "off";

function w2d(cw, para) {
  const target = para && cw.paraphrasedDefinitions.length ? pick(cw.paraphrasedDefinitions) : cw.officialDefinition;
  const d = shuffle(COMMAND_WORDS.filter(w => w.id !== cw.id)).slice(0, 3).map(o => para && o.paraphrasedDefinitions.length ? pick(o.paraphrasedDefinitions) : o.officialDefinition);
  return { type: "word-to-def", prompt: `What is the exact requirement of the command word: "${cw.word}"?`,
    sub: `Pearson Edexcel Biology (4BI1) Taxonomy · ${cw.category.toUpperCase()} · ${cw.typicalMarks}`, badge: "Word → Definition",
    options: shuffle([target, ...d]), correct: target, explanation: `Official Edexcel Taxonomy: "${cw.officialDefinition}"`,
    rule: cw.examinerRule, trap: cw.commonTrap, word: cw.word, hint: cw.examinerRule };
}
function d2w(cw, para) {
  const def = para && cw.paraphrasedDefinitions.length ? pick(cw.paraphrasedDefinitions) : cw.officialDefinition;
  let rivals = COMMAND_WORDS.filter(w => w.id !== cw.id);
  const pairs = { Describe: ["Explain", "Discuss", "Justify", "Suggest"], Explain: ["Describe", "Suggest", "Give a reason / reasons", "Deduce"],
    Plot: ["Sketch", "Draw", "Calculate", "Determine"], Calculate: ["Determine", "Estimate", "Show that", "Deduce"], Evaluate: ["Comment on", "Discuss", "Deduce", "Justify"] };
  for (const k in pairs) if (cw.word.includes(k)) { rivals = COMMAND_WORDS.filter(w => pairs[k].includes(w.word)); break; }
  const opts = shuffle([cw.word, ...shuffle(rivals).slice(0, 3).map(r => r.word)]);
  return { type: "def-to-word", prompt: "Which Edexcel command word matches this requirement?", sub: `"${def}"`, badge: "Definition → Word",
    options: opts, correct: cw.word, explanation: `This requirement describes "${cw.word}". Official Edexcel definition: "${cw.officialDefinition}"`,
    rule: cw.examinerRule, trap: cw.commonTrap, word: cw.word, hint: cw.examinerRule };
}
function pp(q) {
  return { type: "past-paper", prompt: q.questionScenario, sub: `${q.paper} · Topic: ${q.topic} · [${q.marks} Marks]`, badge: "Real Exam Scenario",
    options: shuffle([q.targetCommandWord, ...q.distractorCommandWords]), correct: q.targetCommandWord, explanation: q.examinerExplanation,
    rule: `Syllabus Ref ${q.syllabusRef}: Full mark response requires mastering this command verb.`, trap: q.distinctionTip, markScheme: q.markSchemePoints,
    word: q.targetCommandWord, hint: q.distinctionTip };
}
function picks(p) {
  return { type: "answer-pick", prompt: p.q, sub: p.ctx || "", badge: `Which answer earns the marks? · ${p.cw}`, options: shuffle(p.opts), correct: p.opts[p.a],
    explanation: `Best answer: ${p.opts[p.a]}`, rule: p.tip, trap: "", word: p.cw, hint: p.tip };
}
function pool(mode, n) {
  const cws = shuffle(COMMAND_WORDS), pps = shuffle(PAST_PAPER_QUESTIONS), aps = shuffle(PICKS), out = [];
  for (let i = 0; i < n; i++) {
    if (mode === "word-to-def") out.push(w2d(cws[i % cws.length], i % 2 === 1));
    else if (mode === "def-to-word") out.push(d2w(cws[i % cws.length], i % 2 === 1));
    else if (mode === "past-paper") out.push(pp(pps[i % pps.length]));
    else if (mode === "answer-pick") out.push(picks(aps[i % aps.length]));
    else { const m = i % 3; out.push(m === 0 ? w2d(cws[i % cws.length], Math.random() > .5) : m === 1 ? d2w(cws[(i + 3) % cws.length], Math.random() > .5) : pp(pps[i % pps.length])); }
  }
  return shuffle(out);
}

function startDuel(type) {
  clearTimers();
  S.duel = { type, qs: pool("all", 6), r: 0, p1: 0, p2: 0, a1: null, a2: null, roundOver: false, thinking: false, say: "Dr. Thorne is reviewing Question 1...", over: false };

}
function botTurn() {
  const D = S.duel; if (!D || D.type !== "bot" || D.roundOver || D.over) return;
  D.thinking = true; render();
  S.timers.push(setTimeout(() => {
    const q = D.qs[D.r], good = Math.random() < .82;
    D.a2 = good ? q.correct : pick(q.options.filter(o => o !== q.correct)); D.thinking = false;
    if (good) { D.p2 += 100; D.say = D.a2.includes("Explain") ? 'Dr. Thorne: "Naturally. A clear causal biological mechanism with \'because\'."' : 'Dr. Thorne: "Correct taxonomy, as mandated in Appendix 5."'; }
    else D.say = 'Dr. Thorne: "Confound it! Even senior examiners occasionally misread a stimulus..."';
    if (D.a1) D.roundOver = true; if (S.tab === "duel") render();
  }, 2500 + Math.random() * 2000));
}
function duelP1(o) {
  const D = S.duel, q = D.qs[D.r]; if (D.a1) return; D.a1 = o;
  if (o === q.correct) { sounds.correct(0); D.p1 += 120; } else sounds.wrong();
  if (D.type === "bot" && D.a2) D.roundOver = true; render();
}
function duelP2(o) {
  const D = S.duel, q = D.qs[D.r]; if (D.a2) return; D.a2 = o;
  if (o === q.correct) { sounds.correct(0); D.p2 += 120; } else sounds.wrong();
  D.roundOver = true; render();
}
function duelNext() {
  const D = S.duel;
  if (D.r + 1 < D.qs.length) { D.r++; D.a1 = null; D.a2 = null; D.roundOver = false; D.say = "Dr. Thorne is scrutinizing the next question..."; render(); botTurn(); return; }
  D.over = true; S.xp += D.p1; if (D.p1 >= D.p2) { S.streak += 2; S.best = Math.max(S.best, S.streak); sounds.victory(); confetti(60); } saveStats(); render();
}

  try {
    const jsPDF = await loadJsPDF(), doc = new jsPDF({ unit: "pt", format: "letter" });
    const W = 612, H = 792, M = 46, CW = W - 2 * M, name = ascii($("#cw-name").value.trim()) || "Student", total = d.qs.length;
    const pct = Math.round(d.score / total * 100), grade = gradeFor(pct)[1], dateStr = new Date().toISOString().slice(0, 10), url = location.origin + location.pathname;
    const sum = checksum(d.answers.map(a => a.ok ? 1 : 0).join("") + d.score + d.xp + name + dateStr + d.mode);
    let y = 0;
    const wrap = (t, w, size, style) => { doc.setFont("helvetica", style || "normal"); doc.setFontSize(size); return doc.splitTextToSize(ascii(t), w); };
    const need = h => { if (y + h > H - 50) { doc.addPage(); y = M; } };
    const para = (t, o = {}) => { const size = o.size || 9.5, lines = wrap(t, o.w || CW, size, o.style), lh = size * 1.3;
      need(lh * lines.length); doc.setTextColor(...(o.color || [30, 41, 59])); doc.text(lines, o.x || M, y + size); y += lh * lines.length + (o.gap ?? 4); };
    doc.setFillColor(15, 23, 42); doc.rect(0, 0, W, 78, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(255, 255, 255); doc.text("DISCOVERY LAB REPORT - LEARNING EVIDENCE", M, 34);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(167, 243, 208); doc.text("Command Words Exam Drill  |  IGCSE Biology (Edexcel 4BI1)", M, 54);
    doc.setTextColor(147, 197, 253); doc.textWithLink("Open the live activity ->", M, 69, { url });
    y = 98;
    [["Student", name], ["Course", "IGCSE Biology - A-Level Pathway (British System)"], ["Module", "Exam Skills"], ["Activity", `Command Words Exam Drill (${ACTIVITY_ID} v${VERSION})`],
     ["Drill mode", MODE_NAME[d.mode] + (S.cfg.timed ? ` (timed, ${S.cfg.limit}s per question)` : " (relaxed pace)")], ["Completed", dateStr]].forEach(([k, v]) => {
      doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(71, 85, 105); doc.text(k, M, y + 9);
      doc.setFont("helvetica", "normal"); doc.setTextColor(15, 23, 42); doc.text(wrap(v, CW - 80, 9.5), M + 80, y + 9); y += 15; });
    y += 6;
    para("Objective", { style: "bold", size: 11, color: [5, 150, 105], gap: 2 });
    para("Interpret Edexcel command words correctly (State, Describe, Explain, Compare, Calculate, Suggest, Evaluate, Design and more) so that an answer matches exactly what the question asks for. This skill applies to every IGCSE Biology paper: it protects marks the student already knows how to earn.");
    para("Method", { style: "bold", size: 11, color: [5, 150, 105], gap: 2 });
    para(`The student completed a ${total}-question auto-marked drill (${MODE_NAME[d.mode]}) drawn from the Edexcel (4BI1) command word taxonomy, paraphrased definitions, past-paper style scenarios and answer-quality questions. Each question is objectively marked (1 mark each); lifelines (50/50, hint) were available once each per round. No teacher marking or constructed-response rubric applies to this activity.`);
    para("Results", { style: "bold", size: 11, color: [5, 150, 105], gap: 4 });
    need(62); doc.setFillColor(241, 245, 249); doc.roundedRect(M, y, CW, 50, 6, 6, "F");
    [["Score", `${d.score} / ${total} (${pct}%)`], ["Indicative grade", "Grade " + grade], ["XP this round", String(d.xp)], ["Best streak", String(d.best)]].forEach(([k, v], i) => {
      const x = M + 14 + i * (CW / 4); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(100, 116, 139); doc.text(k.toUpperCase(), x, y + 18);
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(15, 23, 42); doc.text(v, x, y + 38); });
    y += 62;
    para("The grade shown is an indicative estimate from drill accuracy only. It is not an official or predicted exam grade.", { size: 8.5, color: [100, 116, 139], gap: 10 });
    para("Auto-marked questions (1 mark each)", { style: "bold", size: 11, color: [5, 150, 105], gap: 4 });
    d.answers.forEach((a, i) => {
      const l1 = [`Q${i + 1}. [${a.badge}] ${a.prompt}`, a.sub ? "Context: " + a.sub : null].filter(Boolean).flatMap(t => wrap(t, CW - 90, 9.5, "bold"));
      const l2 = wrap("Student answer: " + a.given, CW - 16, 9), l3 = a.ok ? [] : wrap("Correct answer: " + a.correct, CW - 16, 9);
      const l4 = a.markScheme ? wrap("Mark scheme points: " + a.markScheme.join("; "), CW - 16, 8) : [];
      const total = (l1.length + l2.length + l3.length) * 12.5 + l4.length * 11 + 18; need(total + 4);
      doc.setDrawColor(203, 213, 225); doc.setFillColor(a.ok ? 236 : 254, a.ok ? 253 : 242, a.ok ? 245 : 242); doc.roundedRect(M, y, CW, total, 4, 4, "FD");
      let yy = y + 5; doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(15, 23, 42); doc.text(l1, M + 8, yy + 8); yy += l1.length * 12.5;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(51, 65, 85); doc.text(l2, M + 8, yy + 8); yy += l2.length * 12.5;
      if (l3.length) { doc.setTextColor(4, 120, 87); doc.text(l3, M + 8, yy + 8); yy += l3.length * 12.5; }
      if (l4.length) { doc.setFontSize(8); doc.setTextColor(100, 116, 139); doc.text(l4, M + 8, yy + 8); }
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(a.ok ? 4 : 190, a.ok ? 120 : 18, a.ok ? 87 : 60);
      doc.text(a.ok ? "1 / 1 mark" : "0 / 1 mark", W - M - 8, y + 13, { align: "right" });
      y += total + 6;
    });
    need(60); y += 4;
    para("Simulation link", { style: "bold", size: 9, color: [71, 85, 105], gap: 1 });
    const ul = wrap(url, CW, 8.5); need(ul.length * 11 + 14); doc.setTextColor(37, 99, 235); doc.textWithLink(ul[0], M, y + 9, { url });
    if (ul.length > 1) doc.text(ul.slice(1), M, y + 20); y += ul.length * 11 + 6;
    para(`Integrity code ${sum} (tamper-evident only: it changes if the scores above are edited, but it does not prevent editing).`, { size: 8, color: [100, 116, 139] });
    const n = doc.internal.getNumberOfPages();
    for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(100, 116, 139);
      doc.text(`Discovery Lab Report - ${name} - ${dateStr}`, M, H - 24); doc.text(`Page ${p} of ${n}`, W - M, H - 24, { align: "right" }); }
    const file = `${name.replace(/[^A-Za-z0-9]+/g, "")}_IGCSEBiology_ExamSkills_CommandWords_${dateStr}.pdf`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(doc.output("blob")); a.download = file;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    msg.textContent = "Downloaded " + file + ". Upload this PDF to Learning Lab.";
  } catch (e) { console.error(e); msg.textContent = "Sorry, the PDF could not be built. Please try again."; }
}

render();
</script>
</body>
</html>
