  /* ---------- supermarket negotiation ---------- */

    if (r.tooCheap) { const bn = $(`<div class="gh-banner alert"><div><h3>${L("Too cheap!", "¡Demasiado barato!")}</h3><p>${L(`At ${GBP2(M.basePrice(g) * r.mult)}/kg the supermarket will take everything you grow, so it is easy to sell, but your cost is about ${GBP2(M.costPerKg(g))}/kg. You are making little or no profit.`, `A ${GBP2(M.basePrice(g) * r.mult)}/kg el supermercado se llevará todo lo que cultives, así que es fácil de vender, pero tu coste es de unos ${GBP2(M.costPerKg(g))}/kg. Ganas muy poco o nada.`)}</p><button type="button" class="gh-go gh-go--warn">${L("Understood", "Entendido")}</button></div></div>`); bn.querySelector("button").addEventListener("click", () => bn.remove()); view.append(bn); }
    sync(); api.save(); }
  dealCard.addEventListener("input", e => { if (e.target.id !== "deal-c") return; dealC = +e.target.value; dealCard.querySelector("#deal-cv").textContent = GBP(M.basePrice(g) * dealC) + "/kg"; });
  dealCard.addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (!b || b.disabled) return; const d = b.dataset.d, chain = g.offer ? g.offer.chain : "";
    if (d === "invite") { if (M.requestOffer(g)) { pop("-$100", "neg"); setMsg(""); say(L(`${g.offer.chain} sent a buyer to see your farm and made an offer.`, `${g.offer.chain} envió a un comprador a ver tu granja y hizo una oferta.`), "good"); renderDeal(true); sync(); api.save(); } }
    else if (d === "accept") { const r = M.acceptOffer(g); if (r) signed(r); }
    else if (d === "decline") { M.declineOffer(g); setMsg(L(`You turned ${chain} down. They will not call again for a while.`, `Rechazaste a ${chain}. No volverán a llamar en un tiempo.`)); say(L("Offer declined.", "Oferta rechazada."), ""); renderDeal(true); sync(); api.save(); }
    else if (d === "counter") { const r = M.counterOffer(g, dealC); if (!r) return;
      if (r.result === "accept") signed(r);
      else if (r.result === "counter") { dealC = r.mult; setMsg(L(`${chain}: "That is too high for us. The best we can do is ${GBP2(M.basePrice(g) * r.mult)}/kg."`, `${chain}: "Eso es demasiado para nosotros. Lo máximo que podemos pagar es ${GBP2(M.basePrice(g) * r.mult)}/kg."`)); say(L(`${chain} counter-offered ${GBP2(M.basePrice(g) * r.mult)}/kg. Accept it or push once more, but they may walk away.`, `${chain} contraofertó ${GBP2(M.basePrice(g) * r.mult)}/kg. Acéptalo o insiste una vez más, pero podrían irse.`), ""); renderDeal(true); sync(); api.save(); }
      else { dealC = 1; setMsg(L(`${r.chain} walked away: "That is too expensive for us. Goodbye."`, `${r.chain} se fue: "Es demasiado caro para nosotros. Adiós."`)); say(L(`${r.chain} declined the deal because your price was too high.`, `${r.chain} rechazó el trato porque tu precio era demasiado alto.`), "bad"); pop(L("Deal lost", "Trato perdido"), "neg"); renderDeal(true); sync(); api.save(); } } });
  buyCard.addEventListener("click", e => { const btn = e.target.closest(".gh-buybtn"); if (!btn || btn.disabled) return; const w = btn.closest(".gh-buy").dataset.w; const r = M.buy(g, w); if (!r.ok) return;
    pop("-" + GBP(r.cost), "neg"); gain(15); say(BMSG[w] + " " + (w === "shop" || ["led", "insul", "drip"].includes(w) ? "" : L("Plots: ", "Parcelas: ") + M.units(g) + "/" + M.SLOTS), "good");
    if (r.slot >= 0) { scene3d?.goto("site", r.slot); setTimeout(() => scene3d?.goto(st.cam), 3600); } else if (w === "shop") { scene3d?.goto("shop"); setTimeout(() => scene3d?.goto(st.cam), 3600); } else rt.burst?.("green");
    if (g.slots.includes("poly") && g.slots.includes("glass") && g.shop >= 1) mark("empire");
    sync(); api.save(); });
  SL.forEach(s => q("#in-" + s.k).addEventListener("input", e => { g.s[s.k] = +e.target.value; if (s.k === "heat" && g.s.heat > 0 && g.s.heat < 8) g.s.heat = 0; sync(); api.save(); if (rt.running) return; rt.burst?.(null); }));

  function tick() {
    if (!g.batch) { stop(); return; }
    const cs = M.cur(g); sparkG.push(cs.d.g); if (sparkG.length > 30) sparkG.shift();
    const burn = cs.cost.total; rt.pulse = 1;
    const be = q("#s-burn"); be.textContent = "-" + GBP(burn) + "/" + L("day","día"); be.classList.remove("hit"); void be.offsetWidth; be.classList.add("hit");
    const cp = $(`<div class="gh-cpop">-${GBP(burn)}</div>`); view.append(cp); setTimeout(() => cp.remove(), 950);
    const ev = M.stepDay(g);
    ev.forEach(e => handle(e));
    sync(); api.save();
    if (!g.batch) stop();
  }
  function start() { stop(); rt.running = true; rt.timer = setInterval(tick, Math.round(420 / st.speed)); sync(); }
  function stop() { rt.running = false; clearInterval(rt.timer); rt.timer = null; sync(); }
  function handle(e) {
    if (e.t === "pest") { stop(); showPest(); }
    else if (e.t === "ladybirds-working") { say(L("The ladybirds are eating the aphids. The pests are dropping fast.", "Las mariquitas se comen los pulgones. Las plagas bajan rápido."), "good"); }
    else if (e.t === "storm") { rt.shake?.(); say(true ? L("Wind storm! The polytunnel plastic flaps and some plants are damaged (-15% yield). A glass greenhouse would have shrugged it off.", "¡Tormenta de viento! El plástico del túnel se agita y algunas plantas se dañan (-15% de cosecha). Un invernadero de cristal lo habría resistido.") : "", "bad"); pop("-15%", "neg"); }
    else if (e.t === "viral") { say(L("A food blogger raves about your organic farm! Reputation +6 and more customers.", "¡Una bloguera de comida elogia tu granja orgánica! Reputación +6 y más clientes."), "good"); pop(L("Viral! Rep +6", "¡Viral! Rep +6")); rt.burst?.("green"); }
    else if (e.t === "gardener-pest") { view.querySelector(".gh-banner.alert")?.remove(); q("#pestbtn")?.remove(); const org = g.method === "organic"; rt.sprayT = org ? 0 : 2.2; rt.sprayInit = !org;
      say(org ? L("Your gardener weeded by hand and released ladybirds. No chemicals used; they need about 5 days to clear the aphids.", "Tu jardinero deshierbó a mano y soltó mariquitas. Sin químicos; necesitan unos 5 días para limpiar los pulgones.") : L(`Your gardener sprayed pesticide and herbicide (${GBP(e.r.cost)}) and it worked ${Math.round(e.r.eff * 100)}% as well as the first spray. Reputation -2.`, `Tu jardinero roció pesticida y herbicida (${GBP(e.r.cost)}) y funcionó al ${Math.round(e.r.eff * 100)}% del primero. Reputación -2.`), "good");
      pop(org ? "Rep +1" : "Rep -2", org ? "" : "neg"); gain(15); mark("pest"); }
    else if (e.t === "offer") { setMsg(""); dealSig = ""; say(L(`${g.offer.chain} called with an offer! Open "Supermarket deals" to negotiate.`, `¡${g.offer.chain} llamó con una oferta! Abre "Acuerdos con supermercados" para negociar.`), "good"); pop(L("New offer!", "¡Nueva oferta!")); }
    else if (e.t === "contract-end") { say(L(`Your contract with ${e.chain} has ended. You can negotiate a new one.`, `Tu contrato con ${e.chain} terminó. Puedes negociar uno nuevo.`), ""); dealSig = ""; }
    else if (e.t === "harvest") { onHarvest(e.row); }
  }
  function showPest() {
    const org = g.method === "organic", n = g.sprays;
    const bn = $(`<div class="gh-banner alert"><div><h3>${L("Pest alert!","¡Alerta de plagas!")}</h3>
      <p>${L("Aphids and weeds are attacking your crop. Every day you wait, you lose yield. Choose how to respond.", "Pulgones y malas hierbas atacan tu cultivo. Cada día que esperas pierdes cosecha. Elige cómo responder.")}</p>
      <div class="gh-2"><button class="gh-go gh-go--warn" id="r-act">${org ? L(`Release ladybirds + hand-weed (${GBP(M.pestCost(g))})`, `Soltar mariquitas + deshierbar a mano (${GBP(M.pestCost(g))})`) : L(`Spray pesticide + herbicide (${GBP(M.pestCost(g))})`, `Rociar pesticida + herbicida (${GBP(M.pestCost(g))})`)}</button>
      <button class="gh-go gh-go--ghost" id="r-skip">${L("Do nothing", "No hacer nada")}</button></div>
      ${g.gardeners ? `<button class="gh-go gh-go--ghost" id="r-del" style="margin-top:8px">${L("Let my gardener handle it (in 2 days)", "Que lo haga mi jardinero (en 2 días)")}</button>` : ""}
      <p class="gh-note">${org ? L("Biological control: a predator eats the pest. No chemicals and a good story for customers, but it takes about 5 days to work.", "Control biológico: un depredador se come la plaga. Sin químicos y una buena historia para los clientes, pero tarda unos 5 días en funcionar.") : L(`Chemicals work at once and are cheap, but pests can become resistant (spray ${n + 1} will work about ${Math.round(Math.max(.4, 1 - .15 * n) * 100)}% as well as the first), they can kill harmless insects, and they can wash into rivers.`, `Los químicos actúan al instante y son baratos, pero las plagas pueden volverse resistentes (la aplicación ${n + 1} funcionará a un ${Math.round(Math.max(.4, 1 - .15 * n) * 100)}% de la primera), pueden matar insectos inofensivos y pueden llegar a los ríos.`)}</p></div></div>`);
    bn.querySelector("#r-act").addEventListener("click", () => { const r = M.respondPest(g); bn.remove(); rt.sprayT = org ? 0 : 2.2; rt.sprayInit = !org;
      say(org ? L("Ladybirds released and the weeds pulled by hand. They need about 5 days to clear the aphids; no chemicals were used.", "Mariquitas liberadas y malas hierbas arrancadas a mano. Necesitan unos 5 días para limpiar los pulgones; no se usaron químicos.") : L(`Sprayed! Pests dropped at once (${Math.round(r.eff * 100)}% effective). But chemicals cost reputation and weaken next time.`, `¡Rociado! Las plagas bajaron al instante (${Math.round(r.eff * 100)}% efectivo). Pero los químicos cuestan reputación y funcionarán peor la próxima vez.`), "good");
      pop(org ? L("Rep +1", "Rep +1") : L("Rep -2", "Rep -2"), org ? "" : "neg"); gain(15); mark("pest"); rt.alarm?.(); start(); });
    bn.querySelector("#r-del")?.addEventListener("click", () => { g.batch.pest.delegated = true; bn.remove(); say(L("You asked your gardener to deal with the pests. They will act in 2 days; meanwhile the pests keep damaging the crop.", "Pediste a tu jardinero que se ocupe de las plagas. Actuará en 2 días; mientras, las plagas siguen dañando el cultivo."), ""); api.save(); start(); });
    bn.querySelector("#r-skip").addEventListener("click", () => { bn.remove(); say(L("You chose to do nothing, so no pesticide is used and nobody will treat the pests. Watch the yield drop! You can still respond with the button below.", "Elegiste no hacer nada, así que no se usa pesticida y nadie tratará las plagas. ¡Mira cómo baja la cosecha! Aún puedes responder con el botón de abajo."), "bad"); st.pestOpen = true; showPestBtn(); start(); });
    view.append(bn);
  }
  function showPestBtn() { if (q("#pestbtn")) return; const b = $(`<button class="gh-go gh-go--warn" id="pestbtn" style="margin-bottom:6px;min-height:34px">${L("Deal with the pests now", "Ocuparme de las plagas ahora")}</button>`); b.addEventListener("click", () => { b.remove(); if (g.batch && g.batch.pest && !g.batch.pest.done) { stop(); showPest(); } }); act.querySelector("#go").parentElement.prepend(b); }
  function payPart(kind, amt) { const pd = g.pending; if (!pd) return; amt = Math.min(amt, pd[kind]); if (amt <= 0) return; pd[kind] -= amt; g.cash += amt; if (pd.shop + pd.van < 0.01) g.pending = null; pop("+" + GBP(amt), "cash"); sync(); api.save(); }
  function settle(r) {
    const pd = g.pending; rt.crateN = Math.min(18, Math.max(3, Math.round(r.sold / 25))); scene3d?.goto("shop");
    const finish = () => { M.flush(g, "all"); rt.crateN = 0; scene3d?.goto(st.cam); sync(); api.save(); if (!M.canStart(g) && !g.batch) setTimeout(() => showReport(), 600); };
    if (!pd) { finish(); return; }
    const nC = g.shop ? Math.min(8, 2 + 2 * g.shop) : 0, per = nC ? pd.shop / nC : 0, vanAmt = pd.van; let nPaid = 0;
    const need = nC; let guard = setTimeout(finish, 20000);
    for (let i = 0; i < nC; i++) setTimeout(() => { const go = () => { payPart("shop", per); rt.burst?.("coins", [34, 2.4, 5.5]); nPaid++; }; if (scene3d && rt.sendCustomer) rt.sendCustomer(go); else go(); }, i * 900);
    setTimeout(() => { const go = () => { payPart("van", vanAmt); rt.burst?.("coins", [21, 2.4, 9.5]); rt.crateN = 0; clearTimeout(guard); setTimeout(finish, 500); };
      say(L(`Farm shop sales and the delivery van to the supermarkets and markets are bringing in ${GBP(r.revenue)}.`, `Las ventas de la tienda de la granja y la furgoneta a supermercados y mercados traen ${GBP(r.revenue)}.`), "good");
      if (scene3d && rt.sendVan) rt.sendVan(go); else setTimeout(go, 1200); }, nC * 900 + 600);
  }
  function onHarvest(r) {
    q("#pestbtn")?.remove(); sparkG.length = 0;
    const p = r.profit; rt.burst?.(p >= 0 ? "green" : "bad");
    mark(r.method === "organic" ? "organic" : "inorganic"); gain(20 + (p > 0 ? 25 : 0));
    const LNm = { light: L("light","la luz"), temp: L("temperature","la temperatura"), co2: L("CO₂","el CO₂"), water: L("water","el agua") };
    say(L(`Harvest ${r.n}: ${Math.round(r.kg)} kg grown, ${Math.round(r.sold)} kg sold at $${r.price.toFixed(2)}/kg${r.spoil > 1 ? `, ${Math.round(r.spoil)} kg unsold (waste)` : ""}. Income ${GBP(r.revenue)}, costs ${GBP(r.costs)}, profit ${GBP(p)}. Most limiting factor: ${LNm[r.lim]}.`, `Cosecha ${r.n}: ${Math.round(r.kg)} kg cultivados, ${Math.round(r.sold)} kg vendidos a $${r.price.toFixed(2)}/kg${r.spoil > 1 ? `, ${Math.round(r.spoil)} kg sin vender (desperdicio)` : ""}. Ingresos ${GBP(r.revenue)}, costes ${GBP(r.costs)}, beneficio ${GBP(p)}. Factor más limitante: ${LNm[r.lim]}.`), p >= 0 ? "good" : "bad");
    settle(r);
  }
  q("#go").addEventListener("click", () => {
    if (g.batch) { start(); return; }
    const org = g.method === "organic";
    const ev = M.startBatch(g); if (!ev) return; sparkG.length = 0;
    rt.crateN = 0; rt.burst?.("green"); M.flush(g, "all");
    if (ev.some(e => e.t === "runoff")) { say(L("Heavy rain washed inorganic fertiliser into the river! Algae bloom, so algae block light, plants die, bacteria use up the oxygen and fish die. Reputation -10.", "¡La lluvia arrastró fertilizante inorgánico al río! Florece el alga: bloquea la luz, las plantas mueren, las bacterias gastan el oxígeno y los peces mueren. Reputación -10."), "bad"); pop("Rep -10", "neg"); scene3d?.goto("river"); setTimeout(() => scene3d?.goto(st.cam), 4200); }
    else { g.river = 0; say(org ? L("Organic batch planted. Manure releases minerals slowly, so be patient.", "Cosecha orgánica plantada. El abono libera minerales despacio, ten paciencia.") : L("Inorganic batch planted. NPK fertiliser gives plants minerals fast.", "Cosecha inorgánica plantada. El fertilizante NPK da minerales rápido a las plantas."), "good"); }
    start(); });
  q("#pause").addEventListener("click", () => { if (rt.running) stop(); else start(); });
  q("#speed").addEventListener("click", () => { st.speed = st.speed === 1 ? 2 : st.speed === 2 ? 4 : 1; if (rt.running) start(); else sync(); api.save(); });
  q("#wait").addEventListener("click", () => { M.wait(g, 10); say(L("You rested the house for 10 days (you still pay rent). Waiting for spring can make growing cheaper.", "Dejaste descansar el invernadero 10 días (sigues pagando alquiler). Esperar a la primavera puede abaratar el cultivo."), ""); sync(); api.save(); if (!M.canStart(g)) showReport(); });
  q("#fin").addEventListener("click", () => { if (g.batch) return; g.day = M.YEAR_DAYS; sync(); showReport(); });

  /* ---------- year-end business report ---------- */
  function showReport() {
    if (view.querySelector(".gh-banner.rep")) return;
    const tot = M.yearTotals(g), proj = M.project(g, 4); mark("year");
    const maxv = Math.max(1, ...proj.map(p => Math.abs(p.profit)), Math.abs(tot.profit));
    const bars = [{ year: st.year, profit: tot.profit }, ...proj.map(p => ({ year: st.year + p.year - 1, profit: p.profit }))].map((p, i) => `<g><rect x="${14 + i * 62}" y="${p.profit >= 0 ? 60 - p.profit / maxv * 52 : 60}" width="44" height="${Math.max(2, Math.abs(p.profit) / maxv * 52)}" rx="4" fill="${i === 0 ? "#ffd166" : (p.profit >= 0 ? "#7dff9a" : "#ff5468")}"/><text x="${36 + i * 62}" y="86" font-size="10" fill="#9fd8b3" text-anchor="middle" font-weight="700">${L("Yr","Año")} ${p.year}</text><text x="${36 + i * 62}" y="${p.profit >= 0 ? 56 - p.profit / maxv * 52 : 72 + Math.abs(p.profit) / maxv * 52 }" font-size="9.5" fill="#e6fff0" text-anchor="middle" font-weight="800">${GBP(p.profit)}</text></g>`).join("");
    const org = g.method === "organic";
    const bn = $(`<div class="gh-banner rep"><div><h3>${L("Year", "Año")} ${st.year} · ${L("Business report", "Informe de negocio")}</h3>
      <p>${L(`Profit ${GBP(tot.profit)} from ${tot.batches} batches · cash ${GBP(tot.cash)} · reputation ${Math.round(g.rep)}/100`, `Beneficio ${GBP(tot.profit)} en ${tot.batches} cosechas · dinero ${GBP(tot.cash)} · reputación ${Math.round(g.rep)}/100`)}</p>
      <div class="gh-tbl"><table class="gh-led">${q("#led").innerHTML}</table></div>
      <p class="gh-note">${L("If you keep farming this same way, your outlook for the next years:", "Si sigues cultivando de esta misma manera, así se ve tu futuro:")}</p>
      <svg viewBox="0 -10 300 104" width="100%" style="max-width:420px" role="img" aria-label="${L("Projected profit per year","Beneficio previsto por año")}">${bars}</svg>
      <p class="gh-note">${org ? L("Organic: fewer batches and higher costs, but your reputation grows, so customers pay more and come back. Long-term, loyal, well-informed customers are an asset.", "Orgánico: menos cosechas y más costes, pero tu reputación crece, así los clientes pagan más y vuelven. Los clientes fieles e informados son un activo a largo plazo.") : L("Inorganic: more batches and lower prices, so you sell a lot, but chemicals cost reputation and an environmental scandal can hurt sales.", "Inorgánico: más cosechas y precios más bajos, así vendes mucho, pero los químicos cuestan reputación y un escándalo ambiental puede dañar las ventas.")}</p>
      <div class="gh-2"><button class="gh-go" id="r-next">${L("Next year (keep your farm)","Año siguiente (conserva tu granja)")}</button><button class="gh-go gh-go--ghost" id="r-quiz">${L("Go to the quiz","Ir al cuestionario")}</button></div></div></div>`);
    bn.querySelector("#r-next").addEventListener("click", () => { st.years.push({ year: st.year, profit: tot.profit, rep: g.rep }); st.year++; M.newYear(g); bn.remove(); say(L(`Year ${st.year} begins. Your reputation and soil carry over. Try the other growing method and compare.`, `Empieza el año ${st.year}. Tu reputación y tu suelo se conservan. Prueba el otro método de cultivo y compara.`), "good"); sync(); api.save(); });
    bn.querySelector("#r-quiz").addEventListener("click", () => { bn.remove(); document.querySelector(".q")?.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }); });
    view.append(bn); rt.burst?.("coins"); api.save();
  }

  host.append(root); renderTop(); if (g.pending) { M.flush(g, "all"); }
  if (g.batch) { say(L("Welcome back! Your batch is paused. Press Resume growing to carry on.", "¡Bienvenido de nuevo! Tu cosecha está en pausa. Pulsa Continuar el cultivo para seguir."), ""); if (g.batch.pest && !g.batch.pest.done) showPestBtn(); }
  else say(L("Welcome, farmer! You own one bare outdoor field and $400. Grow vegetables outside, sell them, then save up to build your first polytunnel and glasshouse.", "¡Bienvenido, agricultor! Tienes un campo abierto vacío y $400. Cultiva verduras al aire libre, véndelas y ahorra para construir tu primer túnel y tu primer invernadero."));
  sync();
  initScene(view, g, rt).then(s => { scene3d = s; if (s) s.goto(st.cam); else view.prepend($(`<div class="gh-nogl">${L("3D view is not available on this device, but every control below still works.", "La vista 3D no está disponible en este dispositivo, pero todos los controles siguen funcionando.")}</div>`)); })
    .catch(e => console.error("3D scene failed", e));
  window.__gh = { g, st, M, rt, tick, sync };
}

mountExternalActivity({ simulation: mkSim }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
</html>
