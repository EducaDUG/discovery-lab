  }
  /* ---------- clicking things ---------- */
  rt.onPick = (ref) => { if (!ref) return; if (ref.kind === "animal") { st.sel = { ...st.sel, id: ref.id, kind: "animal" }; st.tab = st.tab === "breed" ? "breed" : "herd"; const a = animal(ref.id); if (a) pop(`${SPI[a.sp]} ${esc(a.name)}`); }
    else if (ref.kind === "plant") { st.sel = { ...st.sel, id: ref.id, kind: "plant" }; st.tab = "crops"; }
    else if (ref.kind === "bld") { const m = { barn: "herd", pen: "herd", shed: g.b.shed ? "herd" : "build", parlour: g.b.parlour ? "herd" : "build", glass: g.b.glass ? "crops" : "build", warehouse: g.b.warehouse ? "biz" : "build", clinic: g.b.clinic ? "staff" : "build", lab: g.b.lab ? "breed" : "build" }; st.tab = m[ref.key] || "build"; say(L("You opened a building.", "Abriste un edificio."), ""); }
    sync(); api.save(); };
  tabBar.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; st.tab = b.dataset.t; sync(); });
  selCard.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b || b.disabled) return; const s = st.sel, act = b.dataset.act;
    if (act === "mum") { s.mum = s.id; st.tab = "breed"; const a = animal(s.id); if (a) { s.spc = a.sp; if (s.dad && animal(s.dad) && animal(s.dad).sp !== a.sp) s.dad = null; } }
    else if (act === "dad") { const a = animal(s.id); if (a) { s.dad = s.id; s.ai = 0; st.tab = "breed"; if (s.mum && animal(s.mum) && animal(s.mum).sp !== a.sp) s.mum = null; s.spc = a.sp; } }
    else if (act === "shear") { const r = M.shear(g, s.id); if (r.ok) { say(L(`Sheared ${r.kg.toFixed(1)} kg of wool. 🧶`, `Esquilaste ${r.kg.toFixed(1)} kg de lana. 🧶`), "good"); pop("🧶 +" + r.kg.toFixed(1) + " kg"); } }
    else if (act === "stock" || act === "meat") { const a = animal(s.id), r = M.sellAnimal(g, s.id, act); if (r.ok) { say(act === "stock" ? L(`${a.name} went to a breeder for ${D(r.value)}. Good genes earn more!`, `${a.name} se fue con un criador por ${D(r.value)}. ¡Los buenos genes valen más!`) : L(`${a.name} was sold for meat: ${D(r.value)}.`, `${a.name} se vendió por la carne: ${D(r.value)}.`), "good"); pop("+" + D(r.value), "cash"); rt.burst?.("coins"); s.id = null; if (s.mum === a.id) s.mum = null; if (s.dad === a.id) s.dad = null; } }
    else if (act === "donor") { s.donor = s.id; st.tab = "crops"; } else if (act === "recv") { s.recv = s.id; st.tab = "crops"; }
    else if (act === "pull") { M.removePlant(g, s.id); if (s.donor === s.id) s.donor = null; if (s.recv === s.id) s.recv = null; s.id = null; say(L("Plant pulled up. A weak plant leaves space for a better one.", "Planta arrancada. Una planta débil deja sitio a una mejor."), ""); }
    sync(); api.save(); });
  body.addEventListener("click", e => { const t = e.target.closest("button"); if (!t || t.disabled) return; const s = st.sel;
    if (t.dataset.flt) { st.flt = t.dataset.flt; }
    else if (t.dataset.pick) { s.id = +t.dataset.pick; s.kind = t.dataset.kind === "plant" ? "plant" : "animal"; const o = s.kind === "animal" ? animal(s.id) : null; if (o) scene3d?.goto("at", [rt.pos?.(s.id)?.x ?? -41, rt.pos?.(s.id)?.z ?? -20]); }
    else if (t.dataset.goal) st.goal = t.dataset.goal;
    else if (t.dataset.use) { const [k, id] = t.dataset.use.split(":"); s[k] = +id; if (k === "dad") s.ai = 0; const a = animal(+id); if (a) s.spc = a.sp; }
    else if (t.dataset.ai !== undefined) { s.ai = +t.dataset.ai; if (s.ai) s.dad = null; }
    else if (t.id === "dobreed") { const mum = animal(s.mum), r = M.breed(g, s.mum, s.dad || null, s.ai || 0); if (r.ok) { say(L(`${mum.name} is expecting a baby! It arrives in ${r.due - g.day} days. 💕`, `¡${mum.name} espera una cría! Llegará en ${r.due - g.day} días. 💕`), "good"); pop("💕"); rt.hearts?.(rt.pos?.(mum.id)?.x ?? -40, rt.pos?.(mum.id)?.z ?? -20); rt.float?.("\u{1F495}", rt.pos?.(mum.id)?.x ?? -40, 4, rt.pos?.(mum.id)?.z ?? -20); mark("breed"); if (s.ai) pop("-" + D(M.STUD[s.ai - 1].cost), "neg"); if (!running) start(); s.mum = null; if (s.ai) s.ai = 0; else s.dad = s.dad; } }
    else if (t.id === "dopoll") { const A = plant(s.donor), Bp = plant(s.recv); if (A && Bp && M.canPollinate(g, A, Bp).ok) { t.disabled = true; say(L("The bee carries pollen from one flower to the other… 🐝", "La abeja lleva polen de una flor a la otra… 🐝"), "good"); const done = () => { const r = M.pollinate(g, s.donor, s.recv); if (r.ok) { say(L(`Seeds collected! ${r.n} new seedlings will grow in 3 days. 🌱`, `¡Semillas recogidas! ${r.n} plántulas nuevas crecerán en 3 días. 🌱`), "good"); mark("plants"); rt.float?.("\u{1F331}", 44, 3, -20); } sync(); api.save(); }; if (scene3d && rt.bee) rt.bee(s.donor, s.recv, done); else done(); if (!running) start(); } }
    else if (t.dataset.buy) { const r = M.buyAnimal(g, +t.dataset.buy); if (r.ok) { say(L(`You bought ${r.a.name} for ${D(r.price)}. Buying animals costs a lot: breeding your own saves money!`, `Compraste a ${r.a.name} por ${D(r.price)}. Comprar animales cuesta mucho: ¡criar los tuyos ahorra dinero!`), "good"); pop("-" + D(r.price), "neg"); s.id = r.a.id; s.kind = "animal"; } else say(r.why === "full" ? L("No room! Sell some animals or build more space.", "¡No hay sitio! Vende animales o construye más espacio.") : L("Not enough cash.", "No hay dinero suficiente."), "bad"); }
    else if (t.dataset.up) { const r = M.upgrade(g, t.dataset.up); if (r.ok) { say(L("Built! The new building appears on the ranch.", "¡Construido! El nuevo edificio aparece en el rancho."), "good"); pop("-" + D(r.cost), "neg"); rt.burst?.("green"); scene3d?.goto({ barn: "cows", pen: "sheep", glass: "glass", warehouse: "warehouse", lab: "lab", clinic: "lab" }[t.dataset.up] || "overview"); setTimeout(() => scene3d?.goto(st.cam), 3500); } }
    else if (t.dataset.hire) { const [w, n] = t.dataset.hire.split(":"); const r = M.hire(g, w, +n); if (r.ok) { say(+n > 0 ? L("Hired! Wages are paid every day.", "¡Contratado! El sueldo se paga cada día.") : L("Let go. You save wages.", "Despedido. Ahorras sueldo."), "good"); if (w === "vet" && +n > 0) mark("vet"); } }
    else if (t.dataset.act2 === "callvet") { vetCall(); } else if (t.dataset.act2 === "spray") { const r = M.sprayPests(g); if (r.ok) { say(L("Sprayed! The pests are gone. Plants with strong resistance need less help.", "¡Fumigado! Las plagas se fueron. Las plantas resistentes necesitan menos ayuda."), "good"); pop("-" + D(80), "neg"); } }
    sync(); api.save(); });
  body.addEventListener("change", e => { if (e.target.id === "supchk") { const r = M.toggleSuper(g, e.target.checked); say(r.ok ? (g.super ? L("Supermarket contract on. They only buy good-quality products!", "Contrato con supermercado activo. ¡Solo compran productos de buena calidad!") : L("Contract off.", "Contrato desactivado.")) : "", ""); sync(); api.save(); } });
  function vetCall() { const r = M.callVet(g); if (r.ok) { say(L(`The vet treated ${r.n} animals. 🚑`, `El veterinario trató ${r.n} animales. 🚑`), "good"); pop("-" + D(300), "neg"); rt.vetCar?.(); mark("vet"); view.querySelector(".gh-banner.alert")?.remove(); } else if (r.why === "cash") say(L("Not enough cash for the vet.", "No hay dinero para el veterinario."), "bad"); }
  /* ---------- the days ---------- */
  function handle(e) {
    if (e.t === "born") { const k = e.kids[0]; say(L(`${e.mum.name} had ${e.kids.length > 1 ? e.kids.length + " babies" : "a baby"}! Click ${e.kids.length > 1 ? "them" : "it"} to see the characteristics.`, `¡${e.mum.name} tuvo ${e.kids.length > 1 ? e.kids.length + " crías" : "una cría"}! Haz clic para ver sus características.`), "good"); pop("🍼"); rt.hearts?.(-40, -18); }
    else if (e.t === "grown") { /* quiet */ } else if (e.t === "germinated") say(L("New tomato seedlings are growing! Click them to see their traits.", "¡Nuevas plántulas de tomate! Haz clic para ver sus rasgos."), "good");
    else if (e.t === "sheared") pop("✂️");
    else if (e.t === "outbreak") { if (g.staff.vet) { say(L("A disease started, but your vet is already treating the animals. 🩺", "Empezó una enfermedad, pero tu veterinario ya trata a los animales. 🩺"), "good"); mark("vet"); } else { stop(); showOutbreak(e.n); } }
    else if (e.t === "pest") { stop(); showPest(); }
    else if (e.t === "died") say(L(`Sad news: ${e.list.map(a => a.name).join(", ")} died of disease. Animals with high health resist disease better.`, `Triste noticia: ${e.list.map(a => a.name).join(", ")} murió de enfermedad. Los animales con mucha salud resisten mejor.`), "bad");
    else if (e.t === "market") say(L("New animals have arrived at the livestock market.", "Llegaron animales nuevos al mercado de ganado."), "");
    else if (e.t === "collect") { const r = e.r; g.lastCollect = r; const done = () => { const v = M.flush(g); pop("+" + D(v), "cash"); say(L(`The truck sold your products for ${D(v)}.`, `El camión vendió tus productos por ${D(v)}.`), "good"); if (r.rows.some(x => x.sup > 0)) mark("quality"); sync(); api.save(); }; if (scene3d && rt.truck) rt.truck(done); else done(); }
    else if (e.t === "year") { stop(); yearReport(); }
  }
  function showOutbreak(n) { const bn = $(`<div class="gh-banner alert"><div><h3>${L("Disease outbreak! 🤒", "¡Brote de enfermedad! 🤒")}</h3><div class="bigpic">🐄🤒 🐑🤒</div><p>${L(`${n} animals are sick. Animals with low health may die. A vet can treat them.`, `${n} animales están enfermos. Los de poca salud pueden morir. Un veterinario puede tratarlos.`)}</p><div class="gh-2"><button class="gh-go gh-go--warn" id="oc">${L("Call the vet 🚑", "Llamar al veterinario 🚑")} ${D(300)}</button><button class="gh-go gh-go--ghost" id="ow">${L("Wait and see", "Esperar")}</button></div></div></div>`);
    bn.querySelector("#oc").addEventListener("click", () => { vetCall(); bn.remove(); start(); sync(); }); bn.querySelector("#ow").addEventListener("click", () => { bn.remove(); say(L("You waited. Sick animals with low health might not survive. Breed healthier animals!", "Esperaste. Los animales enfermos con poca salud pueden no sobrevivir. ¡Cría animales más sanos!"), "bad"); start(); }); view.append(bn); }
  function showPest() { const bn = $(`<div class="gh-banner alert"><div><h3>${L("Pests and weeds! 🐛", "¡Plagas y malas hierbas! 🐛")}</h3><div class="bigpic">🐛🍅🥀</div><p>${L("Pests and weeds are attacking the tomatoes. Plants with high disease resistance suffer less.", "Las plagas y malas hierbas atacan los tomates. Las plantas con más resistencia sufren menos.")}</p><div class="gh-2"><button class="gh-go gh-go--warn" id="pc">${L("Spray", "Fumigar")} ${D(80)}</button><button class="gh-go gh-go--ghost" id="pw">${L("Wait", "Esperar")}</button></div></div></div>`);
    bn.querySelector("#pc").addEventListener("click", () => { M.sprayPests(g); pop("-" + D(80), "neg"); bn.remove(); start(); sync(); }); bn.querySelector("#pw").addEventListener("click", () => { bn.remove(); start(); }); view.append(bn); }
  function yearReport() { const s = M.summary(g), prof = g.cash - (st.yearStartCash ?? M.START_CASH);
    const bn = $(`<div class="gh-banner rep"><div><h3>${L("Year", "Año")} ${g.year} · ${L("Ranch report", "Informe del rancho")}</h3><p>${L(`Cash ${D(g.cash)} (${prof >= 0 ? "+" : ""}${D(prof)} this year) · farm fame ${Math.round(g.rep)}`, `Dinero ${D(g.cash)} (${prof >= 0 ? "+" : ""}${D(prof)} este año) · fama ${Math.round(g.rep)}`)}</p>
      <div class="gh-note">${L(`Cows ${s.cows} (quality ${s.cowMerit.toFixed(0)}, was ${st.base.cow.toFixed(0)}) · sheep ${s.sheep} (${s.sheepMerit.toFixed(0)}, was ${st.base.sheep.toFixed(0)}) · tomato plants ${s.plants} (${s.tom.toFixed(0)}, was ${st.base.tom.toFixed(0)})`, `Vacas ${s.cows} (calidad ${s.cowMerit.toFixed(0)}, antes ${st.base.cow.toFixed(0)}) · ovejas ${s.sheep} (${s.sheepMerit.toFixed(0)}, antes ${st.base.sheep.toFixed(0)}) · tomateras ${s.plants} (${s.tom.toFixed(0)}, antes ${st.base.tom.toFixed(0)})`)}</div>
      <div class="gh-note">${L(`Babies born ${g.stats.born} · crosses ${g.stats.pollinated} · treated ${g.stats.treated} · supermarket sales ${g.stats.superSales} · lost to disease ${g.stats.died}`, `Crías ${g.stats.born} · cruces ${g.stats.pollinated} · tratamientos ${g.stats.treated} · ventas al supermercado ${g.stats.superSales} · perdidos por enfermedad ${g.stats.died}`)}</div>
      <p class="gh-note">${L("Science is the engine of the business: better genes mean more milk, healthier animals and tastier tomatoes, and that means more money.", "La ciencia es el motor del negocio: mejores genes significan más leche, animales más sanos y tomates más ricos, y eso significa más dinero.")}</p>
      <div class="gh-2"><button class="gh-go" id="ynext">${L("Next year", "Año siguiente")}</button><button class="gh-go gh-go--ghost" id="yquiz">${L("Go to the quiz", "Ir al cuestionario")}</button></div></div></div>`);
    bn.querySelector("#ynext").addEventListener("click", () => { g.year++; st.yearStartCash = g.cash; bn.remove(); start(); sync(); api.save(); }); bn.querySelector("#yquiz").addEventListener("click", () => { bn.remove(); document.querySelector(".q")?.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }); }); view.append(bn); mark("year"); rt.burst?.("coins"); }
  function tick() { const ev = M.stepDay(g); ev.forEach(handle); sync(); api.save(); }
  function start() { stop(); running = true; timer = setInterval(tick, Math.round(900 / st.speed)); sync(); }
  function stop() { running = false; clearInterval(timer); timer = null; sync(); }
  q("#go").addEventListener("click", () => { running ? stop() : start(); });
  q("#speed").addEventListener("click", () => { st.speed = st.speed === 1 ? 2 : st.speed === 2 ? 4 : 1; if (running) start(); else sync(); api.save(); });
  q("#skip").addEventListener("click", () => { let n = 0; while (g.collectIn > 1 && n++ < 6) tick(); tick(); });

  host.append(root); if (g.pending) M.flush(g);
  say(L("Welcome to your ranch! Click a cow, a sheep or a tomato plant to see its characteristics. Then press ▶ to start the days.", "¡Bienvenido a tu rancho! Haz clic en una vaca, una oveja o una tomatera para ver sus características. Luego pulsa ▶ para empezar los días."));
  sync();
  (async () => { try { if (!window.THREE) await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "../../../../../engine/vendor/three.min.js"; s.onload = res; s.onerror = rej; document.head.append(s); }); scene3d = await initScene(view, g, rt, M, { reduced }); if (scene3d) { scene3d.goto(st.cam); } else view.prepend($(`<div class="gh-nogl">${L("The 3D ranch cannot show on this device, but every control still works.", "El rancho en 3D no se ve en este dispositivo, pero todos los controles funcionan.")}</div>`)); } catch (e) { console.error("3D failed", e); } })();
  window.__rn = { g, st, M, rt, sync, tick };
}
mountExternalActivity({ simulation: mkSim }).catch(e => { console.error("Activity failed to start:", e); const r = document.getElementById("lab-root"); if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>'; });

</script>
</body>
</html>
