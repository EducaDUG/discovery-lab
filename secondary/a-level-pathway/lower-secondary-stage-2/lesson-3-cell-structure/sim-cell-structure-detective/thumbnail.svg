<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A microscope beside a plant cell and an animal cell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d241d"/>
      <stop offset="1" stop-color="#153428"/>
    </linearGradient>
    <radialGradient id="lens" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#eafff2" stop-opacity=".9"/>
      <stop offset="1" stop-color="#3fd08b" stop-opacity=".25"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- plant cell field of view (left) -->
  <circle cx="110" cy="150" r="78" fill="#173a2c" stroke="#3fd08b" stroke-width="2"/>
  <g stroke="#2f6b4d" stroke-width="3" opacity=".85">
    <path d="M40 115 H180"/><path d="M40 150 H180"/><path d="M40 185 H180"/>
    <path d="M85 90 V210"/><path d="M140 90 V210"/>
  </g>
  <g fill="#7bffb0" opacity=".85">
    <circle cx="65" cy="128" r="7"/><circle cx="118" cy="138" r="6"/><circle cx="155" cy="120" r="5"/>
    <circle cx="70" cy="170" r="6"/><circle cx="130" cy="178" r="7"/><circle cx="160" cy="165" r="5"/>
  </g>

  <!-- animal cell field of view (right) -->
  <circle cx="300" cy="150" r="78" fill="#173a2c" stroke="#9A6E05" stroke-width="2"/>
  <path d="M250 95 C230 130 235 190 270 205 C300 218 335 200 340 165 C344 135 320 100 285 95 C275 93 260 90 250 95 Z"
        fill="#2a4f3c" stroke="#5f8c7a" stroke-width="2"/>
  <ellipse cx="292" cy="150" rx="22" ry="18" fill="#9A6E05" opacity=".9"/>
  <g fill="#c9601f" opacity=".7">
    <circle cx="262" cy="120" r="3.5"/><circle cx="320" cy="130" r="3"/><circle cx="270" cy="185" r="3.5"/>
  </g>

  <!-- microscope silhouette -->
  <g transform="translate(200,20)" fill="none" stroke="#eafff2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <line x1="0" y1="0" x2="0" y2="14"/>
    <path d="M0 14 L-14 46"/>
    <circle cx="0" cy="0" r="7" fill="#3fd08b" stroke="none"/>
    <line x1="-14" y1="46" x2="26" y2="46"/>
  </g>

  <text x="200" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#eafff2" font-weight="700">Cell Structure Detective</text>
</svg>
