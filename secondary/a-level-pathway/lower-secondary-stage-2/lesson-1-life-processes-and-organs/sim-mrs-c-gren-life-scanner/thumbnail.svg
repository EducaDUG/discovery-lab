<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A glowing containment chamber holding a bacterium, a mushroom, a Venus flytrap and a beetle, scanned by a green sensor beam">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#173a2c"/><stop offset="1" stop-color="#081712"/>
    </radialGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3a2c"/><stop offset="1" stop-color="#0d241d"/>
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#glow)"/>

  <!-- scan beam -->
  <g opacity="0.5">
    <line x1="160" y1="10" x2="70" y2="150" stroke="#7bffb0" stroke-width="2"/>
    <line x1="160" y1="10" x2="250" y2="150" stroke="#7bffb0" stroke-width="2"/>
    <line x1="160" y1="10" x2="160" y2="150" stroke="#7bffb0" stroke-width="1.4"/>
  </g>
  <circle cx="160" cy="10" r="6" fill="#a6ff5c"/>

  <!-- dish -->
  <ellipse cx="160" cy="164" rx="132" ry="26" fill="url(#dish)" stroke="#2f6b4d" stroke-width="2"/>
  <ellipse cx="160" cy="158" rx="110" ry="16" fill="#0f2d22" opacity="0.7"/>

  <!-- bacterium -->
  <g>
    <rect x="46" y="118" width="30" height="16" rx="8" fill="#3fd0c0" opacity="0.9"/>
    <circle cx="54" cy="126" r="3" fill="#0c4d44"/>
    <path d="M76 126 q10 -4 16 -1" stroke="#2a9c8e" stroke-width="1.6" fill="none"/>
  </g>

  <!-- mushroom -->
  <g>
    <rect x="118" y="122" width="6" height="18" fill="#e8dcc0"/>
    <path d="M104 122 a17 12 0 0 1 34 0 Z" fill="#d9b26b"/>
  </g>

  <!-- venus flytrap -->
  <g>
    <rect x="168" y="128" width="6" height="18" fill="#2f7a3f"/>
    <path d="M176 122 q14 -18 26 -2 q-14 10 -26 2 Z" fill="#3f9d4d"/>
    <path d="M176 122 q14 -18 26 -2" fill="none" stroke="#c23f4f" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- beetle -->
  <g>
    <ellipse cx="252" cy="134" rx="14" ry="9" fill="#8a5a2b"/>
    <circle cx="264" cy="130" r="5" fill="#8a5a2b"/>
    <g stroke="#5a3a1a" stroke-width="1.6" stroke-linecap="round">
      <line x1="244" y1="140" x2="236" y2="148"/>
      <line x1="252" y1="142" x2="248" y2="150"/>
      <line x1="260" y1="140" x2="262" y2="148"/>
    </g>
  </g>

  <!-- MRS C GREN chip strip -->
  <g font-family="monospace" font-size="13" font-weight="700" fill="#eafff2">
    <text x="160" y="192" text-anchor="middle" letter-spacing="4">M R S C G R E N</text>
  </g>
</svg>
