<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chocolate bar splitting into equal shared pieces">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#dbe6f7"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <text x="20" y="30" font-family="Georgia, serif" font-size="16" fill="#2a3b55" font-weight="bold">The Fraction Bakery</text>

  <!-- chocolate bar splitting into 4 pieces, one flying off to a friend -->
  <g>
    <rect x="30" y="60" width="180" height="46" rx="4" fill="#5b3a29" stroke="#2a1b12" stroke-width="2"/>
    <line x1="75" y1="60" x2="75" y2="106" stroke="#2a1b12" stroke-width="2"/>
    <line x1="120" y1="60" x2="120" y2="106" stroke="#2a1b12" stroke-width="2"/>
    <line x1="165" y1="60" x2="165" y2="106" stroke="#2a1b12" stroke-width="2"/>

    <g>
      <rect x="165" y="60" width="45" height="46" fill="#7a4b34">
        <animate attributeName="x" values="165;250;250;165" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="60;130;130;60" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="272" cy="150" r="16" fill="#f4c98b" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <text x="30" y="128" font-family="Georgia, serif" font-size="13" fill="#2a3b55">1 bar ÷ 4 friends = 0.25 each</text>

  <!-- ratio strip -->
  <g transform="translate(30,140)">
    <rect x="0" y="0" width="26" height="18" fill="#b23a48"/>
    <rect x="28" y="0" width="26" height="18" fill="#b23a48"/>
    <rect x="58" y="0" width="26" height="18" fill="none" stroke="#2a3b55" stroke-width="1.5"/>
    <rect x="86" y="0" width="26" height="18" fill="none" stroke="#2a3b55" stroke-width="1.5"/>
    <rect x="114" y="0" width="26" height="18" fill="none" stroke="#2a3b55" stroke-width="1.5"/>
    <text x="150" y="14" font-family="Georgia, serif" font-size="12" fill="#2a3b55">2 : 3 ratio</text>
  </g>
</svg>
