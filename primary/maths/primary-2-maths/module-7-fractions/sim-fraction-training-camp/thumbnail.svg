<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A marker moving along a number line toward the halfway mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#dbe6f7"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <text x="20" y="30" font-family="Georgia, serif" font-size="15" fill="#233b57" font-weight="bold">Fraction Training Camp</text>

  <line x1="30" y1="80" x2="290" y2="80" stroke="#233b57" stroke-width="2"/>
  <line x1="30" y1="72" x2="30" y2="88" stroke="#233b57" stroke-width="2"/>
  <line x1="160" y1="72" x2="160" y2="88" stroke="#3f8f6b" stroke-width="2"/>
  <line x1="290" y1="72" x2="290" y2="88" stroke="#233b57" stroke-width="2"/>
  <text x="30" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#233b57">0</text>
  <text x="160" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3f8f6b">1/2</text>
  <text x="290" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#233b57">1</text>

  <circle cx="30" cy="80" r="8" fill="#3a6ea5">
    <animate attributeName="cx" values="30;225;225;30" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(30,120)">
    <rect x="0" y="0" width="30" height="24" fill="#3a6ea5"/>
    <rect x="32" y="0" width="30" height="24" fill="none" stroke="#233b57" stroke-width="1.5"/>
    <rect x="64" y="0" width="30" height="24" fill="none" stroke="#233b57" stroke-width="1.5"/>
    <rect x="96" y="24" width="30" height="24" fill="#3a6ea5" transform="translate(0,-24)"/>
    <text x="140" y="18" font-family="Georgia, serif" font-size="12" fill="#233b57">2/3 × 1/2</text>
  </g>
</svg>
