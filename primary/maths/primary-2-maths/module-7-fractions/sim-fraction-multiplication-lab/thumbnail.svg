<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An area-model grid shading columns and rows to show a fraction product">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#dbe6f7"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <text x="20" y="30" font-family="Georgia, serif" font-size="14" fill="#233b57" font-weight="bold">Multiplication Grid Lab</text>

  <g transform="translate(40,50)">
    <rect x="0" y="0" width="60" height="90" fill="#3a6ea5" opacity="0.35"/>
    <rect x="60" y="0" width="60" height="90" fill="#3a6ea5" opacity="0.35"/>
    <rect x="0" y="0" width="180" height="67.5" fill="#e0b64c" opacity="0.35"/>
    <rect x="0" y="0" width="120" height="67.5" fill="#3a6ea5">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <line x1="60" y1="0" x2="60" y2="90" stroke="#233b57" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="90" stroke="#233b57" stroke-width="1.5"/>
    <line x1="0" y1="22.5" x2="180" y2="22.5" stroke="#233b57" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="180" y2="45" stroke="#233b57" stroke-width="1.5"/>
    <line x1="0" y1="67.5" x2="180" y2="67.5" stroke="#233b57" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="90" fill="none" stroke="#233b57" stroke-width="2"/>
  </g>
  <text x="230" y="100" font-family="Georgia, serif" font-size="13" fill="#233b57">2/3 × 3/4</text>
  <text x="230" y="118" font-family="Georgia, serif" font-size="13" fill="#233b57">= 6/12</text>
</svg>
