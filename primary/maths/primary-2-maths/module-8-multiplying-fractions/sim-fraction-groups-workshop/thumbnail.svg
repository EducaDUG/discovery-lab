<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#c5d8f7"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)" rx="12"/>
  <!-- Fraction strip group 1 -->
  <g transform="translate(30,30)">
    <text x="0" y="12" font-family="system-ui" font-size="11" fill="#3a5a8c" font-weight="700">3 × 2/5</text>
    <!-- Strip 1 -->
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="20" height="16" rx="2" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="22" y="0" width="20" height="16" rx="2" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="44" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
      <rect x="66" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
      <rect x="88" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
    </g>
    <!-- Strip 2 -->
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="20" height="16" rx="2" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="22" y="0" width="20" height="16" rx="2" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="44" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
      <rect x="66" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
      <rect x="88" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
    </g>
    <!-- Strip 3 -->
    <g transform="translate(0,60)">
      <rect x="0" y="0" width="20" height="16" rx="2" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="22" y="0" width="20" height="16" rx="2" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="44" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
      <rect x="66" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
      <rect x="88" y="0" width="20" height="16" rx="2" fill="#ddd" stroke="#bbb" stroke-width="1"/>
    </g>
    <text x="0" y="95" font-family="system-ui" font-size="13" fill="#2d4a7a" font-weight="700">= 6/5 = 1 1/5</text>
  </g>
  <!-- Conversion visual -->
  <g transform="translate(170,30)">
    <text x="0" y="12" font-family="system-ui" font-size="11" fill="#3a5a8c" font-weight="700">7/2 → 3 ½</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="30" height="20" rx="3" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="34" y="0" width="30" height="20" rx="3" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="68" y="0" width="30" height="20" rx="3" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="102" y="0" width="15" height="20" rx="3" fill="#e88c30" stroke="#c67020" stroke-width="1"/>
      <rect x="117" y="0" width="15" height="20" rx="3" fill="#ddd" stroke="#bbb" stroke-width="1"/>
    </g>
    <text x="0" y="60" font-family="system-ui" font-size="10" fill="#5a7a9c">3 wholes + ½</text>
  </g>
  <!-- Ticket icon -->
  <g transform="translate(170,110)">
    <rect x="0" y="0" width="100" height="40" rx="6" fill="#fff" stroke="#3a5a8c" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="50" y="16" text-anchor="middle" font-family="system-ui" font-size="10" fill="#3a5a8c" font-weight="600">TICKET OFFICE</text>
    <text x="50" y="30" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6a8ab0">150 × 6/10 = ?</text>
  </g>
  <!-- Title badge -->
  <rect x="20" y="145" width="185" height="24" rx="12" fill="#3a5a8c"/>
  <text x="112" y="161" text-anchor="middle" font-family="system-ui" font-size="11" fill="#fff" font-weight="600">Fraction Groups Workshop</text>
</svg>
