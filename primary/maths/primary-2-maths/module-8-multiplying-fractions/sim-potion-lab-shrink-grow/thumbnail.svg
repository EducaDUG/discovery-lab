<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
    <linearGradient id="shrink" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="grow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)" rx="12"/>
  <!-- Stars -->
  <circle cx="30" cy="20" r="1.5" fill="#fcd34d" opacity=".6"/><circle cx="280" cy="30" r="1" fill="#fcd34d" opacity=".5"/>
  <circle cx="60" cy="160" r="1.2" fill="#fcd34d" opacity=".4"/><circle cx="250" cy="150" r="1.5" fill="#fcd34d" opacity=".6"/>
  <circle cx="150" cy="15" r="1" fill="#fcd34d" opacity=".5"/><circle cx="300" cy="90" r="1.3" fill="#fcd34d" opacity=".4"/>
  <!-- Shrink bottle -->
  <g transform="translate(70,30)">
    <rect x="16" y="2" width="14" height="10" rx="3" fill="#94a3b8"/>
    <path d="M10 18 Q10 12 16 12 H30 Q36 12 36 18 V70 Q36 80 23 80 Q10 80 10 70 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="12" y="40" width="22" height="38" rx="2" fill="url(#shrink)" opacity=".85"/>
    <text x="23" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="white">↓</text>
    <text x="23" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#c084fc">× ½</text>
  </g>
  <!-- Balance beam -->
  <g transform="translate(130,70)">
    <polygon points="30,58 22,72 38,72" fill="#94a3b8"/>
    <rect x="0" y="52" width="60" height="6" rx="3" fill="#6366f1" transform="rotate(-8,30,55)"/>
    <text x="30" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#a5b4fc">&lt; = &gt;</text>
  </g>
  <!-- Grow bottle -->
  <g transform="translate(210,25)">
    <rect x="16" y="2" width="14" height="10" rx="3" fill="#94a3b8"/>
    <path d="M10 18 Q10 12 16 12 H30 Q36 12 36 18 V75 Q36 85 23 85 Q10 85 10 75 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="12" y="28" width="22" height="55" rx="2" fill="url(#grow)" opacity=".85"/>
    <text x="23" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="white">↑</text>
    <text x="23" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#6ee7b7">× ³⁄₂</text>
  </g>
  <!-- Title -->
  <text x="160" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="white">The Potion Lab</text>
  <!-- Gems -->
  <polygon points="45,140 50,132 55,140 52,148 48,148" fill="#a855f7" stroke="#7c3aed" stroke-width="1"/>
  <polygon points="265,140 270,132 275,140 272,148 268,148" fill="#10b981" stroke="#059669" stroke-width="1"/>
</svg>
