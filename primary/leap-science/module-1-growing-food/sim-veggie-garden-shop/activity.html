  }
  function ladyFlyIn() { const w = $(`<div class="ladyfly" aria-hidden="true">🐞 🐞 🐞 🐞 🐞</div>`); view.append(w); setTimeout(() => w.remove(), 3200); }
  function callBugs() { if (M.respondPest(g)) { pop("-" + CH(M.pestCost(g)), "neg"); ladyFlyIn(); say(L("The ladybirds are here! 🐞 Look at them eat the bugs. No chemicals needed!", "¡Llegaron las mariquitas! 🐞 Mira cómo se comen los bichos. ¡No hacen falta productos químicos!"), "good"); mark("bugs"); sync(); api.save(); } }
  function showBugBtn() { if (q("#bugbtn")) return; const b = $(`<button class="gh-go gh-go--warn" id="bugbtn" style="margin-bottom:6px;min-height:44px">${L("Call the ladybirds 🐞", "Llama a las mariquitas 🐞")}</button>`); b.addEventListener("click", () => { b.remove(); callBugs(); }); act.querySelector("#go").parentElement.prepend(b); }
  function payPart(kind, amt) { const pd = g.pending; if (!pd) return; amt = Math.min(amt, pd[kind]); if (amt <= 0) return; pd[kind] -= amt; g.cash += amt; if (pd.shop + pd.van < 0.01) g.pending = null; pop("+" + CH(amt), "cash"); sync(); api.save(); }
  function settle(r) {
    const pd = g.pending; rt.crateN = Math.min(18, Math.max(3, Math.round(r.sold / 25))); scene3d?.goto("shop");
    const finish = () => { M.flush(g, "all"); rt.crateN = 0; scene3d?.goto(st.cam); if (!M.canStart(g) && !g.batch) say(L("The year is over. Press the big button to start a new year!", "El año terminó. ¡Pulsa el botón grande para empezar un año nuevo!"), "good"); sync(); api.save(); };
    if (!pd) { finish(); return; }
    const nC = g.shop ? Math.min(8, 2 + 2 * g.shop) : 0, per = nC ? pd.shop / nC : 0, vanAmt = pd.van; const guard = setTimeout(finish, 20000);
    for (let i = 0; i < nC; i++) setTimeout(() => { const go = () => { payPart("shop", per); rt.burst?.("coins", [34, 2.4, 5.5]); }; if (scene3d && rt.sendCustomer) rt.sendCustomer(go); else go(); }, i * 900);
    setTimeout(() => { const go = () => { payPart("van", vanAmt); rt.burst?.("coins", [21, 2.4, 9.5]); rt.crateN = 0; clearTimeout(guard); setTimeout(finish, 500); }; if (scene3d && rt.sendVan) rt.sendVan(go); else setTimeout(go, 1200); }, nC * 900 + 600);
  }
  function onHarvest(r) {
    q("#bugbtn")?.remove(); const baskets = Math.round(r.sold / BASKET), each = Math.round(r.price * BASKET / 5);
    say(L(`You grew ${Math.round(r.kg / BASKET)} baskets! You sell ${baskets} baskets for ${each} coins each: ${baskets} × ${each} = ${COINS(r.revenue)} coins!${r.spoil > BASKET ? " Some veggies were left over. A bigger stall sells more!" : ""}`, `¡Cultivaste ${Math.round(r.kg / BASKET)} cestas! Vendes ${baskets} cestas a ${each} monedas cada una: ${baskets} × ${each} = ¡${COINS(r.revenue)} monedas!${r.spoil > BASKET ? " Sobraron verduras. ¡Un puesto más grande vende más!" : ""}`), "good");
    mark("grow"); settle(r);
  }
  q("#go").addEventListener("click", () => {
    if (g.batch) { start(); return; }
    if (!M.canStart(g)) { M.newYear(g); say(L("A new year! The seeds are ready again.", "¡Un año nuevo! Las semillas están listas otra vez.")); sync(); api.save(); return; }
    const ev = M.startBatch(g); if (!ev) return; rt.crateN = 0; rt.burst?.("green"); M.flush(g, "all");
    say(L("Seeds planted! Watch your plants grow. 🌱", "¡Semillas plantadas! Mira cómo crecen tus plantas. 🌱"), "good"); start(); });
  q("#pause").addEventListener("click", () => { if (rt.running) stop(); else start(); });

  host.append(root); renderTop(); if (g.pending) M.flush(g, "all");
  if (g.batch) say(L("Welcome back! Press the big button to keep growing.", "¡Bienvenido de nuevo! Pulsa el botón grande para seguir creciendo."));
  else say(L("Hello, farmer! You have one garden bed and 50 coins. Plant veggies and sell them to build your farm!", "¡Hola, granjero! Tienes un huerto y 50 monedas. ¡Planta verduras y véndelas para hacer crecer tu granja!"));
  sync();
  initScene(view, g, rt).then(s => { scene3d = s; if (s) s.goto(st.cam); else view.prepend($(`<div class="gh-nogl">${L("The 3D farm cannot show on this device, but you can still play!", "La granja en 3D no se ve en este dispositivo, ¡pero puedes jugar!")}</div>`)); }).catch(e => console.error("3D scene failed", e));
  window.__gh = { g, st, M, rt, sync };
}

mountExternalActivity({ simulation: mkSim }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});

</script>
</body>
</html>
