  const careCard = $(`<div class="gh-card"><h3>${L("2 · Help my plants", "2 · Ayudo a mis plantas")}${H(L("A plant can only grow as much as its SMALLEST need. Look for the sad face and fix it!", "Una planta solo crece tanto como su necesidad MÁS PEQUEÑA. ¡Busca la carita triste y arréglala!"))}</h3>
    <div class="gh-seg gh-seg--s" id="seg-view"></div><div class="need" id="need"></div>
    ${KC.map(c => `<div class="kc" data-k="${c.k}"><h4><span>${c.ico}</span>${c.n}${H(c.h)}<span class="face"></span></h4><div class="opts">${c.opts.map(o => `<button type="button" data-v="${o[0]}" aria-pressed="false">${o[1]}</button>`).join("")}</div><div class="bar"><i></i></div></div>`).join("")}
    <div class="gh-note" id="care-note"></div></div>`);

  /* ---------- shop for my farm ---------- */
  const BUY = [
    { w: "field", n: L("Garden bed", "Huerto"), h: L("A new bed to grow veggies outside. Sun and rain are free, but frost can hurt plants.", "Un huerto nuevo para cultivar al aire libre. El sol y la lluvia son gratis, pero la helada daña las plantas.") },
    { w: "poly", n: L("Greenhouse", "Invernadero"), h: L("A greenhouse is a warm house for plants, made of plastic or glass. It keeps the warmth in so plants can grow even when it is cold outside.", "Un invernadero es una casa cálida para plantas, de plástico o vidrio. Guarda el calor para que crezcan aunque haga frío fuera.") },
    { w: "shop", n: L("Farm stall", "Puesto de la granja"), h: L("People visit your stall to buy fresh veggies. They pay more than the market! Make the stall bigger to sell more.", "La gente visita tu puesto para comprar verduras frescas. ¡Pagan más que en el mercado! Haz el puesto más grande para vender más.") },
    { w: "sign", n: L("My sign", "Mi cartel"), h: L("A sign by the road with your name. More people will find your farm.", "Un cartel junto a la carretera con tu nombre. Más gente encontrará tu granja.") },
  ];
  const shopCard = $(`<div class="gh-card" id="buycard"><h3>${L("3 · Shop for my farm", "3 · Tienda para mi granja")}</h3>
    <div class="gh-note"><label for="brand-in">${L("My name", "Mi nombre")}</label>${H(L("Type your name. It will be on your sign: 'Gautam's veggies'.", "Escribe tu nombre. Saldrá en tu cartel: 'Verduras de Gautam'."))}</div>
    <input type="text" id="brand-in" class="gh-in" maxlength="14" placeholder="${L("Type your name", "Escribe tu nombre")}" value="${esc(g.brand || "")}" autocomplete="off">
    <div class="gh-note" id="brand-prev"></div>
    ${BUY.map(b => `<div class="gh-buy" data-w="${b.w}"><div class="gh-buy__t"><span><b>${b.n}</b><small class="own"></small>${H(b.h)}</span></div><button type="button" class="gh-buybtn"></button></div>`).join("")}</div>`);
  const ledCard = $(`<div class="gh-card" id="ledcard" hidden><h3>${L("My sales", "Mis ventas")}</h3><div id="led" class="gh-note"></div></div>`);
  right.append(cropsCard, careCard, shopCard, ledCard);
  [["overview", L("My farm", "Mi granja")], ["inside", L("Inside", "Dentro")], ["shop", L("My stall", "Mi puesto")], ["river", L("River", "Río")]].forEach(([id, n]) => { const b = $(`<button class="gh-cam" aria-pressed="${st.cam === id}">${n}</button>`); b.addEventListener("click", () => { st.cam = id; cams.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); scene3d?.goto(id); }); cams.append(b); });

  /* ---------- paint ---------- */
  const WHY = { max: L("Biggest!", "¡Máximo!"), owned: L("Got it", "Listo"), busy: L("After harvest", "Tras cosechar"), full: L("No room", "Sin sitio"), none: "–" };
  const TN2 = { field: L("Garden", "Huerto"), poly: L("Greenhouse", "Invernadero"), glass: L("Glass house", "Casa de vidrio") };
  const NEED = { light: L("sun", "sol"), temp: L("warmth", "calor"), water: L("water", "agua"), co2: L("air", "aire") };
  const face = f => f < 0.45 ? "😞" : f < 0.85 ? "😐" : "😀";
  function sync() {
    g.method = "organic"; g.gardeners = M.needGardeners(g);
    q("#s-cash").textContent = COINS(g.cash); q("#s-cash").classList.toggle("neg", g.cash < 0);
    q("#s-rep").textContent = "❤️ " + Math.round(g.rep); q("#s-repbar").style.width = g.rep + "%";
    const w = M.weather(Math.min(g.day, M.YEAR_DAYS - 1), g.seed); q("#s-day").textContent = (g.day + 1) + " " + (w.sun > 0.55 ? "☀️" : w.sun > 0.3 ? "⛅" : "☁️") + (w.tOut < 5 ? " ❄️" : "");
    const pst = g.batch && g.batch.pest; q("#s-pest").textContent = !pst ? "😊" : (pst.done ? "🐞" : "🐛 !"); q("#st-pest").classList.toggle("alert", !!pst && !pst.done);
    q("#crops").querySelectorAll("button").forEach(b => { b.setAttribute("aria-pressed", String(g.crop === b.dataset.v)); b.disabled = !!g.batch; });
    const cs = M.cur(g, st.view), d = cs.d, hasHouse = g.slots.some(x => x !== "field");
    const types = ["field", "poly", "glass"].filter(t => M.count(g, t)); q("#seg-view").innerHTML = types.length > 1 ? types.map(t => `<button data-v="${t}" aria-pressed="${t === cs.type}">${TN2[t]}</button>`).join("") : "";
    KC.forEach(c => { const el = q(`.kc[data-k="${c.k}"]`), f = d.f[c.f], off = c.house && !hasHouse;
      el.classList.toggle("off", off); el.classList.toggle("lim", d.lim === c.f && f < 0.95);
      el.querySelectorAll(".opts button").forEach(b => { b.setAttribute("aria-pressed", String(+b.dataset.v === g.s[c.k])); b.disabled = off; });
      el.querySelector(".face").textContent = face(f); el.querySelector(".bar i").style.width = (f * 100) + "%"; });
    const worst = d.g < 0.95 ? L(`My plants need more: ${NEED[d.lim]}!`, `Mis plantas necesitan más: ${NEED[d.lim]}.`) : L("Happy plants! 🌱", "¡Plantas felices! 🌱");
    q("#need").textContent = worst + (cs.type === "field" ? " " + L("(The weather gives sun and warmth outside.)", "(Fuera, el clima da sol y calor.)") : "");
    q("#care-note").textContent = hasHouse ? "" : L("Build a greenhouse to use the sun lamp and the heater.", "Construye un invernadero para usar la lámpara y el calefactor.");
    const burn = cs.cost.total; q("#s-burn").textContent = g.batch ? "-" + COINS(burn) + "/" + L("day", "día") : "";
    q("#brand-prev").textContent = g.brand ? L(`Sign: "${g.brand}'s veggies"`, `Cartel: "Verduras de ${g.brand}"`) : "";
    BUY.forEach(b => { const row = q(`.gh-buy[data-w="${b.w}"]`), btn = row.querySelector(".gh-buybtn");
      if (b.w === "sign") { btn.textContent = g.ads.sign ? L("Got it", "Listo") : COINS(M.AD_SIGN.cost) + " 🪙"; btn.disabled = g.ads.sign || g.cash < M.AD_SIGN.cost; row.querySelector(".own").textContent = ""; return; }
      const c = M.canBuy(g, b.w), pr = M.price(g, b.w);
      row.querySelector(".own").textContent = b.w === "shop" ? " " + (g.shop ? [ "", L("little stall", "puestito"), L("stall", "puesto"), L("big stall", "puesto grande"), L("farm market", "mercado")][g.shop] : L("not built", "sin construir")) : " ×" + M.count(g, b.w);
      btn.textContent = (c.ok || c.why === "cash") ? COINS(pr) + " 🪙" : (WHY[c.why] || "–"); btn.disabled = !c.ok; });
    const go = q("#go"), can = M.canStart(g), days = M.batchDays(g.method, g.crop);
    if (g.batch) { go.textContent = rt.running ? L(`Growing… day ${g.batch.d} of ${g.batch.days}`, `Creciendo… día ${g.batch.d} de ${g.batch.days}`) : L("Keep growing!", "¡Sigue creciendo!"); go.disabled = rt.running; }
    else if (!can) { go.textContent = L("A new year starts! 🌱", "¡Empieza un año nuevo! 🌱"); go.disabled = false; }
    else { go.textContent = L(`Plant ${CN[g.crop].toLowerCase()}! 🌱`, `¡Planta ${CN[g.crop].toLowerCase()}! 🌱`); go.disabled = false; }
    q("#pause").hidden = !g.batch; q("#pause").textContent = rt.running ? L("Pause", "Pausa") : L("Go", "Seguir");
    q("#b-prog").style.width = (g.batch ? g.batch.d / g.batch.days * 100 : 0) + "%";
    if (g.ledger.length) { ledCard.hidden = false; const r = g.ledger[g.ledger.length - 1]; q("#led").textContent = L(`Last time: ${Math.round(r.kg / BASKET)} baskets grown, ${Math.round(r.sold / BASKET)} sold, ${COINS(r.revenue)} coins earned, ${COINS(r.costs)} coins spent.`, `Última vez: ${Math.round(r.kg / BASKET)} cestas cultivadas, ${Math.round(r.sold / BASKET)} vendidas, ${COINS(r.revenue)} monedas ganadas, ${COINS(r.costs)} monedas gastadas.`); } else ledCard.hidden = true;
  }

  /* ---------- actions ---------- */
  q("#crops").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled) return; g.crop = b.dataset.v; sync(); api.save(); });
  q("#seg-view").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; st.view = b.dataset.v; rt.view = st.view; sync(); api.save(); });
  careCard.addEventListener("click", e => { const b = e.target.closest(".opts button"); if (!b || b.disabled) return; const k = b.closest(".kc").dataset.k; g.s[k] = +b.dataset.v; sync(); api.save(); });
  q("#brand-in").addEventListener("input", e => { g.brand = e.target.value.trim().slice(0, 14); sync(); api.save(); });
  const BMSG = { field: L("A new garden bed! More veggies to grow.", "¡Un huerto nuevo! Más verduras para cultivar."), poly: L("Your greenhouse is ready! Now you can use the sun lamp and the heater.", "¡Tu invernadero está listo! Ahora puedes usar la lámpara y el calefactor."), shop: L("Your stall is open! Shoppers will come to buy your veggies.", "¡Tu puesto está abierto! Los clientes vendrán a comprar tus verduras.") };
  shopCard.addEventListener("click", e => { const btn = e.target.closest(".gh-buybtn"); if (!btn || btn.disabled) return; const w = btn.closest(".gh-buy").dataset.w;
    if (w === "sign") { if (!g.brand) { const bi = q("#brand-in"); bi.classList.add("shake"); bi.focus(); setTimeout(() => bi.classList.remove("shake"), 900); say(L("Type your name first!", "¡Escribe primero tu nombre!"), "bad"); return; }
      if (M.buySign(g)) { pop("-" + COINS(M.AD_SIGN.cost) + " 🪙", "neg"); say(L(`Your sign says "${g.brand}'s veggies"!`, `¡Tu cartel dice "Verduras de ${g.brand}"!`), "good"); scene3d?.goto("sign"); setTimeout(() => scene3d?.goto(st.cam), 3400); mark("sign"); sync(); api.save(); } return; }
    const r = M.buy(g, w); if (!r.ok) return; pop("-" + COINS(r.cost) + " 🪙", "neg"); say(BMSG[w], "good");
    if (r.slot >= 0) { scene3d?.goto("site", r.slot); setTimeout(() => scene3d?.goto(st.cam), 3400); } else { scene3d?.goto("shop"); setTimeout(() => scene3d?.goto(st.cam), 3400); }
    if (w === "poly") mark("greenhouse"); if (w === "shop") mark("shop"); sync(); api.save(); });

  function tick() {
    if (!g.batch) { stop(); return; }
    rt.pulse = 1; const cs = M.cur(g); const ev = M.stepDay(g); ev.forEach(handle); sync(); api.save(); if (!g.batch) stop();
  }
  function start() { stop(); rt.running = true; rt.timer = setInterval(tick, 380); sync(); }
  function stop() { rt.running = false; clearInterval(rt.timer); rt.timer = null; sync(); }
  function handle(e) {
    if (e.t === "pest") { stop(); showPest(); }
    else if (e.t === "ladybirds-working") say(L("The ladybirds are eating the bugs!", "¡Las mariquitas se comen los bichos!"), "good");
    else if (e.t === "storm") { rt.shake?.(); say(L("A windy storm shook the greenhouse! Some plants got hurt.", "¡Una tormenta de viento sacudió el invernadero! Algunas plantas se dañaron."), "bad"); }
    else if (e.t === "harvest") onHarvest(e.row);
  }
  function showPest() {
    const bn = $(`<div class="gh-banner alert"><div><h3>${L("Bug alert! 🐛", "¡Alerta de bichos! 🐛")}</h3><p>${L("Tiny green bugs called aphids are eating the leaves. Ladybirds love to eat aphids!", "Unos bichitos verdes llamados pulgones se comen las hojas. ¡A las mariquitas les encanta comer pulgones!")}</p>
      <div class="gh-2"><button class="gh-go gh-go--warn" id="r-act">${L(`Call the ladybirds! 🐞 (${COINS(M.pestCost(g))} 🪙)`, `¡Llama a las mariquitas! 🐞 (${COINS(M.pestCost(g))} 🪙)`)}</button><button class="gh-go gh-go--ghost" id="r-skip">${L("Wait", "Esperar")}</button></div></div></div>`);
    bn.querySelector("#r-act").addEventListener("click", () => { callBugs(); bn.remove(); start(); });
    bn.querySelector("#r-skip").addEventListener("click", () => { bn.remove(); say(L("The bugs keep eating. You can still call the ladybirds!", "Los bichos siguen comiendo. ¡Aún puedes llamar a las mariquitas!"), "bad"); showBugBtn(); start(); });
    view.append(bn);
  }
  function callBugs() { if (M.respondPest(g)) { say(L("The ladybirds are here! 🐞 They eat the bugs. No chemicals needed!", "¡Llegaron las mariquitas! 🐞 Se comen los bichos. ¡No hacen falta productos químicos!"), "good"); mark("bugs"); sync(); api.save(); } }
  function showBugBtn() { if (q("#bugbtn")) return; const b = $(`<button class="gh-go gh-go--warn" id="bugbtn" style="margin-bottom:6px;min-height:40px">${L("Call the ladybirds 🐞", "Llama a las mariquitas 🐞")}</button>`); b.addEventListener("click", () => { b.remove(); callBugs(); }); act.querySelector("#go").parentElement.prepend(b); }
  function payPart(kind, amt) { const pd = g.pending; if (!pd) return; amt = Math.min(amt, pd[kind]); if (amt <= 0) return; pd[kind] -= amt; g.cash += amt; if (pd.shop + pd.van < 0.01) g.pending = null; pop("+" + COINS(amt) + " 🪙", "cash"); sync(); api.save(); }
  function settle(r) {
    const pd = g.pending; rt.crateN = Math.min(18, Math.max(3, Math.round(r.sold / 25))); scene3d?.goto("shop");
    const finish = () => { M.flush(g, "all"); rt.crateN = 0; scene3d?.goto(st.cam); if (!M.canStart(g) && !g.batch) say(L("The year is over. Press the big button to start a new year!", "El año terminó. ¡Pulsa el botón grande para empezar un año nuevo!"), "good"); sync(); api.save(); };
    if (!pd) { finish(); return; }
    const nC = g.shop ? Math.min(8, 2 + 2 * g.shop) : 0, per = nC ? pd.shop / nC : 0, vanAmt = pd.van; const guard = setTimeout(finish, 20000);
    for (let i = 0; i < nC; i++) setTimeout(() => { const go = () => { payPart("shop", per); rt.burst?.("coins", [34, 2.4, 5.5]); }; if (scene3d && rt.sendCustomer) rt.sendCustomer(go); else go(); }, i * 900);
    setTimeout(() => { const go = () => { payPart("van", vanAmt); rt.burst?.("coins", [21, 2.4, 9.5]); rt.crateN = 0; clearTimeout(guard); setTimeout(finish, 500); }; if (scene3d && rt.sendVan) rt.sendVan(go); else setTimeout(go, 1200); }, nC * 900 + 600);
  }
  function onHarvest(r) {
    q("#bugbtn")?.remove(); const baskets = Math.round(r.sold / BASKET), price = Math.round(r.price * BASKET / 10 * 10) / 10;
    say(L(`You grew ${Math.round(r.kg / BASKET)} baskets! You sell ${baskets} baskets for about ${price} coins each = ${COINS(r.revenue)} coins!${r.spoil > BASKET ? " Some veggies were left over. A bigger stall sells more!" : ""}`, `¡Cultivaste ${Math.round(r.kg / BASKET)} cestas! Vendes ${baskets} cestas a unas ${price} monedas cada una = ¡${COINS(r.revenue)} monedas!${r.spoil > BASKET ? " Sobraron verduras. ¡Un puesto más grande vende más!" : ""}`), "good");
    mark("grow"); settle(r);
  }
  q("#go").addEventListener("click", () => {
    if (g.batch) { start(); return; }
    if (!M.canStart(g)) { M.newYear(g); say(L("A new year! The seeds are ready again.", "¡Un año nuevo! Las semillas están listas otra vez.")); sync(); api.save(); return; }
    const ev = M.startBatch(g); if (!ev) return; rt.crateN = 0; rt.burst?.("green"); M.flush(g, "all");
    say(L("Seeds planted! Watch your plants grow. 🌱", "¡Semillas plantadas! Mira cómo crecen tus plantas. 🌱"), "good"); start(); });
  q("#pause").addEventListener("click", () => { if (rt.running) stop(); else start(); });

  host.append(root); renderTop(); if (g.pending) M.flush(g, "all");
  if (g.batch) say(L("Welcome back! Press the big button to keep growing.", "¡Bienvenido de nuevo! Pulsa el botón grande para seguir creciendo."));
  else say(L("Hello, farmer! You have one garden bed and 25 coins. Plant veggies and sell them to build your farm!", "¡Hola, granjero! Tienes un huerto y 25 monedas. ¡Planta verduras y véndelas para hacer crecer tu granja!"));
  sync();
  initScene(view, g, rt).then(s => { scene3d = s; if (s) s.goto(st.cam); else view.prepend($(`<div class="gh-nogl">${L("The 3D farm cannot show on this device, but you can still play!", "La granja en 3D no se ve en este dispositivo, ¡pero puedes jugar!")}</div>`)); }).catch(e => console.error("3D scene failed", e));
  window.__gh = { g, st, M, rt, sync };
}

mountExternalActivity({ simulation: mkSim }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});

</script>
</body>
</html>
