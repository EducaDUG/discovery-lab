    const { P, Lk } = layout(shape), on = new Set(["srv"]), prev = {}; const alive = Lk.filter(l => !cut[l[0]]);
    if (shape === "ring" && Lk.some(l => cut[l[0]])) return { on: new Set(), prev: {}, ring: false };
    const q = ["srv"]; while (q.length) { const c = q.shift(); alive.forEach(l => { const o = l[1] === c ? l[2] : l[2] === c ? l[1] : null; if (o && !on.has(o)) { on.add(o); prev[o] = c; q.push(o); } }); }
    return { on, prev, ring: shape === "ring" };
  }
  const cutNow = () => (st.cuts[st.shape + "_now"] ??= {});
  function buildShapes() {
    const shape = st.shape, { P, Lk } = layout(shape), cut = cutNow(); S.cam({ t: [shape === "bus" ? -2 : 0, 0, 0], az: 0, pol: 1.0, d: shape === "bus" ? 21 : 18 });
    P.forEach(p => S.node(p[0], p[1], p[2], p[3], { label: p[4] || undefined, state: "ok", h: p[1] === "pc" ? 2 : 1.5 }));
    Lk.forEach(l => { S.link(l[0], l[1], l[2], { col: 0xff5fa8 }); if (cut[l[0]]) S.cut(l[0]); }); paint();
  }
  function paint() { const shape = st.shape, { P } = layout(shape), o = online(shape, cutNow()); let n = 0;
    P.forEach(p => { if (p[1] !== "pc") return; const on = o.on.has(p[0]); if (on) n++; S.state(p[0], on ? "ok" : "bad"); S.label(p[0], LET["p0p1p2p3p4".indexOf(p[0]) / 2] + (on ? "" : " ✗"), on ? "" : "r"); });
    if (rt.onl) rt.onl.textContent = n + " / 5"; return o; }
  function ping() { const o = online(st.shape, cutNow()); if (o.ring) { const ids = layout("ring").P.map(p => p[0]); ids.push("srv"); S.send(ids, { dur: 2600, col: 0xffd23f }); return; }
    Object.keys(o.prev).forEach((id, i) => { if (!id.startsWith("p")) return; const path = [id]; while (path[0] !== "srv") path.unshift(o.prev[path[0]]); later(() => S.send(path, { dur: 500 + path.length * 280, col: 0x2bf0a0 }), i * 260); }); }
  panels.shapes.append((() => {
    const cA = card(L("Pick a shape, then cut a cable", "Elige una forma y corta un cable")), cB = card(L("Computers online", "Ordenadores conectados"));
    const cuts = $(`<div class="ar-chips"></div>`); const big = $(`<div class="ar-big" style="--c:#ff5fa8">5 / 5</div>`); rt.onl = big;
    const drawCuts = () => { cuts.innerHTML = ""; layout(st.shape).Lk.forEach((l, i) => { const on = !!cutNow()[l[0]]; const b = $(`<button class="ar-chip" aria-pressed="${on}" style="--ac:#ff4060;min-height:44px">✂ ${i + 1}</button>`); b.addEventListener("click", () => toggle(l[0])); cuts.append(b); }); };
    const toggle = id => { const cut = cutNow(); if (cut[id]) { delete cut[id]; S.mend(id); } else { cut[id] = true; S.cut(id); st.cuts[st.shape] = true; gain(3); }
      api.save(); const o = paint(); drawCuts(); const dead = 5 - [...o.on].filter(x => x.startsWith("p")).length;
      say(!cut[id] ? L("Cable fixed.", "Cable arreglado.") : st.shape === "ring" ? L("A ring breaks everywhere: everyone is cut off!", "Un anillo se rompe por completo: ¡todos sin red!") : dead ? L(`${dead} computer${dead > 1 ? "s" : ""} cut off, the rest keep working.`, `${dead} ordenador${dead > 1 ? "es" : ""} sin red, los demás siguen.`) : L("Still connected!", "¡Sigue conectado!"), cut[id] ? "bad" : "good");
      if (["star", "bus", "ring"].every(k => st.cuts[k])) mark("shapes"); };
    rt.pick = (kind, id) => { if (st.tab === "shapes" && kind === "link") toggle(id); else if (st.tab === "hub" && kind === "node" && id[0] === "p") { const i = +id[1]; if (i !== hs.from) { hs.to = i; rt.hubSync(); } } };
    const shp = seg([["star", L("Star", "Estrella")], ["bus", "Bus"], ["ring", L("Ring", "Anillo")]], () => st.shape, id => { st.shape = id; api.save(); token++; killTimers(); buildShapes(); drawCuts(); every(ping, 2800); ping(); say({ star: L("Star: every computer has its own cable.", "Estrella: cada ordenador tiene su cable."), bus: L("Bus: one long cable for everyone.", "Bus: un cable largo para todos."), ring: L("Ring: neighbours pass data along.", "Anillo: los vecinos se pasan los datos.") }[id]); });
    const fix = btn(L("Fix all cables", "Arreglar todos"), "ar-go ar-go--ghost"); fix.addEventListener("click", () => { st.cuts[st.shape + "_now"] = {}; api.save(); buildShapes(); drawCuts(); say(L("All cables fixed.", "Todos los cables arreglados."), "good"); });
    cA.append(shp, cuts, fix); cB.append(big, $(`<p style="margin:10px 0 0;font-weight:800;color:#8fa7d8;font-size:.85rem">${L("Tap a cable in the city, or the scissors.", "Toca un cable en la ciudad, o las tijeras.")}</p>`)); rt.drawCuts = drawCuts; drawCuts();
    const w = $(`<div style="display:contents"></div>`); w.append(cA, cB); return w;
  })());

  /* ---------- station switching ---------- */
  function killTimers() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
  function select(id) {
    st.tab = id; api.save(); token++; killTimers(); if (rt.speedReset) rt.speedReset();
    stationsEl.querySelectorAll(".ar-st").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === id))); Object.entries(panels).forEach(([k, p]) => p.hidden = k !== id);
    S.clear();
    if (id === "speed") { buildSpeed(); say(L("Pick the fastest connection, then press GO!", "Elige la conexión más rápida y pulsa GO!")); }
    if (id === "hub") { buildHub(); rt.hubSync(); say(L("Send a message from one computer to another.", "Envía un mensaje de un ordenador a otro.")); }
    if (id === "router") { buildRouter(); say(rt.routerHint()); }
    if (id === "shapes") { buildShapes(); rt.drawCuts(); every(ping, 2800); ping(); say(L("Tap a cable to cut it!", "¡Toca un cable para cortarlo!")); }
  }
  host.append(root); renderTop();
  const first = st.tab; select(first);
  initScene(view, rt).then(s => { if (s) { S = s; select(st.tab); } else view.prepend($(`<div class="ar-nogl">${L("3D view is not available on this device, but every control below still works.", "La vista 3D no está disponible en este dispositivo, pero todos los controles funcionan.")}</div>`)); })
    .catch(e => console.error("3D scene failed", e));
}

mountExternalActivity({ simulation: mkSim }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script></body></html>
