  const top = $(`<div class="ar-top"><div class="ar-rank"><div class="ar-rank__badge">1</div><div><div class="ar-rank__name"></div><div class="ar-xpbar"><i></i></div><div class="ar-xp"></div></div></div><div class="ar-miss" aria-live="polite"></div></div>`);
  const view = $(`<div class="ar-view"><div class="ar-hint">${L("Drag to look around", "Arrastra para mirar")}</div><div class="ar-msg" role="status"></div></div>`);
  const msgEl = view.querySelector(".ar-msg"), stationsEl = $(`<div class="ar-stations" role="tablist"></div>`), dock = $(`<div class="ar-dock"></div>`);
  root.append(top, view, stationsEl, dock);
  const say = (t, k = "") => { msgEl.className = "ar-msg " + k; msgEl.textContent = t; };
  const pop = text => { const p = $(`<div class="ar-pop">${text}</div>`); view.append(p); setTimeout(() => p.remove(), 1150); };
  const shake = el => { if (!el) return; el.classList.remove("nc-shake"); void el.offsetWidth; el.classList.add("nc-shake"); setTimeout(() => el.classList.remove("nc-shake"), 520); };
  const rankOf = xp => { let r = 0; RANKS.forEach((x, i) => { if (xp >= x[0]) r = i; }); return r; };
  const subDone = k => SUB[k].every(s => st.sub[k]?.[s]);
  function renderTop() {
    const r = rankOf(st.xp), lo = RANKS[r][0], hi = RANKS[r + 1] ? RANKS[r + 1][0] : lo + 60;
    top.querySelector(".ar-rank__badge").textContent = r + 1; top.querySelector(".ar-rank__name").textContent = RANKS[r][1];
    top.querySelector(".ar-xpbar i").style.width = Math.min(100, (st.xp - lo) / (hi - lo) * 100) + "%";
    top.querySelector(".ar-xp").textContent = `${st.xp} XP` + (RANKS[r + 1] ? ` · ${hi}` : " · MAX");
    top.querySelector(".ar-miss").innerHTML = Object.keys(ST).map(k => `<span class="ar-m ${st.explored[k] ? "done" : ""}">${ST[k].n()}</span>`).join("");
  }
  function gain(n) { const before = rankOf(st.xp); st.xp += n; pop(`+${n} XP`); renderTop(); api.save();
    if (rankOf(st.xp) > before) setTimeout(() => { pop(`${L("RANK UP", "SUBES DE RANGO")}: ${RANKS[rankOf(st.xp)][1]}`); }, 500); }
  function mark(k) { if (st.explored[k]) return; st.explored[k] = true; gain(30); renderTop();
    if (Object.keys(ST).every(x => st.explored[x]) && !view.querySelector(".ar-banner")) {
      const b = $(`<div class="ar-banner"><div><h3>${L("NETWORK ONLINE!", "¡RED EN LÍNEA!")}</h3><p>${L("Now prove it in the quiz!", "¡Ahora demuéstralo en el cuestionario!")}</p><button class="btn btn--primary">${L("Go to the quiz", "Ir al cuestionario")}</button></div></div>`);
      b.querySelector("button").addEventListener("click", () => { b.remove(); document.querySelector(".q")?.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }); }); view.append(b); } }
  function tick(sk, key) { st.sub[sk] ??= {}; if (!st.sub[sk][key]) { st.sub[sk][key] = true; gain(10); api.save(); } renderSubs(); if (subDone(sk)) mark(sk); }
  const subEls = {};
  function renderSubs() { Object.keys(subEls).forEach(k => { subEls[k].innerHTML = SUB[k].map(s => `<span class="ar-m ${st.sub[k]?.[s] ? "done" : ""}">${L(...SUBL[s])}</span>`).join(""); }); }
  const subBar = k => { const d = $(`<div class="ar-miss nc-sub"></div>`); subEls[k] = d; return d; };
  const IC = (svg, c) => `<span class="nc-ico" style="--c:${c}">${svg}</span>`;

  const panels = {};
  Object.keys(ST).forEach(id => { const t = ST[id]; const b = $(`<button class="ar-st" role="tab" style="--c:${t.c}"><span>${t.n()}</span></button>`); b.dataset.id = id;
    b.insertAdjacentHTML("afterbegin", ({ mac: "🔖", ip: "🏠", pkt: "📦", srv: "🗄️", fix: "🛠️" })[id]); b.addEventListener("click", () => select(id)); stationsEl.append(b);
    const p = $(`<div class="ar-panel" role="tabpanel" style="--c:${t.c}"></div>`); panels[id] = p; dock.append(p); });
  function select(id) { st.tab = id; api.save(); stationsEl.querySelectorAll(".ar-st").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === id)));
    Object.entries(panels).forEach(([k, p]) => p.hidden = k !== id); s3?.goto(id); if (id === "pkt") pktIdle(); }

  /* ===== 1. MAC ===== */
  (() => {
    const p = panels.mac, card = $(`<div class="ar-card"></div>`), side = $(`<div class="ar-card"><h3>${L("Who made it?", "¿Quién lo fabricó?")}</h3><div class="nc-makers"></div></div>`);
    p.append(card, side); const mk = side.querySelector(".nc-makers"); let priv = false, privMac = null;
    const cur = () => DEV[st.mac.n % DEV.length], fmt = d => [...MAKERS[d.m].p.split(":"), ...d.s.split(":")];
    function show() { const d = cur(), m = fmt(d), pm = priv ? privMac : null;
      card.innerHTML = `<div class="nc-dev">${IC(DEVICON[d.k], "#35d0ff")}<div class="nc-mac"><b class="a">${m.slice(0, 3).join(":")}</b><b class="b">${(pm || m).slice(3).join(":")}</b></div></div><div class="nc-prog">${DEV.map((_, i) => `<i class="${i < st.mac.n ? "on" : ""}"></i>`).join("")}</div>`;
      const pb = $(`<button class="nc-btn" aria-pressed="${priv}">🕶 ${L("Private Wi-Fi address", "Dirección Wi-Fi privada")}</button>`); card.append(pb);
      pb.addEventListener("click", () => { priv = !priv; privMac = ["DA", "6B", "1E", "93", "44", "0C"]; if (priv) tick("mac", "priv"); show(); gain(0);
        s3?.mac.set(priv ? privMac : fmt(cur()), MAKERS[cur().m].c, priv ? fmt(cur()).join(":") : null); say(priv ? L("Private address shown to Wi-Fi. The factory one stays inside.", "Dirección privada para el Wi-Fi. La de fábrica se queda dentro.") : "", "good"); });
      card.append(subBar("mac")); renderSubs(); s3?.mac.set(pm || m, MAKERS[d.m].c, pm ? m.join(":") : null); }
    MAKERS.forEach((m, i) => { const b = $(`<button class="nc-maker" style="--c:${m.c}"><b>${m.name}</b><code>${m.p}</code></button>`); mk.append(b);
      b.addEventListener("click", () => { const d = cur(); if (d.m === i) { s3?.mac.match(i); gain(6); st.mac.n++; api.save(); say(L("Match! The first half names the maker.", "¡Acierto! La primera mitad dice el fabricante."), "good");
          if (st.mac.n >= DEV.length) tick("mac", "match"); setTimeout(show, 500); } else { shake(b); s3?.mac.wrong(); say(L("Look at the first three pairs.", "Mira los tres primeros pares."), "bad"); } }); });
    show(); p.show = show;
  })();

  /* ===== 2. IP ===== */
  (() => {
    const p = panels.ip, del = $(`<div class="ar-card"></div>`), bld = $(`<div class="ar-card"></div>`); p.append(del, bld);
    const octs = [98, 251, 5, 62]; let v6 = st.ip.v6, short = false;
    function round() { const r = rng(1000 + st.ip.n * 17), a = [11 + Math.floor(r() * 200), Math.floor(r() * 256), Math.floor(r() * 256), 1 + Math.floor(r() * 254)];
      const ops = [a.join(".")]; while (ops.length < 4) { const b = a.slice(), k = Math.floor(r() * 4); b[k] = (b[k] + 1 + Math.floor(r() * 40)) % 256; const s = b.join("."); if (!ops.includes(s)) ops.push(s); }
      return { dest: ops[0], opts: shuffled(ops, r) }; }
    function drawDel() { const R = round(); del.innerHTML = `<div class="nc-dest">✉️ → <b>${R.dest}</b></div><div class="nc-houses"></div><div class="nc-prog">${[0, 1, 2, 3, 4].map(i => `<i class="${i < st.ip.n ? "on" : ""}"></i>`).join("")}</div>`;
      const hs = del.querySelector(".nc-houses"); s3?.ip.labels(R.dest, R.opts);
      R.opts.forEach((o, i) => { const b = $(`<button class="nc-house">${HOUSEICO(["#ff9a3c", "#3b8bff", "#e043a8", "#2bf0a0"][i])}<code>${o}</code></button>`); hs.append(b);
        b.addEventListener("click", () => { if (del.dataset.busy) return; const ok = o === R.dest; del.dataset.busy = 1;
          if (ok) { gain(st.ip.n < 5 ? 8 : 1); st.ip.n++; api.save(); say(L("Delivered! All four numbers matched.", "¡Entregado! Los cuatro números coinciden."), "good"); if (st.ip.n >= 5) tick("ip", "deliver"); }
          else { shake(b); say(L("Wrong house. Check every number.", "Casa equivocada. Revisa cada número."), "bad"); }
          if (s3) s3.ip.deliver(i, ok, () => { delete del.dataset.busy; if (ok) drawDel(); }); else { delete del.dataset.busy; if (ok) drawDel(); } }); });
      del.append(subBar("ip")); renderSubs(); }
    function drawBld() { bld.innerHTML = `<div class="ar-seg"><button aria-pressed="${!v6}" data-v="4">IPv4</button><button aria-pressed="${v6}" data-v="6">IPv6</button></div><div class="nc-bld"></div>`;
      bld.querySelectorAll(".ar-seg button").forEach(b => b.addEventListener("click", () => { v6 = b.dataset.v === "6"; st.ip.v6 = v6; s3?.ip.v6(v6); if (v6) { tick("ip", "v6"); say(L("128 bits: a whole city of addresses!", "128 bits: ¡una ciudad entera de direcciones!"), "good"); } else say(""); drawBld(); }));
      const w = bld.querySelector(".nc-bld");
      if (!v6) { w.innerHTML = `<div class="nc-oct">${octs.map((o, i) => `<div><button aria-label="-">−</button><input type="number" inputmode="numeric" value="${o}" aria-label="${L("number", "número")} ${i + 1}"><button aria-label="+">+</button><div class="nc-fill"><i></i></div></div>`).join("")}</div><div class="nc-hint">0 – 255</div>`;
        const ins = [...w.querySelectorAll("input")]; const upd = (userChange) => { const vals = ins.map(x => x.value === "" ? NaN : +x.value); const bad = vals.map(v => !(v >= 0 && v <= 255 && Number.isInteger(v)));
          ins.forEach((x, i) => { x.classList.toggle("bad", bad[i]); const f = w.querySelectorAll(".nc-fill i")[i]; f.style.width = Math.min(100, Math.max(0, vals[i] / 255 * 100) || 0) + "%"; f.style.background = bad[i] ? "#ff5468" : "#ff9a3c"; });
          const okAll = !bad.some(Boolean), txt = vals.map(v => isNaN(v) ? "?" : v).join("."); s3?.ip.build(txt, okAll);
          if (bad.some(Boolean)) { shake(w.querySelector(".nc-oct")); say(L("Each number can only be 0 to 255.", "Cada número solo puede ser de 0 a 255."), "bad"); } else if (userChange) { vals.forEach((v, i) => octs[i] = v); say(L("A valid IPv4 address!", "¡Una dirección IPv4 válida!"), "good"); if (txt !== "98.251.5.62") tick("ip", "build"); } };
        ins.forEach((x, i) => { x.addEventListener("input", () => upd(true)); const [mi, pl] = w.querySelectorAll(".nc-oct > div")[i].querySelectorAll("button"); mi.addEventListener("click", () => { x.value = (+x.value || 0) - 10; upd(true); }); pl.addEventListener("click", () => { x.value = (+x.value || 0) + 10; upd(true); }); });
        upd(false); }
      else { const full = ["2001", "0000", "0000", "9D38", "6AB8", "30F3", "34B1", "9D04"]; w.innerHTML = `<div class="nc-v6">${short ? `<b>2001</b><b class="z">::</b>${full.slice(3).map(g => `<b>${g}</b>`).join("")}` : full.map(g => `<b class="${g === "0000" ? "z" : ""}">${g}</b>`).join("")}</div><button class="nc-btn">${short ? L("Show all zeros", "Mostrar ceros") : L("Shorten zeros ::", "Acortar ceros ::")}</button>
        <div class="nc-cmp"><div><span>IPv4</span><i style="width:3%"></i><em>2³²</em></div><div><span>IPv6</span><i style="width:100%"></i><em>2¹²⁸</em></div></div>`; w.querySelector(".nc-btn").addEventListener("click", () => { short = !short; gain(1); drawBld(); });
        s3?.ip.build(short ? "2001::9D38:6AB8:30F3:34B1:9D04" : "2001:0000:0000:9D38:…:9D04", true); }
      bld.append(subBar("ip")); renderSubs(); }
    p.show = () => { drawDel(); drawBld(); if (v6) s3?.ip.v6(true); }; p.show();
  })();

  /* ===== 3. PACKETS ===== */
  let pktIdle = () => {};
  (() => {
    const p = panels.pkt, ctl = $(`<div class="ar-card"></div>`), tray = $(`<div class="ar-card"><h3>📥</h3><div class="nc-tray"></div><div class="nc-slots"></div></div>`); p.append(ctl, tray);
    const trayEl = tray.querySelector(".nc-tray"), slotsEl = tray.querySelector(".nc-slots"); let lost = 0, placed = 0, arrived = {}, running = false, rtok = 0;
    const SRC = "98.251.5.62", DST = "203.0.113.7";
    ctl.innerHTML = `<div class="nc-hdr"><code>${SRC}</code> → <code>${DST}</code></div><div class="nc-row"><button class="nc-btn big" id="send">📤 ${L("Send", "Enviar")}</button><button class="nc-btn big warn" id="resend" disabled>🔁 ${L("Resend", "Reenviar")}</button></div>`;
    ctl.append(subBar("pkt")); renderSubs();
    const sendB = ctl.querySelector("#send"), reB = ctl.querySelector("#resend");
    const drawSlots = () => { slotsEl.innerHTML = [1, 2, 3, 4, 5, 6].map(n => `<span class="${n <= placed ? "on" : n === placed + 1 ? "next" : ""}">${n <= placed ? "✔" : n}</span>`).join(""); };
    const tile = n => { arrived[n] = true; const b = $(`<button class="nc-tile" style="--c:${["#35d0ff", "#ff9a3c", "#2bf0a0", "#ff5aa5", "#a97bff", "#ffd34d"][n - 1]}"><b>${n}</b><small>${DST}</small></button>`); b.dataset.n = n; trayEl.append(b);
      b.addEventListener("click", () => { if (n === placed + 1) { placed++; b.remove(); s3?.pkt.place(n); gain(4); drawSlots(); say(L("Right order!", "¡En orden!"), "good"); if (placed === 6) done(); }
        else { shake(b); shake(slotsEl); say(L("Which number comes next?", "¿Qué número sigue?"), "bad"); } }); };
    const done = () => { say(L("Picture rebuilt!", "¡Imagen reconstruida!"), "good"); s3?.pkt.cheer(); gain(10); tick("pkt", "send"); sendB.disabled = false; running = false; };
    pktIdle = () => {};
    sendB.addEventListener("click", () => { if (running) return; running = true; sendB.disabled = true; reB.disabled = true; trayEl.innerHTML = ""; placed = 0; arrived = {}; drawSlots(); s3?.pkt.reset(); const tok = ++rtok;
      const r = rng(7000 + (st.pkt.rounds++) * 31); api.save(); lost = 1 + Math.floor(r() * 6); const ids = [1, 2, 3, 4, 5, 6].filter(n => n !== lost); let perm = shuffled(ids, r); if (perm.every((n, i) => n === ids[i])) perm.reverse();
      say(L("Packets are on their way. Different roads!", "¡Los paquetes van en camino por rutas distintas!"));
      [1, 2, 3, 4, 5, 6].forEach((n, i) => { const arr = n === lost ? 0 : perm.indexOf(n), dur = 2.2 + arr * .8 - i * .1 + (n === lost ? 0 : 0), route = Math.floor(r() * 3);
        s3?.pkt.launch(n, route, Math.max(1.6, dur), n === lost, i * .15); if (n !== lost) setTimeout(() => { if (tok === rtok) tile(n); }, (i * .15 + Math.max(1.6, dur) + .1) * 1000); });
      setTimeout(() => { if (tok !== rtok) return; reB.disabled = false; reB.classList.add("pulse"); say(L(`Packet ${lost} was lost! Resend it.`, `¡Se perdió el paquete ${lost}! Reenvíalo.`), "bad"); }, 2800); });
    reB.addEventListener("click", () => { if (reB.disabled) return; reB.disabled = true; reB.classList.remove("pulse"); s3?.pkt.launch(lost, 1, 2, false, 0); tick("pkt", "resend"); gain(6);
      say(L("TCP asks for it again. It arrives!", "TCP lo pide otra vez. ¡Llega!"), "good"); const tok = rtok; setTimeout(() => { if (tok === rtok) tile(lost); }, 2200); });
    drawSlots();
  })();

  /* ===== 4. SERVERS ===== */
  (() => {
    const p = panels.srv, ask = $(`<div class="ar-card"></div>`), srvs = $(`<div class="ar-card"><h3>🗄️</h3><div class="nc-servers"></div></div>`); p.append(ask, srvs);
    const grid = srvs.querySelector(".nc-servers"); let busy = false;
    const order = () => shuffled(TASKS.map((_, i) => i), rng(300 + Math.floor(st.srv.n / 5))), cur = () => order()[st.srv.n % 5];
    function drawAsk() { const i = cur(), tk = TASKS[i]; ask.innerHTML = `<div class="nc-task" style="--c:${tk.c}"><span>${tk.ico}</span><b>${tk.t()}</b></div><div class="nc-prog">${[0, 1, 2, 3, 4].map(k => `<i class="${k < st.srv.n % 5 ? "on" : ""}"></i>`).join("")}</div>`; ask.append(subBar("srv")); renderSubs(); }
    TASKS.forEach((tk, i) => { const b = $(`<button class="nc-server" style="--c:${tk.c}"><span>${tk.ico}</span><b>${tk.n()}</b></button>`); grid.append(b);
      b.addEventListener("click", () => { if (busy) return; busy = true; const right = cur() === i; s3?.srv.reset();
        const fin = () => { busy = false; if (right) { st.srv.n++; api.save(); drawAsk(); } };
        if (right) { gain(6); tick("srv", tk.k); say(L("The server answered the client!", "¡El servidor respondió al cliente!"), "good"); } else { shake(b); say(L("Wrong server for that job.", "Servidor equivocado para esa tarea."), "bad"); }
        if (s3) s3.srv.request(i, right, fin); else fin(); }); });
    drawAsk();
  })();

  /* ===== 5. FIX-IT ===== */
  (() => {
    const p = panels.fix, tools = $(`<div class="ar-card"></div>`), culprit = $(`<div class="ar-card"><h3>❓</h3><div class="nc-servers"></div></div>`); p.append(tools, culprit);
    st.fix.order ??= shuffled(["cable", "router", "site"], rng(Date.now() % 9973)); const grid = culprit.querySelector(".nc-servers"); let out = null, busy = false, pingN = 0;
    const cur = () => st.fix.order[st.fix.i];
    function draw() { const all = st.fix.i >= 3; tools.innerHTML = `<div class="nc-task" style="--c:#ff5468"><span>${all ? "✅" : "🌐❌"}</span><b>${all ? L("Network online!", "¡Red en línea!") : "Funfun.com"}</b></div>
      <div class="nc-row"><button class="nc-btn big" id="ping" ${all ? "disabled" : ""}>📡 Ping</button><button class="nc-btn big" id="phone" ${all ? "disabled" : ""}>📱 ${L("Phone test", "Prueba móvil")}</button></div><div class="nc-out"></div><div class="nc-prog">${[0, 1, 2].map(i => `<i class="${i < st.fix.i ? "on" : ""}"></i>`).join("")}</div>`;
      tools.append(subBar("fix")); renderSubs(); out = tools.querySelector(".nc-out"); if (!all) s3?.fix.set(cur()); else s3?.fix.set("ok");
      tools.querySelector("#ping")?.addEventListener("click", () => { const f = cur(), ok = f === "site"; s3?.fix.ping(ok); out.innerHTML = ""; for (let i = 0; i < 4; i++) setTimeout(() => out.insertAdjacentHTML("beforeend", ok ? `<span class="ok">✔ ${20 + i * 3} ms</span>` : `<span class="no">✖ timeout</span>`), 1200 + i * 350); });
      tools.querySelector("#phone")?.addEventListener("click", () => { const f = cur(), ok = f !== "site"; s3?.fix.phoneTest(ok); out.innerHTML = `<span class="${ok ? "ok" : "no"}" style="animation-delay:1.3s">📱 ${ok ? "✔ Funfun" : "✖ Funfun"}</span>`; setTimeout(() => {}, 0); }); }
    Object.keys(FAULTS).forEach(k => { const b = $(`<button class="nc-server" style="--c:#ff5468"><span>${FAULTS[k].ico}</span><b>${FAULTS[k].n()}</b></button>`); grid.append(b);
      b.addEventListener("click", () => { if (busy || st.fix.i >= 3) return; const f = cur(); if (k !== f) { shake(b); s3?.fix.shake(); say(L("Not that one. Use the tests and look at the lights!", "Esa no. ¡Usa las pruebas y mira las luces!"), "bad"); return; }
        busy = true; say(f === "site" ? L("Nothing to fix on our side: wait for the site.", "Nada que arreglar de nuestro lado: espera al sitio.") : f === "router" ? L("Switch it off and on again (ask permission first!)", "Apágalo y enciéndelo (¡pide permiso antes!)") : L("Plug the cable back in.", "Vuelve a enchufar el cable."), "good");
        const fin = () => { busy = false; gain(15); tick("fix", f); st.fix.i++; api.save(); draw(); if (st.fix.i >= 3) say(L("Everything works again!", "¡Todo funciona otra vez!"), "good"); };
        if (s3) s3.fix.repair(fin); else setTimeout(fin, 600); }); });
    p.show = draw; draw();
  })();

  host.append(root); renderTop(); renderSubs(); select(st.tab);
  say(L("Welcome to Network City! Pick a station.", "¡Bienvenido a Ciudad Red! Elige una estación."));
  initScene(view).then(s => { s3 = s; if (s) { s.goto(st.tab); redrawAll(); } else view.prepend($(`<div class="ar-nogl">${L("3D view is not available here, but every control below still works.", "La vista 3D no está disponible aquí, pero todos los controles funcionan.")}</div>`)); }).catch(e => console.error("3D scene failed", e));
  function redrawAll() { select(st.tab); Object.values(panels).forEach(pp => pp.show?.()); }
}

mountExternalActivity({ simulation: mkSim }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root"); if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
</html>
