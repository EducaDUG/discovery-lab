    function tap(b, it, seq) { if (lock) return; const need = seq[st.url.step];
      if (it.t === need[0] && it.k === need[1]) { st.url.step++; b.classList.add("used"); setRt(); gain(3); say(`✔️ ${seq.slice(0, st.url.step).map(s => s[0]).join("")}`, "good");
        if (st.url.step >= seq.length) { lock = true; rt.url.done = now(); gain(10); setTimeout(() => { st.url.i++; st.url.step = 0; api.save(); lock = false; setRt(); if (st.url.i >= URLS.length) { mark("url"); rt.burst = [["url", 0xffd34d, 60]]; } draw(); }, 2400); } api.save(); }
      else { if (rt.url) rt.url.bad = now(); shake(b); say(L("Not yet. Follow the coloured boxes!","Aún no. ¡Sigue las cajas de colores!"), "bad"); } }
    setRt(); draw(); })();

  /* ---------- 4. Protocol post ---------- */
  (function () { const p = panels.post, c1 = $(`<div class="ar-card"><h3>📮</h3><div class="c6-order"></div><div class="dd"></div></div>`), c2 = $(`<div class="ar-card"><div class="c6-grid"></div></div>`); p.append(c1, c2);
    const ord = c1.querySelector(".c6-order"), dd = c1.querySelector(".dd"), grid = c2.querySelector(".c6-grid"); let lock = false;
    function draw() { const done = st.po.i >= PO_ORD.length; dd.innerHTML = dots(PO_ORD.length, st.po.i, done);
      if (done) { ord.textContent = "🏆"; grid.innerHTML = `<div class="c6-done" style="grid-column:1/-1">${L("Every job delivered!","¡Todos los trabajos entregados!")}</div>`; const b = $(`<button class="c6-btn" style="--ac:#ff5d8f;grid-column:1/-1">🔁 ${L("Again","Otra vez")}</button>`); b.addEventListener("click", () => { st.po.i = 0; api.save(); draw(); }); grid.append(b); return; }
      const o = PO_ORD[st.po.i]; ord.innerHTML = `${o[1]} <small>${o[2]()}</small>`; grid.innerHTML = "";
      VEH.forEach(([id, col, em]) => { const b = $(`<button class="c6-btn" style="--ac:${col}">${em}<br><small>${id.toUpperCase()}</small></button>`); b.addEventListener("click", () => go(id, b)); grid.append(b); }); }
    function go(id, b) { if (lock || st.po.i >= PO_ORD.length) return; const ok = PO_ORD[st.po.i][0] === id; rt.post = { veh: id, ok, t0: now() };
      if (!ok) { shake(b); say(L("Wrong vehicle for this job. Try again!","Vehículo equivocado para este trabajo. ¡Inténtalo otra vez!"), "bad"); return; }
      lock = true; say(id === "http" ? "GET /page.html ➜ 200 OK ✔️" : `✔️ ${id.toUpperCase()}`, "good"); gain(5);
      setTimeout(() => { st.po.i++; api.save(); lock = false; if (st.po.i >= PO_ORD.length) { mark("proto"); rt.burst = [["post", 0xffd34d, 60]]; } draw(); }, 3300); }
    draw(); })();

  /* ---------- 5. Secret lock ---------- */
  (function () { const p = panels.sec, c1 = $(`<div class="ar-card"><h3>🔒</h3><div class="ar-seg" role="group"><button data-m="http">⚠️ http://</button><button data-m="https">🔒 https://</button></div><button class="ar-go" style="--c:#2bf0a0">🔑 ➜ 🖥️</button></div>`),
      c2 = $(`<div class="ar-card"><h3>👀 ➜ 🔒 ?</h3><div class="c6-spot"></div></div>`); p.append(c1, c2);
    const seg = c1.querySelector(".ar-seg"), send = c1.querySelector(".ar-go"), spot = c2.querySelector(".c6-spot"); let busy = false;
    const drawSeg = () => seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === st.sec.mode)));
    seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { if (busy) return; st.sec.mode = b.dataset.m; rt.sec = { mode: st.sec.mode, t0: 0 }; api.save(); drawSeg(); }));
    send.addEventListener("click", () => { if (busy) return; busy = true; send.disabled = true; const m = st.sec.mode; rt.sec = { mode: m, t0: now() };
      say(m === "http" ? L("The snooper can read your password!","¡El espía puede leer tu contraseña!") : L("The snooper only sees scrambled nonsense.","El espía solo ve un lío ilegible."), m === "http" ? "bad" : "good");
      setTimeout(() => { busy = false; send.disabled = false; st.sec.sent[m] = true; gain(6); if (st.sec.sent.http && st.sec.sent.https && st.sec.spot >= 3) mark("secure"); api.save(); }, 3500); });
    function drawSpot() { spot.innerHTML = ""; if (st.sec.spot >= SPOTS.length) { spot.innerHTML = `<div class="c6-done" style="grid-column:1/-1">✔️ ✔️ ✔️</div>`; return; }
      const pair = SPOTS[st.sec.spot]; pair.forEach(t => { const safe = t.includes("https"), b = $(`<button class="c6-btn" style="--ac:${safe ? "#2bf0a0" : "#ff5468"}">${t}</button>`);
        b.addEventListener("click", () => { if (!safe) { shake(b); say(L("No lock here. Pick the safe one!","Aquí no hay candado. ¡Elige el seguro!"), "bad"); return; } st.sec.spot++; gain(5); say(`🔒 ✔️`, "good"); if (st.sec.sent.http && st.sec.sent.https && st.sec.spot >= 3) mark("secure"); api.save(); drawSpot(); });
        spot.append(b); }); }
    drawSeg(); drawSpot(); })();

  const fact = $(`<div class="ar-fact"><button>${L("Fun fact","Dato curioso")} 💡</button><p hidden>${L("The Domain Name System was created in 1983. Before that, computers used one shared list of names!","¡El Sistema de Nombres de Dominio se creó en 1983. Antes, los ordenadores usaban una sola lista compartida de nombres!")}</p></div>`);
  fact.querySelector("button").addEventListener("click", () => { fact.querySelector("p").hidden = false; fact.querySelector("button").hidden = true; gain(5); });
  root.append(fact);
  host.append(root); renderTop(); select(st.tab); say(L("Welcome to Internet Town! Pick a station below.","¡Bienvenido a Ciudad Internet! Elige una estación abajo."));
  initScene(view, st, rt).then(s => { scene3d = s; if (s) s.goto(st.tab); else view.prepend($(`<div class="ar-nogl">${L("3D view is not available on this device, but every control below still works.","La vista 3D no está disponible en este dispositivo, pero todos los controles funcionan.")}</div>`)); })
    .catch(e => console.error("3D scene failed", e));
}

mountExternalActivity({ simulation: mkSim }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
</body>
