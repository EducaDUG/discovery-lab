function loadThree() {
  if (window.THREE) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script");

/* =====================================================================
   3D SCENE — a real-time PBR motherboard. It only READS state each frame
   (st = persisted state, rt = runtime); it never owns game logic.
   ===================================================================== */
async function initScene(view, st, rt) {
  try { await loadThree(); } catch (e) { return null; }
  const THREE = window.THREE; let gl = null;
  try { const c = document.createElement("canvas"); gl = c.getContext("webgl2") || c.getContext("webgl"); } catch (e) {}
  if (!gl) return null;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  view.prepend(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x070b14); scene.fog = new THREE.FogExp2(0x070b14, 0.028);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
  const C = h => new THREE.Color(h).convertSRGBToLinear();

  /* procedural studio environment for reflections */
  try {
    const es = new THREE.Scene(); es.background = new THREE.Color(0x0a1224);
    [[0,9,0,16,.5,16,0xffffff,1.6],[-14,4,2,.5,7,12,0x58b8ff,2.4],[14,4,2,.5,7,12,0xff7ad9,1.8],[0,3,-14,16,5,.5,0xffd9a0,1.2]].forEach(p => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]), new THREE.MeshBasicMaterial({ color: new THREE.Color(p[6]).multiplyScalar(p[7]) })); m.position.set(p[0],p[1],p[2]); es.add(m); });
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.04).texture; pm.dispose();
  } catch (e) {}

  const tex = (w, h, draw, rep) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); } return t; };
  let seed = 7; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  /* --- PCB: dark teal board, etched traces, glow layer --- */
  const glowLayer = document.createElement("canvas"); glowLayer.width = 1024; glowLayer.height = 640;
  const gctx = glowLayer.getContext("2d"); gctx.fillStyle = "#000"; gctx.fillRect(0,0,1024,640);
  const pcbTex = tex(1024, 640, (x, w, h) => {
    const g = x.createLinearGradient(0,0,w,h); g.addColorStop(0,"#0a3a3d"); g.addColorStop(1,"#06232b"); x.fillStyle = g; x.fillRect(0,0,w,h);
    for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(255,255,255,${rand()*0.04})`; x.fillRect(rand()*w, rand()*h, 2, 2); }
    for (let i = 0; i < 150; i++) {
      let px = Math.floor(rand()*64)*16, py = Math.floor(rand()*40)*16; const path = [[px,py]];
      for (let s = 0; s < 5; s++) { const dir = Math.floor(rand()*4), len = (2+Math.floor(rand()*8))*16;
        px += [len,-len,0,0][dir]; py += [0,0,len,-len][dir]; path.push([px,py]); if (rand()<.3){ px+=16; py+=16; path.push([px,py]); } }
      [[x,"rgba(80,220,205,.32)",3],[gctx,"rgba(60,255,235,.9)",3]].forEach(([c,col,lw]) => { c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); path.forEach((p,k)=>k?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); c.stroke();
        c.fillStyle = col; c.beginPath(); c.arc(px,py,5,0,6.3); c.fill(); });

    for (let i = 0; i < N; i++) { if (pLife[i] <= 0) continue; pLife[i] -= dt*1.1; pVel[i*3+1] -= 6*dt; pPos[i*3] += pVel[i*3]*dt; pPos[i*3+1] += pVel[i*3+1]*dt; pPos[i*3+2] += pVel[i*3+2]*dt;
      if (pLife[i] <= 0) pPos[i*3+1] = -50; } pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
    /* camera */
    const pr = presets[station]; cam.t.lerp(new THREE.Vector3(...pr.t), Math.min(1, dt*3)); cam.az += (pr.az + drag.az + (red ? 0 : Math.sin(tNow*.25)*.04) - cam.az) * Math.min(1, dt*3);
    cam.pol += (pr.pol + drag.pol - cam.pol) * Math.min(1, dt*3); cam.d += (pr.d * aspectBoost - cam.d) * Math.min(1, dt*3);
    camera.position.set(cam.t.x + cam.d*Math.sin(cam.az)*Math.cos(cam.pol), cam.t.y + cam.d*Math.sin(cam.pol), cam.t.z + cam.d*Math.cos(cam.az)*Math.cos(cam.pol)); camera.lookAt(cam.t);
    renderer.render(scene, camera);
  };
  requestAnimationFrame(frame);
  return api;
}

/* =====================================================================
   GAME LOGIC + HUD
   ===================================================================== */
function mkSim(host, api) {
  const st = api.state;
  st.tab ??= "cpu"; st.explored ??= {}; st.cpu ??= { ghz:2, times:{} };
  st.ramGb ??= 4; st.apps ??= []; st.stoGb ??= 64; st.files ??= []; st.xp ??= 0;
  st.apps = st.apps.filter(id => APPS.some(x => x.id === id)); st.files = st.files.filter(f => FILES.some(x => x.id === f.id)); /* drop ids from older versions */
  const rt = { dim: 0, run: null, doneN: 0, burst: null };
  const $ = h => { const n = document.createElement("div"); n.innerHTML = h.trim(); return n.firstElementChild; };
  const root = $(`<div></div>`);
  const labels = { cpu:L("CPU Race","Carrera CPU"), ram:L("RAM Crash","Choque RAM"), storage:L("Fill the Vault","Llena la bóveda"), power:L("Power Cycle","Apagar y encender") };

  const top = $(`<div class="ar-top"><div class="ar-rank"><div class="ar-rank__badge">1</div><div><div class="ar-rank__name"></div><div class="ar-xpbar"><i></i></div><div class="ar-xp"></div></div></div><div class="ar-miss" aria-live="polite"></div></div>`);
  const view = $(`<div class="ar-view"><div class="ar-hint">${L("Drag to orbit · tap the power button · tap a file slab to delete","Arrastra para girar · toca el botón de encendido · toca un archivo para borrarlo")}</div><div class="ar-msg" role="status"></div></div>`);
  const msgEl = view.querySelector(".ar-msg");
  const stationsEl = $(`<div class="ar-stations" role="tablist"></div>`);
  const dock = $(`<div class="ar-dock"></div>`);
  root.append(top, view, stationsEl, dock);

  const say = (t, k = "") => { msgEl.className = "ar-msg " + k; msgEl.textContent = t; };
  const pop = text => { const p = $(`<div class="ar-pop">${text}</div>`); view.append(p); setTimeout(() => p.remove(), 1150); };
  const rankOf = xp => { let r = 0; RANKS.forEach((x, i) => { if (xp >= x[0]) r = i; }); return r; };
  function renderTop() {
    const r = rankOf(st.xp), lo = RANKS[r][0], hi = RANKS[r+1] ? RANKS[r+1][0] : lo + 60;
    top.querySelector(".ar-rank__badge").textContent = r + 1; top.querySelector(".ar-rank__name").textContent = RANKS[r][1];
    top.querySelector(".ar-xpbar i").style.width = Math.min(100, (st.xp - lo) / (hi - lo) * 100) + "%";
    top.querySelector(".ar-xp").textContent = `${st.xp} XP` + (RANKS[r+1] ? ` · ${L("next rank at","siguiente rango en")} ${hi}` : ` · ${L("MAX RANK","RANGO MÁXIMO")}`);
    top.querySelector(".ar-miss").innerHTML = Object.entries(labels).map(([k, l]) => `<span class="ar-m ${st.explored[k] ? "done" : ""}">${l}</span>`).join("");
  }
  function gain(n, why) { const before = rankOf(st.xp); st.xp += n; pop(`+${n} XP`); renderTop(); api.save();
    if (rankOf(st.xp) > before) { setTimeout(() => { pop(`${L("RANK UP","SUBES DE RANGO")}: ${RANKS[rankOf(st.xp)][1]}!`); rt.burst = [["cpu",0x35d0ff,40],["ram",0xff9a3c,40],["sto",0xa97bff,40]]; }, 500); } }
  function mark(k) { if (st.explored[k]) return false; st.explored[k] = true; gain(30, k); renderTop();
    if (Object.keys(labels).every(x => st.explored[x]) && !view.querySelector(".ar-banner")) {
      const b = $(`<div class="ar-banner"><div><h3>${L("MISSION COMPLETE!","¡MISIÓN CUMPLIDA!")}</h3><p>${L("You know how CPU, RAM and storage work. Now prove it in the quiz!","Ya sabes cómo funcionan la CPU, la RAM y el almacenamiento. ¡Demuéstralo en la prueba!")}</p><button class="ar-go" style="--c:var(--ok);padding:0 1.6em">${L("Go to the quiz","Ir a la prueba")}</button></div></div>`);
      b.querySelector("button").addEventListener("click", () => { b.remove(); document.querySelector(".q")?.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }); });
      view.append(b); rt.burst = [["cpu",0x2bf0a0,50],["ram",0x2bf0a0,50],["sto",0x2bf0a0,50]]; }
    return true; }

  const TAB = [
    { id:"cpu", c:"#35d0ff", n:L("CPU","CPU"), ico:`<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1.500" fill="#06101f"/></svg>` },
    { id:"ram", c:"#ff9a3c", n:L("RAM","RAM"), ico:`<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2" fill="currentColor"/><g fill="#06101f"><rect x="5" y="9" width="3" height="4"/><rect x="10" y="9" width="3" height="4"/><rect x="15" y="9" width="3" height="4"/></g></svg>` },
    { id:"sto", c:"#a97bff", n:L("Storage","Almacenamiento"), ico:`<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3" fill="currentColor"/><path d="M4 12h16" stroke="#06101f" stroke-width="1.500"/></svg>` },
  ];
  const pw = `<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><path d="M12 3v8M6.500 6.500a8 8 0 1 0 11 0"/></svg>`;
  const panels = {};
  TAB.forEach(t => { const b = $(`<button class="ar-st" role="tab" style="--c:${t.c}">${t.ico}<span>${t.n}</span></button>`); b.dataset.id = t.id; b.addEventListener("click", () => select(t.id)); stationsEl.append(b);
    const p = $(`<div class="ar-panel" role="tabpanel" style="--c:${t.c}"></div>`); panels[t.id] = p; dock.append(p); });
  let scene3d = null;
  function select(id) { st.tab = id; api.save(); stationsEl.querySelectorAll(".ar-st").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === id)));
    Object.entries(panels).forEach(([k, p]) => p.hidden = k !== id); scene3d?.goto(id === "sto" ? "sto" : id); }
  const seg = (vals, cur, fmt, pick) => { const s = $(`<div class="ar-seg" role="group"></div>`); vals.forEach(v => { const b = $(`<button aria-pressed="${v === cur}">${fmt(v)}</button>`); b.addEventListener("click", () => { pick(v); s.querySelectorAll("button").forEach((x, i) => x.setAttribute("aria-pressed", String(vals[i] === v))); }); s.append(b); }); return s; };

  /* power cycle: RAM forgets, storage keeps */
  function powerCycle() { if (rt.dim) return; const had = st.apps.length; rt.dim = 1; rt.run = null;
    say(L("Powering off… the lights go out.","Apagando… se van las luces."), "bad");
    setTimeout(() => { st.apps = []; renderRam(); rt.dim = 0; api.save();
      say(L(`Power back on! RAM forgot your ${had} open app${had===1?"":"s"}, but the ${st.files.length} saved file${st.files.length===1?" is":"s are"} still glowing in storage.`,
        `¡Encendido otra vez! La RAM olvidó tus ${had} app${had===1?"":"s"} abierta${had===1?"":"s"}, pero ${st.files.length===1?"el archivo guardado sigue":"los "+st.files.length+" archivos guardados siguen"} brillando en el almacenamiento.`), "good");
      if (mark("power")) {} else gain(5); rt.burst = [["power",0x2bf0a0,40]]; }, 1700); }
  rt.onPower = powerCycle;
  const powerBtn = () => { const b = $(`<button class="ar-go ar-go--ghost">${pw} ${L("Power off / on","Apagar / encender")}</button>`); b.addEventListener("click", powerCycle); return b; };

  /* ===== CPU ===== */
  {
    const p = panels.cpu;
    p.innerHTML = `<div class="ar-card"><h3>${L("CPU speed","Velocidad de la CPU")}</h3><div class="ar-big"><span class="g"></span> GHz</div></div><div class="ar-card"><h3>${L("Race times","Tiempos de la carrera")}</h3><div class="ar-bars"></div></div>`;
    const card = p.children[0], bars = p.querySelector(".ar-bars");
    let running = false;
    const setG = g => { st.cpu.ghz = g; card.querySelector(".g").textContent = g; api.save(); };
    const sg = seg([1,2,3,4], st.cpu.ghz, v => v + " GHz", v => { if (!running) setG(v); else sg.querySelectorAll("button").forEach((x,i)=>x.setAttribute("aria-pressed", String([1,2,3,4][i]===st.cpu.ghz))); });
    const go = $(`<button class="ar-go">${L("Run 10 tasks","Hacer 10 tareas")}</button>`);
    card.append(sg, go);
    const drawBars = () => { bars.innerHTML = [1,2,3,4].map(g => { const t = st.cpu.times[g]; return `<div class="ar-bar ${t ? "" : "e"}"><span>${g} GHz</span><span><i style="width:${t ? Math.max(8, t/6*100) : 6}%"></i></span><span>${t ? t.toFixed(1) + " s" : "–"}</span></div>`; }).join(""); };
    go.addEventListener("click", () => { if (running || rt.dim) return; running = true; go.disabled = true; const g = st.cpu.ghz, per = 550 / g, t0 = performance.now();
      rt.doneN = 0; rt.run = { t0, per }; say(L("Packets are racing through the CPU…","Los paquetes pasan por la CPU…"));
      const iv = setInterval(() => { const el = performance.now() - t0; if (el < per * 10 + 350) return; clearInterval(iv);
        rt.run = null; rt.doneN = 10; running = false; go.disabled = false; const secs = (per * 11) / 1000; const first = st.cpu.times[g] == null;
        st.cpu.times[g] = Math.min(st.cpu.times[g] ?? 99, secs); drawBars(); api.save();
        say(L(`Done in ${secs.toFixed(1)} seconds at ${g} GHz!`,`¡Terminado en ${secs.toFixed(1)} segundos a ${g} GHz!`), "good"); rt.burst = [["cpu",0x2bf0a0,45]];
        gain(first ? 20 : 8);
        if (Object.keys(st.cpu.times).length >= 3) mark("cpu"); else say(L(`Done in ${secs.toFixed(1)} s at ${g} GHz. Try a different speed and compare!`,`Terminado en ${secs.toFixed(1)} s a ${g} GHz. ¡Prueba otra velocidad y compara!`), "good"); }, 60); });
    setG(st.cpu.ghz); drawBars();
  }

  /* ===== RAM ===== */
  let renderRam = () => {};
  {
    const p = panels.ram;
    p.innerHTML = `<div class="ar-card"><h3>${L("RAM size (desk size)","Tamaño de RAM (escritorio)")}</h3><div class="ar-big"><span class="g"></span> GB</div><div class="ar-meter"><i></i></div></div><div class="ar-card"><h3>${L("Open an app","Abre una app")}</h3><div class="ar-chips"></div></div>`;
    const card = p.children[0], chips = p.querySelector(".ar-chips"); let over = 0;
    card.append(seg(RAMS, st.ramGb, v => v + " GB", v => { st.ramGb = v; over = 0; renderRam(); api.save(); }), powerBtn());
    APPS.forEach(a => { const b = $(`<button class="ar-chip" aria-pressed="false" style="--ac:${a.c}">${ICON[a.ico](a.c)}<span>${a.n()}<small>${a.gb} GB</small></span></button>`); b.dataset.id = a.id;
      b.addEventListener("click", () => { if (rt.dim) return; const i = st.apps.indexOf(a.id); if (i >= 0) st.apps.splice(i, 1); else { st.apps.push(a.id); gain(3); } over = 0; renderRam(); api.save(); }); chips.append(b); });
    renderRam = () => { const total = st.ramGb, used = st.apps.reduce((s, id) => s + APPS.find(a => a.id === id).gb, 0), isOver = used > total;
      card.querySelector(".g").textContent = total; const m = card.querySelector(".ar-meter i"); m.style.width = Math.min(100, used / total * 100) + "%"; m.style.background = isOver ? "var(--bad)" : "linear-gradient(90deg,var(--ram),#ffd34d)";
      chips.querySelectorAll(".ar-chip").forEach(b => b.setAttribute("aria-pressed", String(st.apps.includes(b.dataset.id))));
      if (isOver) { say(L(`Too full! ${used} GB of apps on a ${total} GB desk. Everything slows down… an app may crash.`,`¡Demasiado lleno! ${used} GB de apps en un escritorio de ${total} GB. Todo va lento… una app puede fallar.`), "bad"); mark("ram"); }
      else if (st.apps.length && !rt.dim) say(L(`${used} of ${total} GB used. Everything runs smoothly.`,`${used} de ${total} GB usados. Todo funciona con fluidez.`), "good");
      else if (!rt.dim) say(L(`Empty ${total} GB desk. Open some apps!`,`Escritorio de ${total} GB vacío. ¡Abre apps!`)); };
    setInterval(() => { if (panels.ram.hidden) return; const used = st.apps.reduce((s, id) => s + APPS.find(a => a.id === id).gb, 0);
      if (used > st.ramGb) { if (++over >= 6) { over = 0; const id = st.apps.pop(), a = APPS.find(x => x.id === id); rt.burst = [["ram",0xff5468,60]]; renderRam(); api.save(); gain(10);
        say(L(`${a.n()} crashed because the desk was too full! Close apps or get more RAM.`,`¡${a.n()} falló porque el escritorio estaba demasiado lleno! Cierra apps o consigue más RAM.`), "bad"); } } else over = 0; }, 500);
  }

  /* ===== Storage ===== */
  {
    const p = panels.sto;
    p.innerHTML = `<div class="ar-card"><h3>${L("Storage size (vault size)","Tamaño de almacenamiento (bóveda)")}</h3><div class="ar-big"><span class="g"></span> GB</div><div class="ar-meter"><i></i></div></div><div class="ar-card"><h3>${L("Save a file","Guarda un archivo")}</h3><div class="ar-seg cats" role="group"></div><div class="ar-chips save"></div><h3 style="margin-top:12px">${L("Saved (tap to delete)","Guardado (toca para borrar)")}</h3><div class="ar-chips list"></div></div>`;
    const card = p.children[0], save = p.querySelector(".save"), list = p.querySelector(".list");
    let uid = st.files.reduce((m, f) => Math.max(m, f.u), 0);
    const used = () => st.files.reduce((s, f) => s + FILES.find(x => x.id === f.id).gb, 0);
    const del = u => { const f = st.files.find(x => x.u === u); if (!f || rt.dim) return; const d = FILES.find(x => x.id === f.id); st.files = st.files.filter(x => x.u !== u); gain(3); render(); api.save();
      say(L(`Deleted ${d.n()}. ${d.gb} GB free again.`,`${d.n()} borrado. ${d.gb} GB libres otra vez.`), "good"); rt.burst = [["sto",0xffffff,25]]; };
    rt.onDeleteFile = del;
    const render = () => { const total = st.stoGb, u = used(); card.querySelector(".g").textContent = total; const m = card.querySelector(".ar-meter i"); m.style.width = Math.min(100, u / total * 100) + "%"; m.style.background = "linear-gradient(90deg,var(--sto),#e043a8)";
      list.innerHTML = ""; if (!st.files.length) list.append($(`<span style="color:#8fa7d8;font-weight:700;font-size:.85rem">${L("The vault is empty.","La bóveda está vacía.")}</span>`));
      st.files.forEach(f => { const d = FILES.find(x => x.id === f.id); const b = $(`<button class="ar-chip" style="--ac:${d.c}" aria-label="${L("Delete","Borrar")} ${d.n()} ${d.gb} GB">${ICON[d.ico](d.c)}<span>${d.n()}<small>${d.gb} GB ✕</small></span></button>`); b.addEventListener("click", () => del(f.u)); list.append(b); }); };
    card.append(seg(STOS, st.stoGb, v => v + " GB", v => { st.stoGb = v; render(); api.save(); say(L(`${v - used() < 0 ? 0 : v - used()} GB free of ${v} GB.`,`${v - used() < 0 ? 0 : v - used()} GB libres de ${v} GB.`)); }), powerBtn());
    const cats = p.querySelector(".cats"); st.cat ??= "games";
    const drawSave = () => { cats.innerHTML = ""; CATS.forEach(([id, nm]) => { const cb = $(`<button aria-pressed="${st.cat === id}">${nm()}</button>`); cb.addEventListener("click", () => { st.cat = id; api.save(); drawSave(); }); cats.append(cb); });
      save.innerHTML = ""; FILES.filter(d => d.k === st.cat).forEach(addChip); };
    const addChip = d => { const b = $(`<button class="ar-chip" style="--ac:${d.c}">${ICON[d.ico](d.c)}<span>${d.n()}<small>${d.gb} GB</small></span></button>`);
      b.addEventListener("click", () => { if (rt.dim) return;
        if (used() + d.gb > st.stoGb) { rt.fullFx = true; say(L(`Vault full! ${d.n()} (${d.gb} GB) does not fit. Delete a file or choose more storage.`,`¡Bóveda llena! ${d.n()} (${d.gb} GB) no cabe. Borra un archivo o elige más almacenamiento.`), "bad"); mark("storage"); return; }
        st.files.push({ id: d.id, u: ++uid }); render(); api.save(); gain(4); say(L(`${d.n()} saved. ${st.stoGb - used()} GB free.`,`${d.n()} guardado. ${st.stoGb - used()} GB libres.`), "good"); rt.burst = [["sto", parseInt(d.c.slice(1), 16), 25]]; }); save.append(b); };
    drawSave(); render();
  }

  const fact = $(`<div class="ar-fact"><button>${L("Fun fact","Dato curioso")} 🚀</button><p hidden>${L("Your smartphone today is more powerful than the computers NASA used to land humans on the Moon in 1969!","¡Tu teléfono de hoy es más potente que los ordenadores que usó la NASA para llevar humanos a la Luna en 1969!")}</p></div>`);
  fact.querySelector("button").addEventListener("click", () => { fact.querySelector("p").hidden = false; fact.querySelector("button").hidden = true; gain(5); });
  root.append(fact);

  host.append(root); renderTop(); renderRam(); select(st.tab); say(L("Welcome to the Tech Core Arena. Pick a station below to start.","Bienvenido a la Arena Tech Core. Elige una estación abajo para empezar."));
  initScene(view, st, rt).then(s => { scene3d = s; if (s) s.goto(st.tab); else view.prepend($(`<div class="ar-nogl">${L("3D view is not available on this device, but every control below still works.","La vista 3D no está disponible en este dispositivo, pero todos los controles de abajo funcionan.")}</div>`)); })
    .catch(e => console.error("3D scene failed", e));
}

mountExternalActivity({ simulation: mkSim }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
