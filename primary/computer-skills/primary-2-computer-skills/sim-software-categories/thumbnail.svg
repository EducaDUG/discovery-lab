<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Program icons sorting themselves into System Software, Applications and Utilities bins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b28"/>
      <stop offset="1" stop-color="#0a141d"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <text x="18" y="26" font-family="Georgia, serif" font-size="15" fill="#eaf6ff" font-weight="bold">Software Categories</text>

  <!-- three category bins -->
  <g font-family="Georgia, serif" font-size="9" fill="#eaf6ff" text-anchor="middle">
    <rect x="16" y="128" width="82" height="38" rx="8" fill="#1a3652" stroke="#3d8fd6" stroke-width="2"/>
    <text x="57" y="151">System</text>
    <rect x="119" y="128" width="82" height="38" rx="8" fill="#4a3c19" stroke="#e0b64c" stroke-width="2"/>
    <text x="160" y="151">Applications</text>
    <rect x="222" y="128" width="82" height="38" rx="8" fill="#173a2b" stroke="#1f8a5c" stroke-width="2"/>
    <text x="263" y="151">Utilities</text>
  </g>

  <!-- flying chip 1 -> System -->
  <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#3d8fd6">
    <animateMotion dur="4s" repeatCount="indefinite" path="M150,50 C 120,80 80,110 57,132" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- flying chip 2 -> Applications -->
  <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#e0b64c">
    <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M150,50 C 155,80 158,105 160,132" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="4s" begin="1.3s" repeatCount="indefinite"/>
  </rect>

  <!-- flying chip 3 -> Utilities -->
  <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#1f8a5c">
    <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M150,50 C 190,80 230,110 263,132" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;1" dur="4s" begin="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- gentle glow pulses on bins as chips arrive -->
  <rect x="16" y="128" width="82" height="38" rx="8" fill="none" stroke="#7bffe0" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;.9;0" keyTimes="0;0.78;0.85;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="119" y="128" width="82" height="38" rx="8" fill="none" stroke="#7bffe0" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;.9;0" keyTimes="0;0.78;0.85;1" dur="4s" begin="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="222" y="128" width="82" height="38" rx="8" fill="none" stroke="#7bffe0" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;.9;0" keyTimes="0;0.78;0.85;1" dur="4s" begin="2.6s" repeatCount="indefinite"/>
  </rect>

  <text x="160" y="105" font-family="Georgia, serif" font-size="10" fill="#8fb8d9" text-anchor="middle">sort · boot · code</text>
</svg>
