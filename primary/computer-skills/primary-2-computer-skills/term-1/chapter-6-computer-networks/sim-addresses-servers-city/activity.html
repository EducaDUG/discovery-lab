    const SRC = "98.251.5.62", DST = "203.0.113.7";
    ctl.innerHTML = `<div class="nc-hdr"><code>${SRC}</code> → <code>${DST}</code></div><div class="nc-row"><button class="nc-btn big" id="send">📤 ${L("Send", "Enviar")}</button><button class="nc-btn big warn" id="resend" disabled>🔁 ${L("Resend", "Reenviar")}</button></div>`;
    ctl.append(subBar("pkt")); renderSubs();
    const sendB = ctl.querySelector("#send"), reB = ctl.querySelector("#resend");
    const drawSlots = () => { slotsEl.innerHTML = [1, 2, 3, 4, 5, 6].map(n => `<span class="${n <= placed ? "on" : n === placed + 1 ? "next" : ""}">${n <= placed ? "✔" : n}</span>`).join(""); };
    const tile = n => { arrived[n] = true; const b = $(`<button class="nc-tile" style="--c:${["#35d0ff", "#ff9a3c", "#2bf0a0", "#ff5aa5", "#a97bff", "#ffd34d"][n - 1]}"><b>${n}</b><small>${DST}</small></button>`); b.dataset.n = n; trayEl.append(b);
      b.addEventListener("click", () => { if (n === placed + 1) { placed++; b.remove(); s3?.pkt.place(n); gain(4); drawSlots(); say(L("Right order!", "¡En orden!"), "good"); if (placed === 6) done(); }
        else { wrongN++; shake(b); shake(slotsEl); say(L("Which number comes next?", "¿Qué número sigue?"), "bad"); } }); };
    const done = () => { rec("Packets", L(`Sent 6 packets, number ${lost} was lost`, `Enviados 6 paquetes, se perdio el ${lost}`), L("Rebuilt in order after resending", "Reconstruida en orden tras reenviar") + tries()); wrongN = 0; say(L("Picture rebuilt!", "¡Imagen reconstruida!"), "good"); s3?.pkt.cheer(); gain(10); tick("pkt", "send"); sendB.disabled = false; running = false; };
    pktIdle = () => {};
    sendB.addEventListener("click", () => { if (running) return; running = true; sendB.disabled = true; reB.disabled = true; trayEl.innerHTML = ""; placed = 0; arrived = {}; drawSlots(); s3?.pkt.reset(); const tok = ++rtok;
      const r = rng(7000 + (st.pkt.rounds++) * 31); api.save(); lost = 1 + Math.floor(r() * 6); const ids = [1, 2, 3, 4, 5, 6].filter(n => n !== lost); let perm = shuffled(ids, r); if (perm.every((n, i) => n === ids[i])) perm.reverse();
      say(L("Packets are on their way. Different roads!", "¡Los paquetes van en camino por rutas distintas!"));
      [1, 2, 3, 4, 5, 6].forEach((n, i) => { const arr = n === lost ? 0 : perm.indexOf(n), dur = 2.2 + arr * .8 - i * .1 + (n === lost ? 0 : 0), route = Math.floor(r() * 3);
        s3?.pkt.launch(n, route, Math.max(1.6, dur), n === lost, i * .15); if (n !== lost) setTimeout(() => { if (tok === rtok) tile(n); }, (i * .15 + Math.max(1.6, dur) + .1) * 1000); });
      setTimeout(() => { if (tok !== rtok) return; reB.disabled = false; reB.classList.add("pulse"); say(L(`Packet ${lost} was lost! Resend it.`, `¡Se perdió el paquete ${lost}! Reenvíalo.`), "bad"); }, 2800); });
    reB.addEventListener("click", () => { if (reB.disabled) return; reB.disabled = true; reB.classList.remove("pulse"); s3?.pkt.launch(lost, 1, 2, false, 0); tick("pkt", "resend"); gain(6);
      say(L("TCP asks for it again. It arrives!", "TCP lo pide otra vez. ¡Llega!"), "good"); const tok = rtok; setTimeout(() => { if (tok === rtok) tile(lost); }, 2200); });
    drawSlots();
  })();

  /* ===== 4. SERVERS ===== */
  (() => {
    const p = panels.srv, ask = $(`<div class="ar-card"></div>`), srvs = $(`<div class="ar-card"><h3>🗄️</h3><div class="nc-servers"></div></div>`); p.append(ask, srvs);
    const grid = srvs.querySelector(".nc-servers"); let busy = false;
    const order = () => shuffled(TASKS.map((_, i) => i), rng(300 + Math.floor(st.srv.n / 5))), cur = () => order()[st.srv.n % 5];
    function drawAsk() { const i = cur(), tk = TASKS[i]; ask.innerHTML = `<div class="nc-task" style="--c:${tk.c}"><span>🙋</span><b>${tk.t()}</b></div><div class="nc-prog">${[0, 1, 2, 3, 4].map(k => `<i class="${k < st.srv.n % 5 ? "on" : ""}"></i>`).join("")}</div>`; ask.append(subBar("srv")); renderSubs(); }
    TASKS.forEach((tk, i) => { const b = $(`<button class="nc-server" style="--c:${tk.c}"><span>${tk.ico}</span><b>${tk.n()}</b></button>`); grid.append(b);
      b.addEventListener("click", () => { if (busy) return; busy = true; const right = cur() === i; s3?.srv.reset();
        const fin = () => { busy = false; if (right) { st.srv.n++; api.save(); drawAsk(); } };
        if (right) { gain(6); rec("Servers", tk.t(), tk.n() + L(" server", " servidor") + tries()); wrongN = 0; tick("srv", tk.k); say(L("The server answered the client!", "¡El servidor respondió al cliente!"), "good"); } else { wrongN++; shake(b); say(L("Wrong server for that job.", "Servidor equivocado para esa tarea."), "bad"); }
        s3?.srv.request(i, right); setTimeout(fin, right ? 3400 : 1800); }); });
    drawAsk();
  })();

  /* ===== 5. FIX-IT ===== */
  (() => {
    const p = panels.fix, tools = $(`<div class="ar-card"></div>`), culprit = $(`<div class="ar-card"><h3>❓</h3><div class="nc-servers"></div></div>`); p.append(tools, culprit);
    st.fix.order ??= shuffled(["cable", "router", "site"], rng(Date.now() % 9973)); const grid = culprit.querySelector(".nc-servers"); let out = null, busy = false;
    const cur = () => st.fix.order[st.fix.i];
    function draw() { const all = st.fix.i >= 3; tools.innerHTML = `<div class="nc-task" style="--c:#ff5468"><span>${all ? "✅" : "🌐❌"}</span><b>${all ? L("Network online!", "¡Red en línea!") : "Funfun.com"}</b></div>
      <div class="nc-row"><button class="nc-btn big" id="ping" ${all ? "disabled" : ""}>📡 Ping</button><button class="nc-btn big" id="phone" ${all ? "disabled" : ""}>📱 ${L("Phone test", "Prueba móvil")}</button></div><div class="nc-out"></div><div class="nc-prog">${[0, 1, 2].map(i => `<i class="${i < st.fix.i ? "on" : ""}"></i>`).join("")}</div>`;
      tools.append(subBar("fix")); renderSubs(); out = tools.querySelector(".nc-out"); if (!all) s3?.fix.set(cur()); else s3?.fix.set("ok");
      tools.querySelector("#ping")?.addEventListener("click", () => { const f = cur(), ok = f === "site"; lastPing = ok; st.fix.pinged = true; api.save(); s3?.fix.ping(ok); out.innerHTML = ""; for (let i = 0; i < 4; i++) setTimeout(() => out.insertAdjacentHTML("beforeend", ok ? `<span class="ok">✔ ${20 + i * 3} ms</span>` : `<span class="no">✖ timeout</span>`), 1200 + i * 350); });
      tools.querySelector("#phone")?.addEventListener("click", () => { const f = cur(), ok = f !== "site"; lastPhone = ok; st.fix.phoned = true; api.save(); s3?.fix.phoneTest(ok); out.innerHTML = `<span class="${ok ? "ok" : "no"}" style="animation-delay:1.3s">📱 ${ok ? "✔ Funfun" : "✖ Funfun"}</span>`; setTimeout(() => {}, 0); }); }
    Object.keys(FAULTS).forEach(k => { const b = $(`<button class="nc-server" style="--c:#ff5468"><span>${FAULTS[k].ico}</span><b>${FAULTS[k].n()}</b></button>`); grid.append(b);
      b.addEventListener("click", () => { if (busy || st.fix.i >= 3) return; const f = cur(); if (k !== f) { wrongN++; shake(b); s3?.fix.shake(); say(L("Not that one. Use the tests and look at the lights!", "Esa no. ¡Usa las pruebas y mira las luces!"), "bad"); return; }
        busy = true; say(f === "site" ? L("Nothing to fix on our side: wait for the site.", "Nada que arreglar de nuestro lado: espera al sitio.") : f === "router" ? L("Switch it off and on again (ask permission first!)", "Apágalo y enciéndelo (¡pide permiso antes!)") : L("Plug the cable back in.", "Vuelve a enchufar el cable."), "good");
        const fin = () => { busy = false; gain(15); const w = x => x === null ? "-" : x ? L("replies", "responde") : L("fails", "falla"); rec("Fix-it", L("Fault: ", "Averia: ") + FAULTS[f].n(), L("Fixed. Ping ", "Arreglada. Ping ") + w(lastPing) + L(", phone test ", ", prueba movil ") + w(lastPhone) + tries()); wrongN = 0; lastPing = lastPhone = null; tick("fix", f); st.fix.i++; api.save(); draw(); if (st.fix.i >= 3) say(L("Everything works again!", "¡Todo funciona otra vez!"), "good"); };
        s3?.fix.repair(); setTimeout(fin, f === "cable" ? 900 : 1600); }); });
    p.show = draw; draw();
  })();

  host.append(root, bonusEl); renderTop(); renderSubs(); select(st.tab); mountBonus(bonusEl); setInterval(() => { if (root.isConnected) coachCheck(); }, 600);
  say(L("Welcome to Network City! Pick a station.", "¡Bienvenido a Ciudad Red! Elige una estación."));
  initScene(view).then(s => { s3 = s; if (s) { s.goto(st.tab); redrawAll(); } else view.prepend($(`<div class="ar-nogl">${L("3D view is not available here, but every control below still works.", "La vista 3D no está disponible aquí, pero todos los controles funcionan.")}</div>`)); }).catch(e => console.error("3D scene failed", e));
  function redrawAll() { select(st.tab); Object.values(panels).forEach(pp => pp.show?.()); }
}

/* =====================================================================
   ORIENT: from scratch. Meet the gear (real photos), find it, then order the journey.
   ===================================================================== */
const GEAR = [
  { id: "router", n: () => L("Router", "Router"), job: () => L("Shares the Internet with every device at home.", "Reparte Internet a todos los dispositivos de casa.") },
  { id: "modem", n: () => L("Modem", "Módem"), job: () => L("Talks to your ISP, the Internet company.", "Habla con tu ISP, la compañía de Internet.") },
  { id: "tower", n: () => L("Phone tower", "Torre de telefonía"), job: () => L("Gives phones mobile Internet. Handy for the phone test!", "Da Internet móvil a los teléfonos. ¡Útil para la prueba del móvil!") },
];
const IMG = id => `photos/${id}.jpg`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const CREDIT = () => L("Photos: Evan-Amos (public domain), VulcanSphere (CC BY 4.0), Cvmontuy (CC BY-SA 4.0), from Wikimedia Commons.", "Fotos: Evan-Amos (dominio público), VulcanSphere (CC BY 4.0), Cvmontuy (CC BY-SA 4.0), de Wikimedia Commons.");
const JOURNEY = [
  { id: "cl", ico: "💻", n: () => L("Your laptop (client)", "Tu portátil (cliente)") }, { id: "rt", ico: "📡", n: () => L("Router", "Router") },
  { id: "isp", ico: "🏢", n: () => L("ISP", "ISP") }, { id: "sv", ico: "🗄️", n: () => L("Web server", "Servidor web") },
];
function orient(host) {
  host.innerHTML = "";
  const box = document.createElement("div"); box.className = "gear"; host.append(box);
  const seen = new Set();
  function phaseA() {
    box.innerHTML = `<div class="gear__lesson">${L("Chapter 6 · Lessons 3 & 4: Addresses, Clients and Servers", "Capítulo 6 · Lecciones 3 y 4: Direcciones, clientes y servidores")}</div>
      <h3 class="gear__h">${L("Meet the gear: tap each photo", "Conoce el equipo: toca cada foto")} <span class="gear__c">${seen.size}/3</span></h3><div class="gear__grid"></div><p class="gear__cr">${CREDIT()}</p>`;
    const grid = box.querySelector(".gear__grid");
    GEAR.forEach(g => { const b = document.createElement("button"); b.className = "gear__card" + (seen.has(g.id) ? " on" : ""); b.type = "button"; b.setAttribute("aria-label", g.n());
      b.innerHTML = `<img src="${IMG(g.id)}" alt="" loading="lazy"><span class="gear__n">${seen.has(g.id) ? g.n() + " · " + g.job() : "?"}</span>`;
      b.addEventListener("click", () => { seen.add(g.id); phaseA(); if (seen.size === 3) setTimeout(phaseB, 1000); }); grid.append(b); });
  }
  function phaseB() {
    const order = shuffle(GEAR); let i = 0;
    const draw = () => {
      if (i >= order.length) return phaseC();
      const t = order[i]; box.innerHTML = `<h3 class="gear__h">${L("Find the", "Encuentra")}: <b>${t.n()}</b> <span class="gear__c">${i + 1}/3</span></h3><div class="gear__grid"></div><p class="gear__cr gear__fb" role="status">&nbsp;</p>`;
      const grid = box.querySelector(".gear__grid"), fb = box.querySelector(".gear__fb");
      shuffle(GEAR).forEach(g => { const b = document.createElement("button"); b.className = "gear__card"; b.type = "button"; b.setAttribute("aria-label", g.n()); b.innerHTML = `<img src="${IMG(g.id)}" alt="">`;
        b.addEventListener("click", () => { if (g.id === t.id) { b.classList.add("good"); fb.textContent = "✓ " + t.n() + ": " + t.job(); setTimeout(() => { i++; draw(); }, 1100); }
          else { b.classList.remove("shk"); void b.offsetWidth; b.classList.add("shk", "bad"); fb.textContent = L(`That is the ${g.n()}. ${g.job()} Try again!`, `Ese es el ${g.n()}. ${g.job()} ¡Inténtalo otra vez!`); } });
        grid.append(b); });
    };
    draw();
  }
  function phaseC() {
    let next = 0; const want = ["cl", "rt", "isp", "sv"];
    box.innerHTML = `<h3 class="gear__h">${L("A web page's journey: tap the stops in order", "El viaje de una página web: toca las paradas en orden")}</h3><p class="gear__cr">${L("Your laptop asks. Who does it ask first? Who answers at the end?", "Tu portátil pide. ¿A quién pide primero? ¿Quién responde al final?")}</p><div class="jny"></div><p class="gear__cr gear__fb" role="status">&nbsp;</p>`;
    const row = box.querySelector(".jny"), fb = box.querySelector(".gear__fb");
    shuffle(JOURNEY).forEach(s => { const b = document.createElement("button"); b.type = "button"; b.className = "jny__s"; b.innerHTML = `<span>${s.ico}</span><b>${s.n()}</b><em></em>`;
      b.addEventListener("click", () => { if (b.classList.contains("good")) return;
        if (s.id === want[next]) { b.classList.add("good"); b.querySelector("em").textContent = ++next; fb.textContent = next === 4 ? L("✓ Client asks, the ISP is the road, the server answers. You are ready!", "✓ El cliente pide, el ISP es el camino, el servidor responde. ¡Listo!") : "✓"; if (next === 4) box.insertAdjacentHTML("beforeend", `<p class="gear__cr"><b>${L("Now open the Investigate stage.", "Ahora abre la etapa Investigar.")}</b></p>`); }
        else { b.classList.remove("shk"); void b.offsetWidth; b.classList.add("shk", "bad"); fb.textContent = L("Not that one yet. Think: who asks first?", "Todavía no. Piensa: ¿quién pide primero?"); } });
      row.append(b); });
  }
  phaseA();
}

/* =====================================================================
   BONUS: Address Gate (timing + sorting catch). 120 s on the wall clock. No fail state, silent.
   ===================================================================== */
const GATE_BINS = [
  { id: "mac", c: "#35d0ff", n: () => "MAC", h: () => L("A MAC has 6 pairs joined by colons.", "Una MAC tiene 6 pares unidos por dos puntos.") },
  { id: "v4", c: "#ff9a3c", n: () => "IPv4", h: () => L("IPv4: 4 numbers from 0 to 255, joined by dots.", "IPv4: 4 números de 0 a 255 unidos por puntos.") },
  { id: "v6", c: "#a97bff", n: () => "IPv6", h: () => L("IPv6: groups of letters A-F and numbers, joined by colons.", "IPv6: grupos de letras A-F y números unidos por dos puntos.") },
  { id: "no", c: "#ff5468", n: () => L("Not valid", "No válida"), h: () => L("Too big (over 255) or the wrong number of parts.", "Demasiado grande (más de 255) o con partes de más o de menos.") },
];
const GATE_ITEMS = [["00:60:B0:1A:2B:3C", "mac"], ["98.251.5.62", "v4"], ["2001:0DB8:85A3::8A2E", "v6"], ["98.251.5.362", "no"], ["A4:1B:7C:09:E2:5D", "mac"], ["203.0.113.7", "v4"],
  ["12.300.4.1", "no"], ["2001::9D38:6AB8:30F3", "v6"], ["F4:3E:9D:5D:6E:7F", "mac"], ["192.168.1.20", "v4"], ["1.2.3", "no"], ["FE80::1A2B:3C4D", "v6"],
  ["8C:AE:4C:22:C4:08", "mac"], ["10.0.0.256", "no"], ["172.16.254.1", "v4"], ["2A00:1450:4009::200E", "v6"]];
function mountBonus(box) {
  const DUR = 120, EACH = 5000, N = 24;
  const launch = () => {
    box.innerHTML = `<div class="hop hop--launch"><div><h3>${L("Bonus round: Address Gate", "Ronda bonus: Puerta de direcciones")}</h3><p>${L("Addresses slide toward the gate. Tap the right box (or press 1-4). Tap inside the glowing gate for double points. 2 minutes, nothing to lose!", "Las direcciones se deslizan hacia la puerta. Toca la caja correcta (o pulsa 1-4). Toca dentro de la puerta brillante para doble puntuación. 2 minutos, ¡nada que perder!")}</p></div>
      <div class="hop__acts"><button class="btn btn--primary" data-p>${L("Play", "Jugar")}</button><button class="btn btn--ghost" data-s>${L("Skip", "Saltar")}</button></div></div>`;
    box.querySelector("[data-p]").addEventListener("click", play);
    box.querySelector("[data-s]").addEventListener("click", () => { box.innerHTML = `<p class="gear__cr">${L("Bonus round skipped.", "Ronda bonus saltada.")} <button class="btn btn--ghost" type="button" data-b>${L("Play it", "Jugar")}</button></p>`; box.querySelector("[data-b]").addEventListener("click", launch); });
  };
  function play() {
    const order = shuffle(GATE_ITEMS).concat(shuffle(GATE_ITEMS)).slice(0, N); let score = 0, streak = 0, best = 0, hits = 0, answered = 0, shown = -1, cur = null, over = false;
    box.innerHTML = `<div class="hop gate"><div class="hop__top"><span data-t>2:00</span><span data-sc>0 ★</span><span data-st></span></div>
      <div class="gate__lane" aria-hidden="true"><i class="gate__dots"></i><b class="gate__door"></b><span class="gate__pk"></span></div>
      <div class="hop__fb" role="status">&nbsp;</div><div class="gate__bins"></div></div>`;
    const $q = s => box.querySelector(s), pk = $q(".gate__pk"), fb = $q(".hop__fb"), bins = $q(".gate__bins"), lane = $q(".gate__lane");
    GATE_BINS.forEach((b, k) => { const btn = document.createElement("button"); btn.type = "button"; btn.className = "gate__bin"; btn.style.setProperty("--c", b.c); btn.innerHTML = `<b>${b.n()}</b><kbd>${k + 1}</kbd>`; btn.addEventListener("click", () => pick(b.id, btn)); bins.append(btn); });
    const t0 = Date.now();
    const say = (txt, cls) => { fb.className = "hop__fb " + (cls || ""); fb.textContent = txt; };
    function pick(id, btn) { if (!cur || cur.done || over) return; const pos = (Date.now() - cur.t) / EACH, ingate = pos > .38 && pos < .62; cur.done = true; answered++;
      const bin = GATE_BINS.find(x => x.id === cur.bin);
      if (id === cur.bin) { hits++; streak++; best = Math.max(best, streak); const pts = (10 + Math.min(streak, 5) * 2) * (ingate ? 2 : 1); score += pts; pk.classList.add("ok"); say((ingate ? L("PERFECT! ", "¡PERFECTO! ") : "✓ ") + `+${pts} · ` + bin.h(), "good"); lane.classList.add("flash"); }
      else { streak = 0; btn.classList.add("shk"); pk.classList.add("no"); say(L("It was ", "Era ") + bin.n() + " · " + bin.h(), "bad"); }
      setTimeout(() => { btn.classList.remove("shk"); lane.classList.remove("flash"); }, 450); upd(); }
    function upd() { $q("[data-sc]").textContent = score + " ★"; $q("[data-st]").textContent = streak > 1 ? "🔥 ×" + streak : ""; }
    document.addEventListener("keydown", key); function key(e) { if (!box.isConnected) { document.removeEventListener("keydown", key); return; } const k = +e.key; if (k >= 1 && k <= 4) bins.children[k - 1].click(); }
    const clock = setInterval(() => { const el = Date.now() - t0, left = Math.max(0, DUR - Math.round(el / 1000)); $q("[data-t]").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
      const idx = Math.floor(el / EACH);
      if (idx !== shown && idx < N) { if (cur && !cur.done) { streak = 0; const bn = GATE_BINS.find(x => x.id === cur.bin); say(L("It slid past. It was ", "Se pasó. Era ") + bn.n() + " · " + bn.h(), "bad"); upd(); }
        shown = idx; const [txt, bin] = order[idx]; cur = { txt, bin, t: t0 + idx * EACH, done: false }; pk.className = "gate__pk"; pk.textContent = txt; pk.style.display = ""; }
      if (cur) { const pos = (Date.now() - cur.t) / EACH; pk.style.left = (Math.min(pos, 1) * 100) + "%"; pk.style.opacity = cur.done ? .0 : 1; if (cur.done && pos > 0) pk.style.transition = "opacity .3s"; }
      if (el >= DUR * 1000 && !over) { over = true; clearInterval(clock); document.removeEventListener("keydown", key);
        box.innerHTML = `<div class="hop hop--launch"><div><h3>${L("Round complete!", "¡Ronda completa!")}</h3><p>${L(`Score ${score} · ${hits}/${answered} right · best streak ${best}`, `Puntos ${score} · ${hits}/${answered} correctas · mejor racha ${best}`)}</p></div><div class="hop__acts"><button class="btn btn--primary" data-p>${L("Play again", "Jugar otra vez")}</button></div></div>`; box.querySelector("[data-p]").addEventListener("click", play); } }, 80);
  }
  launch();
}

const simulation = {
  orient,
  investigate(host, sim) { host.innerHTML = ""; mkSim(host, { state: sim.state, save: () => sim.saveState(), sim }); },
};
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root"); if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});
</script>
