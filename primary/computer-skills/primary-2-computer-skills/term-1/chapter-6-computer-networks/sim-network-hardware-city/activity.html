  { id: "switch", n: () => L("Switch", "Switch"), job: () => L("Sends data only to the right computer.", "Envía datos solo al ordenador correcto.") },
  { id: "plug", n: () => L("Ethernet plug", "Conector Ethernet"), job: () => L("Joins a computer to a cable network.", "Une un ordenador a una red por cable.") },
  { id: "tower", n: () => L("Phone tower", "Torre de telefonía"), job: () => L("Gives phones a signal while they move.", "Da señal a los teléfonos en movimiento.") },
  { id: "fibre", n: () => L("Fibre", "Fibra"), job: () => L("Sends data as pulses of light.", "Envía datos como pulsos de luz.") },
];
const IMG = id => `photos/${id}.jpg`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const CREDIT = () => L("Photos: Evan-Amos (public domain), William Hook (CC BY-SA 2.0), Justin (CC BY 2.0), Cvmontuy (CC BY-SA 4.0), VulcanSphere (CC BY 4.0), Quantumavik (CC BY 4.0), from Wikimedia Commons.", "Fotos: Evan-Amos (dominio público), William Hook (CC BY-SA 2.0), Justin (CC BY 2.0), Cvmontuy (CC BY-SA 4.0), VulcanSphere (CC BY 4.0), Quantumavik (CC BY 4.0), de Wikimedia Commons.");

/* ---------- ORIENT: meet the gear (tap to reveal, then find it) ---------- */
function orient(host) {
  host.innerHTML = "";
  const box = document.createElement("div"); box.className = "gear"; host.append(box);
  const seen = new Set();
  function phaseA() {
    box.innerHTML = `<div class="gear__lesson">${L("Chapter 6 · Lessons 1 & 2: Network Hardware and Connecting Computers", "Capítulo 6 · Lecciones 1 y 2: Hardware de red y conexión de ordenadores")}</div>
      <h3 class="gear__h">${L("Meet the network gear: tap each photo", "Conoce el equipo de red: toca cada foto")} <span class="gear__c">${seen.size}/6</span></h3><div class="gear__grid"></div><p class="gear__cr">${CREDIT()}</p>`;
    const grid = box.querySelector(".gear__grid");
    GEAR.forEach(g => { const b = document.createElement("button"); b.className = "gear__card" + (seen.has(g.id) ? " on" : ""); b.type = "button"; b.setAttribute("aria-label", g.n());
      b.innerHTML = `<img src="${IMG(g.id)}" alt="" loading="lazy"><span class="gear__n">${seen.has(g.id) ? g.n() + " · " + g.job() : "?"}</span>`;
      b.addEventListener("click", () => { seen.add(g.id); phaseA(); if (seen.size === 6) setTimeout(phaseB, 900); }); grid.append(b); });
  }
  function phaseB() {
    const order = shuffle(GEAR); let i = 0, ok = 0;
    const draw = () => {
      if (i >= order.length) { box.innerHTML = `<h3 class="gear__h">${L("You can name them all!", "¡Los sabes todos!")} ${ok}/6</h3><p class="gear__cr">${L("Now open the Investigate stage and build a network with them.", "Ahora abre la etapa Investigar y construye una red con ellos.")}</p><button class="btn btn--ghost" type="button">${L("Play again", "Jugar otra vez")}</button>`; box.querySelector("button").addEventListener("click", () => { seen.clear(); phaseA(); }); return; }
      const t = order[i]; box.innerHTML = `<h3 class="gear__h">${L("Find the", "Encuentra")}: <b>${t.n()}</b> <span class="gear__c">${i + 1}/6</span></h3><div class="gear__grid"></div><p class="gear__cr gear__fb" role="status">&nbsp;</p>`;
      const grid = box.querySelector(".gear__grid"), fb = box.querySelector(".gear__fb");
      shuffle(GEAR).forEach(g => { const b = document.createElement("button"); b.className = "gear__card"; b.type = "button"; b.setAttribute("aria-label", g.n()); b.innerHTML = `<img src="${IMG(g.id)}" alt="">`;
        b.addEventListener("click", () => { if (g.id === t.id) { b.classList.add("good"); ok += b.dataset.miss ? 0 : 1; fb.textContent = "✓ " + t.n() + ": " + t.job(); setTimeout(() => { i++; draw(); }, 1100); }
          else { b.dataset.miss = "1"; b.classList.remove("shk"); void b.offsetWidth; b.classList.add("shk", "bad"); fb.textContent = L(`That is the ${g.n()}. ${g.job()} Try again!`, `Ese es el ${g.n()}. ${g.job()} ¡Inténtalo otra vez!`); } });
        grid.append(b); });
    };
    draw();
  }
  phaseA();
}

/* ---------- BONUS: Packet Hopper (Frogger-style crossing, 120 s, no fail state) ---------- */
const HQ = [
  { a: "router", o: ["router", "switch", "tower"], q: () => L("Which box shares the Internet with every device?", "¿Qué caja reparte Internet a todos los dispositivos?"), h: () => L("The router joins networks together.", "El router une redes.") },
  { a: "switch", o: ["switch", "modem", "plug"], q: () => L("Which box sends data only to the right computer?", "¿Qué caja envía datos solo al ordenador correcto?"), h: () => L("A switch knows each computer's address.", "Un switch conoce la dirección de cada ordenador.") },
  { a: "modem", o: ["modem", "switch", "router"], q: () => L("Which box talks to the Internet company?", "¿Qué caja habla con la compañía de Internet?"), h: () => L("The modem understands the provider's signal.", "El módem entiende la señal del proveedor.") },
  { a: "plug", o: ["plug", "fibre", "tower"], q: () => L("Which plug joins a computer to an Ethernet cable?", "¿Qué conector une un ordenador a un cable Ethernet?"), h: () => L("Ethernet cables end in this plug.", "Los cables Ethernet terminan en este conector.") },
  { a: "tower", o: ["tower", "router", "plug"], q: () => L("Which one gives phones Internet while they move?", "¿Cuál da Internet a los teléfonos en movimiento?"), h: () => L("Cell towers make cellular networks.", "Las torres forman las redes celulares.") },
  { a: "fibre", o: ["fibre", "plug", "modem"], q: () => L("Which cable sends data as light?", "¿Qué cable envía datos como luz?"), h: () => L("Fibre-optic cables use pulses of light.", "La fibra óptica usa pulsos de luz.") },
];
const gname = id => GEAR.find(g => g.id === id).n();
function mountBonusCard(box) {
  const DUR = 120, STEPS = 6;
  const launch = () => {
    box.innerHTML = `<div class="hop hop--launch"><div><h3>${L("Bonus round: Packet Hopper", "Ronda bonus: Salto de paquetes")}</h3><p>${L("Hop your data packet up to the Internet. Pick the right photo each time. 2 minutes, no losing!", "Salta con tu paquete de datos hasta Internet. Elige la foto correcta cada vez. 2 minutos, ¡sin perder!")}</p></div><div class="hop__acts"><button class="ar-go" style="--c:#ff9a3c" data-p>${L("Play", "Jugar")}</button><button class="ar-go ar-go--ghost" data-s>${L("Skip", "Saltar")}</button></div></div><p class="gear__cr">${CREDIT()}</p>`;
    box.querySelector("[data-p]").addEventListener("click", play); box.querySelector("[data-s]").addEventListener("click", () => { box.innerHTML = `<p class="gear__cr">${L("Bonus round skipped. You can still play it any time.", "Ronda bonus saltada. Puedes jugarla cuando quieras.")} <button class="btn btn--ghost" type="button" data-p>${L("Play", "Jugar")}</button></p>`; box.querySelector("[data-p]").addEventListener("click", play); });
  };
  function play() {
    let left = DUR, rung = 0, score = 0, streak = 0, best = 0, hits = 0, tot = 0, q = null, lock = false; let deck = [];
    box.innerHTML = `<div class="hop"><div class="hop__top"><span data-t>2:00</span><span data-sc>0</span><span data-st></span></div>
      <div class="hop__ladder" aria-hidden="true">${Array.from({ length: STEPS }, () => "<i></i>").join("")}<b class="hop__pk"></b><em>${L("Internet", "Internet")}</em></div>
      <div class="hop__q" role="status"></div><div class="hop__opts"></div><div class="hop__fb" role="status">&nbsp;</div></div>`;
    const $q = s => box.querySelector(s), pk = $q(".hop__pk"), qEl = $q(".hop__q"), oEl = $q(".hop__opts"), fb = $q(".hop__fb");
    const setPk = () => { pk.style.bottom = (rung / STEPS * 100) + "%"; $q("[data-sc]").textContent = score + " ★"; $q("[data-st]").textContent = streak > 1 ? "🔥 ×" + streak : ""; };
    const next = () => { if (left <= 0) return; if (!deck.length) deck = shuffle(HQ); q = deck.pop(); lock = false; qEl.textContent = q.q(); oEl.innerHTML = ""; fb.innerHTML = "&nbsp;"; fb.className = "hop__fb";
      shuffle(q.o).forEach((id, k) => { const b = document.createElement("button"); b.type = "button"; b.className = "hop__o"; b.dataset.id = id; b.setAttribute("aria-label", `${k + 1}: ${gname(id)}`); b.innerHTML = `<img src="${IMG(id)}" alt=""><kbd>${k + 1}</kbd>`; b.addEventListener("click", () => pick(b)); oEl.append(b); }); };
    const pick = b => { if (lock || left <= 0) return; lock = true; tot++;
      if (b.dataset.id === q.a) { hits++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; rung++; b.classList.add("good"); fb.className = "hop__fb good"; fb.textContent = "✓ " + gname(q.a) + " · " + q.h();
        if (rung >= STEPS) { rung = 0; score += 50; fb.textContent = L("Delivered to the Internet! +50", "¡Entregado a Internet! +50"); pk.classList.add("pop"); setTimeout(() => pk.classList.remove("pop"), 600); } }
      else { streak = 0; rung = Math.max(0, rung - 1); b.classList.add("bad", "shk"); oEl.querySelector(`[data-id="${q.a}"]`).classList.add("good"); fb.className = "hop__fb bad"; fb.textContent = L("It was the ", "Era ") + gname(q.a) + " · " + q.h(); }
      setPk(); setTimeout(next, 1300); };
    box.addEventListener("keydown", e => { if (/^[1-3]$/.test(e.key) && !lock) oEl.children[+e.key - 1]?.click(); });
    const t0 = Date.now(), clock = setInterval(() => { left = Math.max(0, DUR - Math.round((Date.now() - t0) / 1000)); $q("[data-t]").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
      if (left <= 0) { clearInterval(clock); lock = true; box.innerHTML = `<div class="hop hop--launch"><div><h3>${L("Round complete!", "¡Ronda completa!")}</h3><p>${L(`Score ${score} · ${hits}/${tot} right · best streak ${best}`, `Puntos ${score} · ${hits}/${tot} correctas · mejor racha ${best}`)}</p></div><div class="hop__acts"><button class="ar-go" style="--c:#ff9a3c" data-p>${L("Play again", "Jugar otra vez")}</button></div></div>`; box.querySelector("[data-p]").addEventListener("click", play); } }, 250);
    setPk(); next();
  }
  launch();
}

/* =====================================================================
   MOUNT
   ===================================================================== */
const simulation = {
  orient,
  investigate(host, sim) { host.innerHTML = ""; mkSim(host, { state: sim.state, save: () => sim.saveState(), sim }); },
};
mountActivity({ simulation }).catch(e => {
  console.error("Activity failed to start:", e);
  const r = document.getElementById("lab-root");
  if (r) r.innerHTML = '<p class="nav-empty">Something went wrong. Please refresh.</p>';
});

</script></body></html>
