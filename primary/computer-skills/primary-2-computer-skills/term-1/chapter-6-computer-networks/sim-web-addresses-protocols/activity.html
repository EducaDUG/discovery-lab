      { k: "shttp", hl: "[data-c=lock],[data-c=send]", t: L("Step 1: pick http:// (no lock) and press the key button to send a password.", "Paso 1: elige http:// (sin candado) y pulsa el botón de la llave para enviar una contraseña.") },
      { k: "shttps", hl: "[data-c=lock],[data-c=send]", t: L("Step 2: now pick https:// with the lock and send again. What does the snooper see?", "Paso 2: ahora elige https:// con candado y envía otra vez. ¿Qué ve el espía?") },
      { k: "sspot", hl: "[data-c=spot]", need: () => st.sec.spot >= 3, t: L("Step 3: in each pair, tap the web address that is safe for a password.", "Paso 3: en cada pareja, toca la dirección web segura para una contraseña.") },
    ],
  };
  const HELP = {
    dns: L("Every server has an IP number, but numbers are hard to remember. DNS is the Internet's phone book: you give it a name (forward lookup) and it gives the number. Going from number back to name is a reverse lookup.", "Cada servidor tiene un número IP, pero los números son difíciles de recordar. El DNS es la guía telefónica de Internet: le das un nombre (búsqueda directa) y devuelve el número. De número a nombre es una búsqueda inversa."),
    dom: L("The ending of a domain says what kind of owner it is: .com business, .org charity, .gov government, .edu school or university, .mil army, .uk a country.", "La terminación de un dominio dice qué tipo de dueño es: .com empresa, .org organización sin ánimo de lucro, .gov gobierno, .edu colegio o universidad, .mil ejército, .uk un país."),
    url: L("A URL has parts: protocol (how to talk), server name (which computer), domain and ending (who owns it) and path (which file).", "Una URL tiene partes: protocolo (cómo hablar), nombre de servidor (qué ordenador), dominio y terminación (quién es el dueño) y ruta (qué archivo)."),
    post: L("A protocol is a language for sending data. HTTP loads web pages, FTP moves files, SMTP sends email, and POP or IMAP download email. IMAP keeps mail on the server so all your devices match.", "Un protocolo es un idioma para enviar datos. HTTP carga páginas web, FTP mueve archivos, SMTP envía correo y POP o IMAP lo descargan. IMAP deja el correo en el servidor para que todos tus dispositivos coincidan."),
    sec: L("Plain http:// sends words anyone in the middle can read. https:// uses TLS (SSL) to scramble the data so only you and the server can read it. Look for the lock.", "http:// normal envía palabras que cualquiera en medio puede leer. https:// usa TLS (SSL) para mezclar los datos y solo tú y el servidor puedan leerlos. Busca el candado."),
  };
  function coachIdx(id) { return st.coach[id] || 0; }
  function coachShow() {
    root.querySelectorAll("[data-chl]").forEach(e => e.removeAttribute("data-chl"));

    const t = $(`<div class="coach__t" role="status"></div>`); t.textContent = done ? L("Station complete! Try another one, or replay this one.", "¡Estación completa! Prueba otra, o repite esta.") : steps[i].t; coachEl.append(t);
    const help = $(`<button class="coach__b" aria-expanded="false" aria-label="${L("What does this mean?", "¿Qué significa esto?")}">?</button>`), hp = $(`<p class="coach__h" hidden></p>`); hp.textContent = HELP[id];
    help.addEventListener("click", () => { hp.hidden = !hp.hidden; help.setAttribute("aria-expanded", String(!hp.hidden)); }); coachEl.append(help);
    if (done) { const nx = TAB[(TAB.findIndex(x => x.id === id) + 1) % TAB.length]; const b = $(`<button class="coach__b coach__next">${L("Next station", "Siguiente estación")} ▶</button>`); b.addEventListener("click", () => select(nx.id)); coachEl.append(b); }
    coachEl.append(hp);
    if (!done) root.querySelectorAll(steps[i].hl).forEach(e => e.setAttribute("data-chl", "1"));
  }
  function cdone(key) { const id = st.tab, steps = COACH[id], i = coachIdx(id); if (!steps || i >= steps.length || steps[i].k !== key || (steps[i].need && !steps[i].need())) return; st.coach[id] = i + 1; api.save(); pop("✓"); coachShow(); }

  const fact = $(`<div class="ar-fact"><button>${L("Fun fact","Dato curioso")} 💡</button><p hidden>${L("The Domain Name System was created in 1983. Before that, computers used one shared list of names!","¡El Sistema de Nombres de Dominio se creó en 1983. Antes, los ordenadores usaban una sola lista compartida de nombres!")}</p></div>`);
  fact.querySelector("button").addEventListener("click", () => { fact.querySelector("p").hidden = false; fact.querySelector("button").hidden = true; gain(5); });
  root.append(fact);
  host.append(root); renderTop(); mountBonus(bonusEl); select(st.tab); say(L("Welcome to Internet Town! Pick a station below.","¡Bienvenido a Ciudad Internet! Elige una estación abajo."));
  initScene(view, st, rt).then(s => { scene3d = s; if (s) s.goto(st.tab); else view.prepend($(`<div class="ar-nogl">${L("3D view is not available on this device, but every control below still works.","La vista 3D no está disponible en este dispositivo, pero todos los controles funcionan.")}</div>`)); })
    .catch(e => console.error("3D scene failed", e));
}

/* =====================================================================
   ORIENT: learn the parts of a web address, then label a real photo
   ===================================================================== */
const PHOTO_CREDIT = () => L("Photo: Derrick Coetzee (CC0, public domain), from Wikimedia Commons.", "Foto: Derrick Coetzee (CC0, dominio público), de Wikimedia Commons.");
const PARTS = [
  { k: "p", t: "https://", n: () => L("Protocol", "Protocolo"), j: () => L("How the browser talks to the server. The S means secure.", "Cómo habla el navegador con el servidor. La S significa seguro.") },
  { k: "h", t: "www.", n: () => L("Server name", "Nombre de servidor"), j: () => L("Which server (computer) to call. www is the web server.", "A qué servidor (ordenador) llamar. www es el servidor web.") },
  { k: "d", t: "zoo", n: () => L("Domain", "Dominio"), j: () => L("The owner's own unique name. Nobody else can use it.", "El nombre único del dueño. Nadie más puede usarlo.") },
  { k: "t", t: ".org", n: () => L("Ending (top-level domain)", "Terminación (dominio de nivel superior)"), j: () => L("The very end, after the last dot. It says what kind of owner it is.", "El final, después del último punto. Dice qué tipo de dueño es.") },
  { k: "f", t: "/pets/cat.png", n: () => L("Path", "Ruta"), j: () => L("Which page or file to open on that server.", "Qué página o archivo abrir en ese servidor.") },
];
const HOTS = [
  { id: "laptop", x: .63, y: .70, n: () => L("Your computer (the client)", "Tu ordenador (el cliente)"), j: () => L("A client asks servers for things, like web pages.", "Un cliente pide cosas a los servidores, como páginas web.") },
  { id: "cables", x: .68, y: .46, n: () => L("Cables", "Cables"), j: () => L("Cables carry the data between computers and servers.", "Los cables llevan los datos entre ordenadores y servidores.") },
  { id: "server", x: .90, y: .28, n: () => L("A server rack", "Un armario de servidores"), j: () => L("Servers are computers that store websites and mail. This one is closed behind a mesh door, but its green lights are on.", "Los servidores son ordenadores que guardan webs y correo. Este está cerrado tras una rejilla, pero se ven sus luces verdes.") },
  { id: "tech", x: .38, y: .42, n: () => L("The technician", "El técnico"), j: () => L("A person who looks after the servers and cables.", "Una persona que cuida los servidores y los cables.") },
];
function orient(host) {
  host.innerHTML = "";
  const box = document.createElement("div"); box.className = "gear"; host.append(box);
  const seen = new Set();
  const bar = sel => PARTS.map((p, i) => `<button type="button" class="url__p" data-i="${i}" style="--ac:${KIND_C[p.k]}"${sel === i ? ' aria-pressed="true"' : ""}>${p.t}</button>`).join("");
  function phaseA() {
    box.innerHTML = `<div class="gear__lesson">${L("Chapter 6 · Lessons 5 & 6: Names, URLs and Protocols", "Capítulo 6 · Lecciones 5 y 6: Nombres, URL y protocolos")}</div>
      <h3 class="gear__h">${L("A web address has 5 parts: tap each colour", "Una dirección web tiene 5 partes: toca cada color")} <span class="gear__c">${seen.size}/5</span></h3>
      <div class="url__bar">${bar(-1)}</div><p class="url__note" role="status">&nbsp;</p>`;
    const note = box.querySelector(".url__note");
    box.querySelectorAll(".url__p").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.i, p = PARTS[i]; seen.add(i); b.classList.add("on");
      note.innerHTML = `<b style="color:${KIND_C[p.k]}">${p.n()}</b>: ${p.j()}`; box.querySelector(".gear__c").textContent = seen.size + "/5";
      if (seen.size === 5) setTimeout(phaseB, 1700); }));
  }
  function phaseB() {
    const order = shuffle(PARTS.map((_, i) => i), Date.now() & 0xffff); let n = 0, ok = 0;
    const draw = () => {
      if (n >= order.length) { phaseC(); return; }
      const t = PARTS[order[n]];
      box.innerHTML = `<h3 class="gear__h">${L("Find the", "Encuentra")}: <b style="color:${KIND_C[t.k]}">${t.n()}</b> <span class="gear__c">${n + 1}/5</span></h3><div class="url__bar">${bar(-1)}</div><p class="url__note" role="status">&nbsp;</p>`;
      const note = box.querySelector(".url__note");
      box.querySelectorAll(".url__p").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.i;
        if (i === order[n]) { b.classList.add("on"); ok += b.dataset.miss ? 0 : 1; note.textContent = "✓ " + t.n() + ": " + t.j(); setTimeout(() => { n++; draw(); }, 1300); }
        else { b.dataset.miss = "1"; b.classList.remove("shk"); void b.offsetWidth; b.classList.add("shk"); note.textContent = L(`That is the ${PARTS[i].n()}. ${PARTS[i].j()} Try again!`, `Esa es ${PARTS[i].n()}. ${PARTS[i].j()} ¡Inténtalo otra vez!`); } }));
    };
    draw();
  }
  function phaseC() {
    const order = shuffle(HOTS.map((_, i) => i), (Date.now() >> 3) & 0xffff); let n = 0;
    const draw = () => {
      if (n >= order.length) { box.innerHTML = `<h3 class="gear__h">${L("You can label the Internet's real hardware!", "¡Sabes nombrar el equipo real de Internet!")}</h3><p class="gear__cr">${L("Now open the Investigate stage and explore Internet Town.", "Ahora abre la etapa Investigar y explora Ciudad Internet.")}</p><p class="gear__cr">${PHOTO_CREDIT()}</p>`; return; }
      const t = HOTS[order[n]];
      box.innerHTML = `<h3 class="gear__h">${L("In the real photo, tap the", "En la foto real, toca")}: <b>${t.n()}</b> <span class="gear__c">${n + 1}/${HOTS.length}</span></h3>
        <div class="ph"><img src="photos/server-room.jpg" alt="${L("A technician with a laptop beside a server rack and cables", "Un técnico con un portátil junto a un armario de servidores y cables")}">${HOTS.map((h, i) => `<button type="button" class="ph__h" data-i="${i}" style="left:${h.x * 100}%;top:${h.y * 100}%" aria-label="${h.n()}">${i + 1}</button>`).join("")}</div>
        <p class="gear__cr gear__fb" role="status">&nbsp;</p><p class="gear__cr">${PHOTO_CREDIT()}</p>`;
      const fb = box.querySelector(".gear__fb");
      box.querySelectorAll(".ph__h").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.i;
        if (i === order[n]) { b.classList.add("good"); fb.textContent = "✓ " + t.n() + ": " + t.j(); setTimeout(() => { n++; draw(); }, 2200); }
        else { b.classList.remove("shk"); void b.offsetWidth; b.classList.add("shk", "bad"); fb.textContent = L(`That is ${HOTS[i].n().toLowerCase()}. ${HOTS[i].j()} Try again!`, `Eso es ${HOTS[i].n().toLowerCase()}. ${HOTS[i].j()} ¡Inténtalo otra vez!`); } }));
    };
    draw();
  }
  phaseA();
}

/* =====================================================================
   BONUS: Mail Sorter (sorting conveyor, 120 s wall clock, no fail state)
   ===================================================================== */
const BINS = [
  { id: "http", c: "#3b8bff", t: "HTTP" }, { id: "https", c: "#2bf0a0", t: "HTTPS" }, { id: "ftp", c: "#ff8a1f", t: "FTP" },
  { id: "smtp", c: "#ff4d6d", t: "SMTP" }, { id: "get", c: "#a97bff", t: "IMAP / POP" },
];
const BCARDS = [
  { a: "http", e: "🌐", t: () => L("Open a cartoon website", "Abrir una web de dibujos"), h: () => L("HTTP is the language of web pages.", "HTTP es el idioma de las páginas web.") },
  { a: "ftp", e: "⬆️", t: () => L("Upload my website files", "Subir los archivos de mi web"), h: () => L("FTP moves files to a server.", "FTP mueve archivos a un servidor.") },
  { a: "smtp", e: "✉️", t: () => L("Send an email", "Enviar un correo"), h: () => L("SMTP sends mail out.", "SMTP envía el correo.") },
  { a: "get", e: "📱", t: () => L("Read my mail on phone and laptop", "Leer mi correo en móvil y portátil"), h: () => L("IMAP and POP receive mail.", "IMAP y POP reciben el correo.") },
  { a: "https", e: "🔒", t: () => L("Type my bank password safely", "Escribir mi contraseña del banco con seguridad"), h: () => L("HTTPS scrambles data with TLS.", "HTTPS mezcla los datos con TLS.") },
  { a: "http", e: "🖼️", t: () => L("Look at a page of photos", "Ver una página de fotos"), h: () => L("Loading a page is a job for HTTP.", "Cargar una página es trabajo de HTTP.") },
  { a: "ftp", e: "📁", t: () => L("Copy a folder to my server", "Copiar una carpeta a mi servidor"), h: () => L("FTP = File Transfer Protocol.", "FTP = Protocolo de Transferencia de Archivos.") },
  { a: "smtp", e: "💌", t: () => L("Email a letter to Grandma", "Enviar una carta a la abuela"), h: () => L("Sending email is SMTP.", "Enviar correo es SMTP.") },
  { a: "get", e: "📥", t: () => L("Download my new mail", "Descargar mi correo nuevo"), h: () => L("POP and IMAP download mail.", "POP e IMAP descargan el correo.") },
  { a: "https", e: "🛒", t: () => L("Pay in an online shop", "Pagar en una tienda en línea"), h: () => L("Look for the lock: HTTPS.", "Busca el candado: HTTPS.") },
];
function mountBonus(box) {
  const DUR = 120, TRAVEL = 11;
  const launch = () => {
    box.innerHTML = `<div class="hop hop--launch"><div><h3>${L("Bonus round: Mail Sorter", "Ronda bonus: Clasificador de correo")}</h3><p>${L("Jobs ride the belt. Send each one to the right protocol bin. 2 minutes, no losing!", "Los trabajos van por la cinta. Envía cada uno al contenedor del protocolo correcto. 2 minutos, ¡sin perder!")}</p></div>
      <div class="hop__acts"><button class="ar-go" data-p style="--c:#ffd98a">${L("Play", "Jugar")}</button><button class="ar-go ar-go--ghost" data-s>${L("Skip", "Saltar")}</button></div></div>`;
    box.querySelector("[data-p]").addEventListener("click", play);
    box.querySelector("[data-s]").addEventListener("click", () => { box.innerHTML = `<p class="gear__cr">${L("Bonus round skipped. You can still play it any time.", "Ronda bonus saltada. Puedes jugarla cuando quieras.")} <button class="btn btn--ghost" type="button" data-b>${L("Play now", "Jugar ahora")}</button></p>`; box.querySelector("[data-b]").addEventListener("click", play); });
  };
  function play() {
    let left = DUR, score = 0, streak = 0, best = 0, hits = 0, tot = 0, deck = [], belt = [], seq = 0, fbT = 0; const missed = new Set();
    box.innerHTML = `<div class="hop"><div class="hop__top"><span data-t>2:00</span><span data-sc>0 ★</span><span data-st></span></div>
      <div class="belt" aria-hidden="true"><i class="belt__stripe"></i></div><div class="belt__lane" data-lane></div>
      <div class="hop__fb" role="status">&nbsp;</div><div class="bins">${BINS.map((b, i) => `<button type="button" class="bin" data-id="${b.id}" style="--ac:${b.c}"><kbd>${i + 1}</kbd>${b.t}</button>`).join("")}</div></div>`;
    const $q = s => box.querySelector(s), lane = $q("[data-lane]"), fb = $q(".hop__fb");
    const nextCard = () => { if (!deck.length) deck = shuffle(BCARDS.map((_, i) => i), Date.now() & 0xffffff); return BCARDS[deck.pop()]; };
    const spawn = () => { const c = nextCard(), el = document.createElement("div"); el.className = "belt__c"; el.innerHTML = `<span>${c.e}</span><b>${c.t()}</b>`; lane.append(el); belt.push({ c, el, t0: Date.now() }); };
    const say = (t, k) => { fb.textContent = t; fb.className = "hop__fb " + (k || ""); };
    const sendTo = id => { const it = belt[0]; if (!it || left <= 0) return; tot++; const ok = it.c.a === id; belt.shift();
      if (ok) { hits++; streak++; best = Math.max(best, streak); score += 10 + Math.min(streak, 5) * 2; it.el.classList.add("belt__ok"); say("✓ " + it.c.h(), "good"); }
      else { streak = 0; missed.add(it.c.t()); it.el.classList.add("belt__no", "shk"); say(L("It goes in ", "Va en ") + BINS.find(b => b.id === it.c.a).t + " · " + it.c.h(), "bad"); }
      setTimeout(() => it.el.remove(), 700); $q("[data-sc]").textContent = score + " ★"; $q("[data-st]").textContent = streak > 1 ? "🔥 ×" + streak : ""; };
    box.querySelectorAll(".bin").forEach(b => b.addEventListener("click", () => { sendTo(b.dataset.id); b.classList.remove("shk"); void b.offsetWidth; b.classList.add("shk"); }));
    const key = e => { if (/^[1-5]$/.test(e.key) && document.body.contains(box)) sendTo(BINS[+e.key - 1].id); }; document.addEventListener("keydown", key);
    const t0 = Date.now(); spawn();
    const clock = setInterval(() => { const el = (Date.now() - t0) / 1000; left = Math.max(0, DUR - Math.round(el)); $q("[data-t]").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
      if (belt.length < 2 && left > TRAVEL * .6 && (!belt.length || Date.now() - belt[belt.length - 1].t0 > 5200)) spawn();
      belt.slice().forEach(it => { const u = (Date.now() - it.t0) / 1000 / TRAVEL; it.el.style.left = Math.min(92, u * 92) + "%";
        if (u >= 1) { belt.splice(belt.indexOf(it), 1); streak = 0; missed.add(it.c.t()); it.el.remove(); say(L("Too slow, no problem! ", "¡Muy lento, no pasa nada! ") + BINS.find(b => b.id === it.c.a).t + " · " + it.c.h(), "bad"); } });
      if (left <= 0) { clearInterval(clock); document.removeEventListener("keydown", key);
        box.innerHTML = `<div class="hop hop--launch"><div><h3>${L("Round complete!", "¡Ronda completa!")}</h3><p>${L(`Score ${score} · ${hits}/${tot} right · best streak ${best}`, `Puntos ${score} · ${hits}/${tot} correctas · mejor racha ${best}`)}</p>${missed.size ? `<p class="gear__cr">${L("To revisit: ", "Para repasar: ")}${[...missed].join(" · ")}</p>` : ""}</div><div class="hop__acts"><button class="ar-go" data-p style="--c:#ffd98a">${L("Play again", "Jugar otra vez")}</button></div></div>`;
        box.querySelector("[data-p]").addEventListener("click", play); } }, 100);
  }
  launch();
}
