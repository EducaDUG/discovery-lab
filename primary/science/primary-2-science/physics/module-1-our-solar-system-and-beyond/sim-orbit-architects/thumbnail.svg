<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A glowing sun surrounded by colourful orbiting planets on their rings, against a starry sky">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#232a55"/>
      <stop offset="55%" stop-color="#0c0f24"/>
      <stop offset="100%" stop-color="#050611"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ffaa3300"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <g fill="#cfd8ff">
    <circle cx="24" cy="30" r="1.2"/><circle cx="80" cy="18" r="1"/><circle cx="140" cy="200" r="1.4"/>
    <circle cx="360" cy="30" r="1.3"/><circle cx="30" cy="200" r="1"/><circle cx="370" cy="200" r="1.2"/>
    <circle cx="200" cy="14" r="1"/><circle cx="18" cy="120" r="1"/>
  </g>
  <g stroke="#7b86c9" stroke-width="1" fill="none" opacity="0.55">
    <ellipse cx="200" cy="120" rx="60" ry="24"/>
    <ellipse cx="200" cy="120" rx="98" ry="42"/>
    <ellipse cx="200" cy="120" rx="140" ry="62"/>
  </g>
  <circle cx="200" cy="120" r="26" fill="url(#sun)"/>
  <circle cx="200" cy="120" r="12" fill="#fff8ec"/>
  <!-- terrestrial planet on the inner ring -->
  <circle cx="256" cy="130" r="7" fill="#c1553a"/>
  <!-- Jovian planet on the middle ring, with a faint ring system -->
  <ellipse cx="120" cy="94" rx="17" ry="6" fill="none" stroke="#e3c98a" stroke-width="2" opacity="0.85"/>
  <circle cx="120" cy="94" r="11" fill="#d8ae7e"/>
  <!-- far Jovian planet on the outer ring -->
  <circle cx="336" cy="150" r="9" fill="#4f6fd6"/>
  <text x="66" y="222" font-family="Georgia, serif" font-size="15" fill="#eaf0ff" font-weight="700">Orbit Architects</text>
</svg>
